 * where m places a 256 x 256 tile image in target coordinates.
 */
function imageryTiles(p, G, toT, fromT, rect, mpp, maxTiles = 90) {
  const tpl = imageryTemplate(p);
  if (!G || !G.ok || !tpl || !/\{z\}/.test(tpl)) return [];
  const src = IMAGERY[p.geo.source] || IMAGERY.esri;
  const lat0 = G.b.lat0;
  let z = clamp(Math.ceil(Math.log2((156543.034 * Math.cos(lat0 * DEG) * G.s) / Math.max(mpp, 1e-6))), 1, src.maxZ);
  const corners = [[rect[0], rect[1]], [rect[2], rect[1]], [rect[0], rect[3]], [rect[2], rect[3]]].map((c) => localToLL(G, fromT(c)));
  let tx0, tx1, ty0, ty1;
  for (;;) {
    const px = corners.map(([la, lo]) => llToPx(la, lo, z));
    tx0 = Math.floor(Math.min(...px.map((q) => q[0])) / TILE); tx1 = Math.floor(Math.max(...px.map((q) => q[0])) / TILE);
    ty0 = Math.floor(Math.min(...px.map((q) => q[1])) / TILE); ty1 = Math.floor(Math.max(...px.map((q) => q[1])) / TILE);
    if ((tx1 - tx0 + 1) * (ty1 - ty0 + 1) <= maxTiles || z <= 1) break;
    z--;
  }
  const n = 2 ** z;
  const at = (x, y) => { const [la, lo] = pxToLl(x, y, z); return toT(llToLocal(G, la, lo)); };
  const out = [];
  for (let ty = Math.max(0, ty0); ty <= Math.min(n - 1, ty1); ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const P0 = at(tx * TILE, ty * TILE), P1 = at((tx + 1) * TILE, ty * TILE), P2 = at(tx * TILE, (ty + 1) * TILE);
      const x = ((tx % n) + n) % n;
      out.push({
        href: tpl.replace("{z}", z).replace("{x}", x).replace("{y}", ty).replace("{s}", "abc"[(x + ty) % 3]),
        m: [(P1[0] - P0[0]) / TILE, (P1[1] - P0[1]) / TILE, (P2[0] - P0[0]) / TILE, (P2[1] - P0[1]) / TILE, P0[0], P0[1]],
      });
    }
  }
  return out;
}

/** SVG <image> elements for tiles (slightly oversized to hide seams). */
function tilesSvg(tiles) {
  return tiles.map((t) => `<image href="${esc(t.href)}" width="${TILE + 0.6}" height="${TILE + 0.6}" preserveAspectRatio="none" ` +
    `transform="matrix(${t.m.map((v) => +v.toFixed(6)).join(" ")})"/>`).join("");
}

// ---------------------------------------------------------------- KML export
function kmlColor(hex, alpha = "ff") {
  const h = hex.replace("#", "");
  return alpha + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2);
}

/** Google Earth KML of landmarks, points, lines and obstacles. */
function siteKml(p, sol, G) {
  const x = (s) => esc(String(s ?? ""));
  const ll = (X) => { const [la, lo] = localToLL(G, X); return `${lo.toFixed(8)},${la.toFixed(8)},0`; };
  const layerCol = (layer) => ACI_RGB[(LAYERS[layer] || [7])[0]] || "#000000";
  const styles = new Set();
  const style = (id, body) => { styles.add(`<Style id="${id}">${body}</Style>`); return `#${id}`; };
  const marks = [];
  const desc = (rows) => `<description><![CDATA[${rows.filter((r) => r[1]).map(([k, v]) => `<b>${k}:</b> ${String(v).replace(/]]>/g, "")}`).join("<br>")}]]></description>`;
  for (const [id, e] of entities(p)) {
    const c = sol.coords.get(id);
    if (!c) continue;
    const inf = sol.info.get(id);
    const ty = TYPES[e.type] || TYPES[""];
    const sId = e.kind === "lm" ? style("lm", `<IconStyle><color>ff00ffff</color><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/triangle.png</href></Icon></IconStyle>`)
      : style(`pt-${ty.layer}`, `<IconStyle><color>${kmlColor(ty.layer === "FEATURE" ? "#ffffff" : layerCol(ty.layer))}</color><scale>0.8</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle>`);
    marks.push(`<Placemark><name>${x(e.name)}</name><styleUrl>${sId}</styleUrl>` +
      desc([["Description", e.desc], ["Type", e.kind === "lm" ? "Landmark" : ty.name], ["Depth", e.depth],
            ["Local N, E", `${c[1].toFixed(2)}, ${c[0].toFixed(2)} ${unitAbbr(p)}`], ["±95%", inf ? `${inf.r95.toFixed(2)} ${unitAbbr(p)}` : ""]]) +
      `<Point><coordinates>${ll(c)}</coordinates></Point></Placemark>`);
  }
  for (const l of p.lines) {
    const pts = linePoints(sol, l);
    if (pts.length < 2) continue;
    const ty = TYPES[l.type] || TYPES[""];
    const sId = style(`ln-${ty.layer}`, `<LineStyle><color>${kmlColor(ty.layer === "FEATURE" || ty.layer === "PROPERTY" ? "#ffffff" : layerCol(ty.layer))}</color><width>3</width></LineStyle>`);
    marks.push(`<Placemark><name>${x(l.name)}</name><styleUrl>${sId}</styleUrl>${desc([["Type", ty.name], ["Depth", l.depth], ["Description", l.desc]])}` +
      `<LineString><tessellate>1</tessellate><coordinates>${pts.map(ll).join(" ")}</coordinates></LineString></Placemark>`);
  }
  for (const o of p.obstacles) {
    const pts = obstacleCoords(sol, o);
    if (pts.length < 2) continue;
    const sId = style("obs", `<LineStyle><color>ff9a9a9a</color><width>2</width></LineStyle><PolyStyle><color>66c8c8c8</color></PolyStyle>`);
    const geom = o.closed && pts.length >= 3
      ? `<Polygon><outerBoundaryIs><LinearRing><coordinates>${[...pts, pts[0]].map(ll).join(" ")}</coordinates></LinearRing></outerBoundaryIs></Polygon>`
      : `<LineString><coordinates>${pts.map(ll).join(" ")}</coordinates></LineString>`;
    marks.push(`<Placemark><name>${x(o.name)}</name><styleUrl>${sId}</styleUrl>${desc([["Kind", OBSTACLE_KINDS[o.kind].name], ["Description", o.desc]])}${geom}</Placemark>`);
  }
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(p.name)}</name>` +
    `<description>${x(`${p.location} — positions from the site survey, placed by a fit to ${G.n} landmark latitude/longitude${G.n > 1 ? "s" : ""}.`)}</description>` +
    `${[...styles].join("")}${marks.join("")}</Document></kml>\n`;
}

/* =========================================================================
 * Obstacles: buildings, sheds, hedges, walls. Outlines are drawn on the
 * site and, when they block sight lines, used by the Find tool to rule out
 * setups that can't see the spot.
 *
 * A vertex is either the id of a landmark/point (follows its solved
 * position) or a fixed [E, N].
 * ========================================================================= */

const OBSTACLE_KINDS = {
  building: { name: "Building", closed: true, fill: true, layer: "OBSTACLE" },
  structure: { name: "Shed / garage / deck", closed: true, fill: true, layer: "OBSTACLE" },
  trees: { name: "Trees / hedge", closed: true, fill: false, layer: "OBSTACLE-VEG" },
  wall: { name: "Wall / solid fence", closed: false, fill: false, layer: "OBSTACLE" },
  other: { name: "Other", closed: true, fill: false, layer: "OBSTACLE" },
};

/** Resolved vertices of an obstacle (vertices on unlocated points are skipped). */
function obstacleCoords(sol, o) {
  return o.pts.map((v) => (typeof v === "string" ? sol.coords.get(v) : v)).filter(Boolean);
}

/** Obstacles that block sight, with their geometry: [{o, pts, closed}]. */
function blockingShapes(p, sol) {
  const out = [];
  for (const o of p.obstacles) {
    if (!o.blocks) continue;
    const pts = obstacleCoords(sol, o);
    const closed = o.closed && pts.length >= 3;
    if (pts.length >= 2) out.push({ o, pts, closed });
  }
  return out;
}

function pointInPoly(P, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > P[1]) !== (yj > P[1]) && P[0] < ((xj - xi) * (P[1] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function distToSeg(P, A, B) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
  const t = L2 ? clamp(((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / L2, 0, 1) : 0;
  return Math.hypot(P[0] - A[0] - dx * t, P[1] - A[1] - dy * t);
}

/** Closed shape strictly containing P (more than `tol` inside its outline). */
function insideShape(shapes, P, tol) {
  for (const sh of shapes) {
    if (!sh.closed || !pointInPoly(P, sh.pts)) continue;
    let d = Infinity;
    for (let i = 0; i < sh.pts.length; i++) d = Math.min(d, distToSeg(P, sh.pts[i], sh.pts[(i + 1) % sh.pts.length]));
    if (d > tol) return sh.o;
  }
  return null;
}

/**
 * First obstacle the sight line A -> B passes through, or null. Crossings
 * within `tol` of either end don't count (a mark on a wall or a deck post can
 * still be sighted), nor do shapes that contain an end (that end is inside).
 */
function sightBlocker(shapes, A, B, tol) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy);
  if (L < 1e-9) return null;
  const eps = tol / L;
  for (const sh of shapes) {
    if (sh.closed && (insideShape([sh], A, tol) || insideShape([sh], B, tol))) continue;
    const n = sh.pts.length, edges = sh.closed ? n : n - 1;
    for (let i = 0; i < edges; i++) {
      const C = sh.pts[i], D = sh.pts[(i + 1) % n];
      const ex = D[0] - C[0], ey = D[1] - C[1];
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-12) continue;
      const cx = C[0] - A[0], cy = C[1] - A[1];
      const t = (cx * ey - cy * ex) / den, u = (cx * dy - cy * dx) / den;
      if (t > eps && t < 1 - eps && u >= -1e-9 && u <= 1 + 1e-9) return sh.o;
    }
  }
  return null;
}

const sightTol = (p) => (p.units === "m" ? 0.08 : 0.25);

/** Field-book sight lines that pass through a blocking obstacle (outline wrong, or built since). */
function obstacleMessages(p, sol) {
  const shapes = blockingShapes(p, sol);
  if (!shapes.length) return [];
  const ents = entities(p), done = new Set(), out = [];
  for (const o of sol.obs) {
    if (o.kind !== "angle") continue;
    const k = o.at + ">" + o.fs;
    if (done.has(k) || !sol.coords.has(o.at) || !sol.coords.has(o.fs)) continue;
    done.add(k);
    const b = sightBlocker(shapes, sol.coords.get(o.at), sol.coords.get(o.fs), sightTol(p));
    if (b) out.push({ lvl: "info", ids: [o.fs], ref: o.ref,
      msg: `${ents.get(o.at)?.name} → ${ents.get(o.fs)?.name} was sighted, but the line passes through ${b.name || "an obstacle"}. Fine if it was built later; otherwise check its outline.` });
  }
  return out;
}

/* =========================================================================
 * Output: Sheet -> SVG markup (grouped by owner) and Sheet -> DXF (R2013).
 * ========================================================================= */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const n4 = (v) => +v.toFixed(4);

function svgPathD(pts, closed, Y) {
  let d = `M${n4(pts[0][0])} ${Y(pts[0][1])}`;
  const n = pts.length;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const [xa, ya, bulge] = pts[i], [xb, yb] = pts[(i + 1) % n];
    if (Math.abs(bulge || 0) < 1e-9) { d += `L${n4(xb)} ${Y(yb)}`; continue; }
    const theta = 4 * Math.atan(Math.abs(bulge));
    const chord = Math.hypot(xb - xa, yb - ya);
    if (chord < 1e-9) continue;
    const r = chord / (2 * Math.sin(theta / 2));
    // DXF positive bulge = CCW (y up) -> SVG sweep-flag 0 after the y flip
    d += `A${n4(r)} ${n4(r)} 0 ${theta > Math.PI ? 1 : 0} ${bulge > 0 ? 0 : 1} ${n4(xb)} ${Y(yb)}`;
  }
  return closed ? d + "Z" : d;
}

/**
 * SVG markup for a sheet. Entities are grouped per owner as
 * <g data-owner="id">; `minStroke` keeps hairlines visible on screen.
 */
function sheetToSvgContent(sh, { minStroke = 0 } = {}) {
  const Y = (y) => n4(SHEET_H - y);
  const groups = new Map();
  const add = (owner, s) => { if (!groups.has(owner)) groups.set(owner, []); groups.get(owner).push(s); };
  const stroke = (layer) => {
    const [color, lw, dashed] = LAYERS[layer] || [7, 25];
    const w = Math.max(Math.max(lw, 9) / 100 / 25.4, minStroke);
    return `stroke="${ACI_RGB[color] || "#000"}" stroke-width="${n4(w)}"${dashed ? ' stroke-dasharray="0.125 0.0625"' : ""}`;
  };
  for (const e of sh.ents) {
    const col = ACI_RGB[(LAYERS[e.layer] || [7])[0]] || "#000";
    if (e.t === "line") {
      add(e.owner, `<line x1="${n4(e.x0)}" y1="${Y(e.y0)}" x2="${n4(e.x1)}" y2="${Y(e.y1)}" ${stroke(e.layer)}/>`);
    } else if (e.t === "circle") {
      add(e.owner, `<circle cx="${n4(e.x)}" cy="${Y(e.y)}" r="${n4(e.r)}" fill="none" ${stroke(e.layer)}/>`);
    } else if (e.t === "poly") {
      add(e.owner, `<path d="${svgPathD(e.pts, e.closed, Y)}" fill="none" ${stroke(e.layer)}/>`);
    } else if (e.t === "fill") {
      add(e.owner, `<path d="${svgPathD(e.pts, true, Y)}" fill="${col}"${e.layer === "OBSTACLE-FILL" ? ' fill-opacity="0.6"' : ""} stroke="none"/>`);
    } else if (e.t === "text") {
      const [v, hz] = e.align;
      const base = v === "M" ? e.y - e.h / 2 : v === "T" ? e.y - e.h : e.y;
      const anchor = hz === "L" ? "start" : hz === "R" ? "end" : "middle";
      add(e.owner, `<text x="${n4(e.x)}" y="${Y(base)}" font-size="${n4(e.h / sh.font.cap)}" text-anchor="${anchor}"` +
        `${e.bold ? ' font-weight="bold"' : ""} fill="${col}">${esc(e.s)}</text>`);
    }
  }
  let out = "";
  for (const [owner, items] of groups) out += `<g data-owner="${esc(owner)}">${items.join("")}</g>`;
  return out;
}

function sheetToSvg(sh, { width = "100%", height = "100%", minStroke = 0 } = {}) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SHEET_W} ${SHEET_H}" width="${width}" height="${height}" ` +
         `font-family="${sh.font.css.replace(/"/g, "'")}" stroke-linecap="round" stroke-linejoin="round">` +
         `<rect width="${SHEET_W}" height="${SHEET_H}" fill="#fff"/>${sheetToSvgContent(sh, { minStroke })}</svg>`;
}

// ---------------------------------------------------------------------- DXF
/**
 * Splice the entities into the embedded R2013 template (generated by
 * tools/make_dxf_template.py: header, layers, text styles, ANSI B layout).
 */
function sheetToDxf(sh) {
  const tpl = JSON.parse(document.getElementById("dxf-template").textContent);
  let handle = parseInt(tpl.seed, 16);
  const out = [];
  const tag = (code, value) => out.push(String(code).padStart(3, " "), String(value));
  const num = (v) => {
    let s = String(+v.toFixed(6));
    if (s === "-0") s = "0";
    return s.includes(".") || s.includes("e") ? s : s + ".0";
  };
  const head = (type, layer, sub, color) => {
    tag(0, type); tag(5, (handle++).toString(16).toUpperCase()); tag(330, tpl.owner);
    tag(100, "AcDbEntity"); tag(8, layer);
    if (color !== undefined) tag(62, color);
    tag(100, sub);
  };
  const ALIGN_H = { L: 0, C: 1, R: 2 }, ALIGN_V = { B: 1, M: 2, T: 3 };

  for (const e of sh.ents) {
    if (e.t === "line") {
      head("LINE", e.layer, "AcDbLine");
      tag(10, num(e.x0)); tag(20, num(e.y0)); tag(30, "0.0");
      tag(11, num(e.x1)); tag(21, num(e.y1)); tag(31, "0.0");
    } else if (e.t === "poly") {
      head("LWPOLYLINE", e.layer, "AcDbPolyline");
      tag(90, e.pts.length); tag(70, e.closed ? 1 : 0);
      for (const [x, y, b] of e.pts) {
        tag(10, num(x)); tag(20, num(y));
        if (b) tag(42, num(b));
      }
    } else if (e.t === "circle") {
      head("CIRCLE", e.layer, "AcDbCircle");
      tag(10, num(e.x)); tag(20, num(e.y)); tag(30, "0.0"); tag(40, num(e.r));
    } else if (e.t === "text") {
      head("TEXT", e.layer, "AcDbText");
      tag(10, num(e.x)); tag(20, num(e.y)); tag(30, "0.0"); tag(40, num(e.h));
      tag(1, e.s.replace(/%%/g, "%%%")); tag(7, e.bold ? "SV-BOLD" : "SV-STD");
      const hz = ALIGN_H[e.align[1]];
      if (hz) tag(72, hz);
      tag(11, num(e.x)); tag(21, num(e.y)); tag(31, "0.0");
      tag(100, "AcDbText"); tag(73, ALIGN_V[e.align[0]]);
    } else if (e.t === "fill") {
      const bulges = e.pts.some((p) => p[2]);
      head("HATCH", e.layer, "AcDbHatch", LAYERS[e.layer][0]);
      tag(10, "0.0"); tag(20, "0.0"); tag(30, "0.0");
      tag(210, "0.0"); tag(220, "0.0"); tag(230, "1.0");
      tag(2, "SOLID"); tag(70, 1); tag(71, 0);
      tag(91, 1); tag(92, 3); tag(72, bulges ? 1 : 0); tag(73, 1); tag(93, e.pts.length);
      for (const [x, y, b] of e.pts) {
        tag(10, num(x)); tag(20, num(y));
        if (bulges) tag(42, num(b || 0));
      }
      tag(97, 0); tag(75, 1); tag(76, 1); tag(98, 0);
    }
  }
  const [reg, bold] = sh.font.files;
  return tpl.dxf
    .replace("\n  3\narial.ttf\n", () => `\n  3\n${reg}\n`)
    .replace("\n  3\narialbd.ttf\n", () => `\n  3\n${bold}\n`)
    .replace("%%ENTITIES%%", () => (out.length ? out.join("\n") + "\n" : ""))
    .replace("%%HANDSEED%%", () => handle.toString(16).toUpperCase());
}

/* =========================================================================
 * Drawing the site: shared by the on-screen map, the ANSI B plan sheet,
 * the report figure and the 1:1 DXF.
 * ========================================================================= */

/**
 * Draw the site into `sh`. T maps world [E, N] to sheet [x, y].
 * o: {th: text height, sym: symbol size, sights, ellipses (exaggeration or 0),
 *     letterEvery: spacing of utility letters (sheet units), hi: Set of ids to emphasise}
 */
function drawSite(sh, p, sol, T, o) {
  const th = o.th, sym = o.sym;
  const placed = [];   // label boxes, to keep labels apart
  const font = sh.font;
  const XY = (id) => (sol.coords.has(id) ? T(sol.coords.get(id)) : null);

  // obstacles, beneath everything else
  for (const ob of p.obstacles || []) {
    const pts = obstacleCoords(sol, ob).map(T);
    if (pts.length < 2) continue;
    const k = OBSTACLE_KINDS[ob.kind];
    const closed = ob.closed && pts.length >= 3;
    sh.owner = "obs:" + ob.id;
    if (closed && k.fill) sh.fill(pts, "OBSTACLE-FILL");
    sh.poly(pts, ob.blocks ? k.layer : "OBSTACLE-LOW", closed);
    if (!ob.name || o.labels === false) continue;
    const h = th * 0.85, w = textWidth(ob.name, h, false, font);
    let c;
    if (closed) {
      const bb = pts.reduce((b, q) => R.union(b, [q[0], q[1], q[0], q[1]]), null);
      if (R.w(bb) < w * 1.15 || R.h(bb) < h * 2) continue;
      c = [pts.reduce((a, q) => a + q[0], 0) / pts.length, pts.reduce((a, q) => a + q[1], 0) / pts.length];
      if (!pointInPoly(c, pts)) continue;
    } else {
      let li = 1;
      for (let i = 1; i < pts.length; i++) if (Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]) > Math.hypot(pts[li][0] - pts[li - 1][0], pts[li][1] - pts[li - 1][1])) li = i;
      c = [(pts[li][0] + pts[li - 1][0]) / 2, (pts[li][1] + pts[li - 1][1]) / 2 + h];
    }
    sh.text(ob.name, c[0], c[1], h, "MC", "TEXT-MINOR");
    placed.push([c[0] - w / 2, c[1] - h / 2, c[0] + w / 2, c[1] + h / 2]);
  }

  // sight lines
  if (o.sights) {
    const seen = new Set();
    for (const ob of sol.obs) {
      if (ob.kind !== "angle") continue;
      const k = ob.at + ">" + ob.fs;
      if (seen.has(k)) continue;
      seen.add(k);
      const a = XY(ob.at), b = XY(ob.fs);
      if (!a || !b) continue;
      sh.owner = "sight:" + k;
      sh.line(a[0], a[1], b[0], b[1], "SIGHT");
    }
  }

  // lines (utilities, fences, property lines)
  for (const line of p.lines) {
    const pts = line.pts.map(XY).filter(Boolean);
    if (pts.length < 2) continue;
    const ty = TYPES[line.type] || TYPES[""];
    sh.owner = "line:" + line.id;
    const letter = ty.letter;
    if (!letter || !o.letterEvery) { sh.poly(pts, ty.layer); continue; }
    // letters sit mid-segment (away from the point symbols), the line broken around them
    const lw = sh.width(letter, th * 0.9, true) + th * 0.8;
    const clearEnds = sym * 0.6 + lw / 2;
    for (let i = 1; i < pts.length; i++) {
      const [a, b] = [pts[i - 1], pts[i]];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const at = (t) => [a[0] + ((b[0] - a[0]) * t) / L, a[1] + ((b[1] - a[1]) * t) / L];
      const usable = L - 2 * clearEnds;
      const n = usable <= 0 ? 0 : Math.max(1, Math.round(usable / o.letterEvery));
      let s0 = 0;
      for (let k = 0; k < n; k++) {
        const m = clearEnds + (usable * (k + 0.5)) / n;
        sh.poly([at(s0), at(m - lw / 2)], ty.layer);
        const c = at(m);
        sh.text(letter, c[0], c[1], th * 0.9, "MC", ty.layer, true);
        s0 = m + lw / 2;
      }
      sh.poly([at(s0), b], ty.layer);
    }
  }

  // error ellipses (95 %, exaggerated)
  if (o.ellipses) {
    for (const [id, inf] of sol.info) {
      const c = XY(id);
      if (!c || !inf.ellipse || inf.ellipse.a < 1e-9) continue;
      const e = inf.ellipse, k = 2.4477 * o.ellipses * (o.k || 1);
      const pts = [];
      for (let i = 0; i < 48; i++) {
        const t = (i / 48) * TAU;
        const u = e.a * k * Math.cos(t), v = e.b * k * Math.sin(t);
        // u along the major axis (azimuth e.az), v across it
        pts.push([c[0] + u * Math.sin(e.az) + v * Math.cos(e.az), c[1] + u * Math.cos(e.az) - v * Math.sin(e.az)]);
      }
      sh.owner = id;
      sh.poly(pts, "ELLIPSE", true);
    }
  }

  // symbols, then labels avoiding each other
  const items = [];
  for (const l of p.landmarks) {
    const c = XY(l.id);
    if (!c) continue;
    sh.owner = l.id;
    const s = sym;
    sh.poly([[c[0], c[1] + s * 0.62], [c[0] - s * 0.54, c[1] - s * 0.31], [c[0] + s * 0.54, c[1] - s * 0.31]], "CONTROL", true);
    sh.fill([[c[0] - s * 0.08, c[1], 1], [c[0] + s * 0.08, c[1], 1]]);
    placed.push([c[0] - s * 0.55, c[1] - s * 0.35, c[0] + s * 0.55, c[1] + s * 0.65]);
    items.push({ id: l.id, c, name: l.name, bold: true, r: s * 0.6, layer: "TEXT" });
  }
  for (const x of p.points) {
    const c = XY(x.id);
    if (!c) continue;
    const ty = TYPES[x.type] || TYPES[""];
    sh.owner = x.id;
    const r = sym * 0.22;
    sh.circle(c[0], c[1], r, ty.layer === "FEATURE" || ty.layer === "PROPERTY" ? "POINT" : ty.layer);
    sh.fill([[c[0] - r * 0.35, c[1], 1], [c[0] + r * 0.35, c[1], 1]]);
    placed.push([c[0] - r, c[1] - r, c[0] + r, c[1] + r]);
    items.push({ id: x.id, c, name: x.name, bold: false, r, layer: "LABEL" });
  }
  if (o.labels !== false) {
    for (const it of items) {
      const h = it.bold ? th * 1.05 : th;
      const w = textWidth(it.name, h, it.bold, font);
      const g = it.r + th * 0.35;
      const cands = [["BL", g, g * 0.6], ["BR", -g, g * 0.6], ["TL", g, -g * 0.6], ["TR", -g, -g * 0.6],
                     ["ML", g * 1.2, 0], ["MR", -g * 1.2, 0]];
      let pick = null;
      for (const [al, dx, dy] of cands) {
        const x = it.c[0] + dx, y = it.c[1] + dy;
        const x0 = al[1] === "L" ? x : x - w;
        const y0 = al[0] === "B" ? y : al[0] === "T" ? y - h : y - h / 2;
        const box = [x0, y0, x0 + w, y0 + h];
        const hit = placed.some((b) => R.overlaps(R.inflate(box, th * 0.15), b));
        if (!pick || !hit) pick = { al, x, y, box, hit };
        if (!hit) break;
      }
      placed.push(pick.box);
      sh.owner = it.id;
      sh.text(it.name, pick.x, pick.y, h, pick.al, it.layer, it.bold);
    }
  }
  sh.owner = "sheet";
}

/** Extents of located points and obstacle outlines (world), or null. */
function siteExtents(sol, p = null) {
  let b = null;
  for (const [, c] of sol.coords) b = R.union(b, [c[0], c[1], c[0], c[1]]);
  for (const o of p ? p.obstacles : []) for (const c of obstacleCoords(sol, o)) b = R.union(b, [c[0], c[1], c[0], c[1]]);
  return b;
}

// --------------------------------------------------------------- plan sheet
const SCALES = {
  ft: [5, 10, 20, 30, 40, 50, 60, 80, 100, 150, 200, 300, 400, 500, 1000, 2000],   // feet per inch
  m: [50, 100, 200, 250, 500, 1000, 1250, 2000, 2500, 5000, 10000, 20000],        // 1:n
};
const unitsPerInch = (p, s) => (p.units === "m" ? (s * 0.0254) : s);
const scaleText = (p, s) => (p.units === "m" ? `1:${s}` : `1" = ${s}'`);

function niceStep(x) {
  const e = 10 ** Math.floor(Math.log10(x));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= x) return m * e;
  return 10 * e;
}

function drawBorder(sh) {
  sh.rect(FRAME, FRAME, SHEET_W - FRAME, SHEET_H - FRAME, "FRAME-THIN");
  sh.rect(IX0, IY0, IX1, IY1, "FRAME");
  const ncol = 8, nrow = 4;
  const zw = (SHEET_W - 2 * FRAME) / ncol, zh = (SHEET_H - 2 * FRAME) / nrow;
  for (let i = 0; i < ncol; i++) {
    const x0 = SHEET_W - FRAME - (i + 1) * zw;
    if (i < ncol - 1) { sh.line(x0, FRAME, x0, IY0, "FRAME-THIN"); sh.line(x0, IY1, x0, SHEET_H - FRAME, "FRAME-THIN"); }
    for (const yc of [FRAME + BAND / 2, SHEET_H - FRAME - BAND / 2]) sh.text(String(i + 1), x0 + zw / 2, yc, 0.11);
  }
  for (let j = 0; j < nrow; j++) {
    const y0 = FRAME + j * zh;
    if (j) { sh.line(FRAME, y0, IX0, y0, "FRAME-THIN"); sh.line(IX1, y0, SHEET_W - FRAME, y0, "FRAME-THIN"); }
    for (const xc of [FRAME + BAND / 2, SHEET_W - FRAME - BAND / 2]) sh.text("ABCD"[j], xc, y0 + zh / 2, 0.11);
  }
}

function cell(sh, x0, y0, x1, y1, label, value, { vh = 0.11, bold = false, align = "left", maxLines = 2 } = {}) {
  sh.text(label, x0 + 0.05, y1 - 0.05, 0.055, "TL", "TEXT-MINOR");
  sh.textBox(value, x0, y0, x1, y1 - 0.09, vh, { hMin: 0.06, align, bold, maxLines });
}

function drawTitleBlock(sh, p, scaleStr) {
  const tb = p.titleblock;
  const up = (v, def = "") => String(v || def).toUpperCase();
  const x0 = IX1 - TB_W, y0 = IY0, x1 = IX1, y1 = IY0 + TB_H;
  sh.rect(x0, y0, x1, y1, "TITLE");
  const ys = [y1];
  for (const h of [0.40, 0.45, 0.35, 0.35]) ys.push(ys[ys.length - 1] - h);
  for (const y of ys.slice(1, -1)) sh.line(x0, y, x1, y, "TITLE-GRID");
  cell(sh, x0, ys[1], x1, ys[0], "PROJECT / PROPERTY", up(tb.project || p.location), { vh: 0.14, bold: true, maxLines: 1 });
  cell(sh, x0, ys[2], x1, ys[1], "DRAWING TITLE", up(tb.title, `${p.name} — SITE SURVEY`), { vh: 0.13, bold: true });
  const k = TB_W / 4.6;
  const row3 = [["DRAWN BY", up(tb.drawn_by || p.surveyor), 1.6], ["DATE", tb.date || isoToday(), 1.5], ["SCALE", up(scaleStr), 1.5]];
  const row4 = [["SIZE", "B", 0.55], ["DWG NO.", up(tb.dwg_no), 2.15], ["REV", up(tb.rev), 0.55], ["SHEET", up(tb.sheet, "1 OF 1"), 1.35]];
  for (const [row, ya, yb] of [[row3, ys[3], ys[2]], [row4, ys[4], ys[3]]]) {
    let x = x0;
    row.forEach(([lab, val, w], i) => {
      w *= k;
      if (i) sh.line(x, ya, x, yb, "TITLE-GRID");
      cell(sh, x, ya, x + w, yb, lab, val, { vh: lab === "SIZE" ? 0.15 : 0.11, align: "center", maxLines: 1, bold: lab === "SIZE" || lab === "REV" });
      x += w;
    });
  }
}

/** Notes printed on the plan: the datum and precision basis, then the user's notes. */
/** "3°58'12\" west of true north" for a grid-north azimuth theta. */
function gridNorthText(theta) {
  return `${fmtDMS(Math.abs(theta)).replace(/^0+(?=\d)/, "")} ${theta < 0 ? "west" : "east"} of true north`;
}

function planNotes(p, sol, G = null) {
  const ents = entities(p);
  const nm = (id) => ents.get(id)?.name || "?";
  const u = unitAbbr(p);
  const auto = [
    `Local coordinates in ${UNITS[p.units].name}: ${nm(p.datum.origin)} = N ${p.datum.originN.toFixed(2)}, E ${p.datum.originE.toFixed(2)}.`,
    `Basis of bearings: ${nm(p.datum.origin)} to ${nm(p.datum.orient)} = ${fmtBearing(parseBearing(p.datum.bearing))}.`,
    `Positions adjusted by least squares from ${sol.obs.filter((o) => o.kind === "angle").length} angles and ${sol.obs.filter((o) => o.kind === "dist").length} distances; ` +
      `angle reading precision ${p.angleSigma}". ± values are 95% radii (${u}).`,
  ];
  if (sol.unscaled) auto.push("NO MEASURED DISTANCE: drawing is to an arbitrary scale.");
  if (G && G.ok && !G.single) auto.push(`Grid north is ${gridNorthText(G.theta)} (fit to latitude/longitude of ${G.n} landmarks, ±${fmtDMS(2 * G.sigTheta).replace(/^0°/, "")}).`);
  return [...auto, ...p.notes.filter((n) => n.trim())];
}

function notesBlock(sh, notes, x0, x1, y0) {
  const h = 0.075, w = x1 - x0 - 0.45;
  const blocks = notes.map((n) => sh.wrap(n, w, h));
  const need = 0.26 + blocks.reduce((a, b) => a + b.length, 0) * h * LINE_SPACING + 0.05;
  const y1 = y0 + need;
  sh.rect(x0, y0, x1, y1, "TITLE");
  sh.text("NOTES", x0 + 0.08, y1 - 0.07, 0.08, "TL", "TEXT", true);
  let y = y1 - 0.26 - h / 2;
  blocks.forEach((b, i) => {
    sh.text(`${i + 1}.`, x0 + 0.1, y, h, "ML");
    for (const ln of b) { sh.text(ln, x0 + 0.33, y, h, "ML"); y -= h * LINE_SPACING; }
  });
  return y1;
}

/** Coordinate table in the right-hand column. Returns the y of its bottom edge. */
function table(sh, x0, x1, yTop, yMin, title, cols, rows) {
  const rh = 0.155, th = 0.07, hh = 0.2;
  let y = yTop;
  sh.text(title, x0, y - 0.02, 0.085, "TL", "TEXT", true);
  y -= 0.16;
  const W = x1 - x0;
  const widths = cols.map((c) => c.w * W);
  const head = y;
  sh.rect(x0, y - hh, x1, y, "TITLE");
  let x = x0;
  cols.forEach((c, i) => { sh.textBox(c.name, x, y - hh, x + widths[i], y, 0.06, { align: "center", bold: true, pad: 0.02, maxLines: 1 }); x += widths[i]; });
  y -= hh;
  const room = Math.max(0, Math.floor((y - yMin) / rh));
  const shown = rows.length > room ? rows.slice(0, Math.max(0, room - 1)) : rows;
  for (const r of shown) {
    x = x0;
    cols.forEach((c, i) => {
      sh.textBox(String(r[i] ?? ""), x, y - rh, x + widths[i], y, th, { hMin: 0.05, align: c.align || "left", pad: 0.03, maxLines: 1, layer: i ? "LABEL" : "TEXT", bold: i === 0 });
      x += widths[i];
    });
    y -= rh;
    sh.line(x0, y, x1, y, "TITLE-GRID");
  }
  if (shown.length < rows.length) {
    sh.text(`… ${rows.length - shown.length} more — see the survey report`, x0 + 0.05, y - rh / 2, th, "ML", "TEXT-MINOR");
    y -= rh;
  }
  sh.rect(x0, y, x1, head, "TITLE");
  x = x0;
  for (let i = 0; i < cols.length - 1; i++) { x += widths[i]; sh.line(x, y, x, head, "TITLE-GRID"); }
  return y;
}

function chooseScale(p, ext, w, h) {
  const list = SCALES[p.units];
  if (p.plotScale && list.includes(+p.plotScale)) return +p.plotScale;
  const W = Math.max(R.w(ext), 1e-6), H = Math.max(R.h(ext), 1e-6);
  return list.find((s) => W / unitsPerInch(p, s) <= w && H / unitsPerInch(p, s) <= h) || list[list.length - 1];
}

/** The ANSI B plan sheet. */
function renderPlan(p, sol, opts = {}) {
  const sh = new Sheet(FONTS[p.font] || FONTS[DEFAULT_FONT]);
  drawBorder(sh);
  const ext = siteExtents(sol, p) || [0, 0, 1, 1];
  const mx0 = IX0 + 0.2, my0 = IY0 + 0.2, mx1 = IX1 - TB_W - 0.25, my1 = IY1 - 0.2;
  const margin = 0.6;
  const scale = chooseScale(p, ext, mx1 - mx0 - 2 * margin, my1 - my0 - 2 * margin);
  const upi = unitsPerInch(p, scale);
  const scaleStr = scaleText(p, scale);
  drawTitleBlock(sh, p, scaleStr);
  // map frame and transform (centred)
  sh.rect(mx0, my0, mx1, my1, "MAP-FRAME");
  const cx = (mx0 + mx1) / 2, cy = (my0 + my1) / 2;
  const ec = [R.cx(ext), R.cy(ext)];
  const T = (w) => [cx + (w[0] - ec[0]) / upi, cy + (w[1] - ec[1]) / upi];
  const Ti = (x, y) => [ec[0] + (x - cx) * upi, ec[1] + (y - cy) * upi];

  // coordinate grid: ticks every ~1.5 in, labelled on the frame
  const step = niceStep(1.5 * upi);
  const [we0] = Ti(mx0, my0), [we1] = Ti(mx1, my1);
  const wn0 = Ti(mx0, my0)[1], wn1 = Ti(mx1, my1)[1];
  const tick = 0.06;
  for (let e = Math.ceil(we0 / step) * step; e <= we1; e += step) {
    const x = T([e, 0])[0];
    if (x < mx0 + 0.3 || x > mx1 - 0.3) continue;
    sh.line(x, my0, x, my0 + 0.1, "GRID"); sh.line(x, my1, x, my1 - 0.1, "GRID");
    sh.text(`E ${e.toFixed(0)}`, x, my0 + 0.14, 0.06, "BC", "TEXT-MINOR");
    for (let n = Math.ceil(wn0 / step) * step; n <= wn1; n += step) {
      const y = T([0, n])[1];
      if (y < my0 + 0.3 || y > my1 - 0.3) continue;
      sh.line(x - tick, y, x + tick, y, "GRID"); sh.line(x, y - tick, x, y + tick, "GRID");
    }
  }
  for (let n = Math.ceil(wn0 / step) * step; n <= wn1; n += step) {
    const y = T([0, n])[1];
    if (y < my0 + 0.3 || y > my1 - 0.3) continue;
    sh.line(mx0, y, mx0 + 0.1, y, "GRID"); sh.line(mx1, y, mx1 - 0.1, y, "GRID");
    sh.text(`N ${n.toFixed(0)}`, mx0 + 0.14, y, 0.06, "ML", "TEXT-MINOR");
  }

  drawSite(sh, p, sol, T, { th: 0.08, sym: 0.14, sights: opts.sights ?? !!p.planSights, ellipses: 0, letterEvery: 1.4, k: 1 / upi });

  // north arrow (grid north) and scale bar
  const nx = mx1 - 0.55, ny = my1 - 0.85;
  sh.owner = "north";
  sh.circle(nx, ny, 0.28, "NORTH");
  sh.fill([[nx, ny + 0.36], [nx - 0.1, ny - 0.18], [nx, ny - 0.08]]);
  sh.poly([[nx, ny + 0.36], [nx + 0.1, ny - 0.18], [nx, ny - 0.08]], "NORTH", true);
  sh.text("N", nx, ny + 0.46, 0.13, "BC", "TEXT", true);
  sh.text("GRID", nx, ny - 0.36, 0.055, "TC", "TEXT-MINOR");
  const G = opts.geo;
  if (G && G.ok && !G.single) {
    // true north: a thin line at azimuth -theta from the arrow's centre
    const a = -G.theta, L = 0.5;
    const ex = nx + L * Math.sin(a), ey = ny + L * Math.cos(a);
    sh.line(nx + 0.3 * Math.sin(a), ny + 0.3 * Math.cos(a), ex, ey, "NORTH");
    sh.text("TN", ex + 0.06 * Math.sign(Math.sin(a) || 1), ey + 0.02, 0.06, Math.sin(a) < 0 ? "BR" : "BL", "TEXT-MINOR");
  }
  const barUnit = niceStep(upi * 0.75);   // one block ~0.75 in
  const bw = barUnit / upi, bx = mx0 + 0.35, by = my0 + 0.45;
  for (let i = 0; i < 4; i++) {
    const r = [bx + i * bw, by, bx + (i + 1) * bw, by + 0.07];
    if (i % 2 === 0) sh.fill([[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]]]);
    sh.rect(...r, "NORTH");
    sh.text(String(+(i * barUnit).toFixed(2)), bx + i * bw, by + 0.11, 0.06, "BC", "TEXT-MINOR");
  }
  sh.text(`${+(4 * barUnit).toFixed(2)} ${unitAbbr(p).toUpperCase()}`, bx + 4 * bw, by + 0.11, 0.06, "BC", "TEXT-MINOR");
  sh.text(`SCALE ${scaleStr}`, bx, by - 0.07, 0.075, "TL", "TEXT", true);
  sh.owner = "sheet";

  // right column: notes above the title block, tables above them
  const cx0 = IX1 - TB_W, cx1 = IX1;
  const notesTop = notesBlock(sh, planNotes(p, sol, opts.geo), cx0, cx1, IY0 + TB_H);
  const lmRows = p.landmarks.filter((l) => sol.coords.has(l.id)).map((l) => {
    const c = sol.coords.get(l.id);
    return [l.name, c[1].toFixed(2), c[0].toFixed(2), l.desc];
  });
  let y = IY1 - 0.15;
  y = table(sh, cx0 + 0.1, cx1 - 0.1, y, notesTop + 1.2, "CONTROL (LANDMARKS)",
    [{ name: "NAME", w: 0.15 }, { name: "NORTHING", w: 0.17, align: "right" }, { name: "EASTING", w: 0.17, align: "right" },
     { name: "DESCRIPTION", w: 0.51 }], lmRows);
  const ptRows = p.points.filter((x) => sol.coords.has(x.id)).map((x) => {
    const c = sol.coords.get(x.id), inf = sol.info.get(x.id);
    return [x.name, (TYPES[x.type] || TYPES[""]).name, c[1].toFixed(2), c[0].toFixed(2), inf ? inf.r95.toFixed(2) : "", x.depth];
  });
  table(sh, cx0 + 0.1, cx1 - 0.1, y - 0.2, notesTop + 0.1, "POINTS",
    [{ name: "NAME", w: 0.13 }, { name: "TYPE", w: 0.2 }, { name: "NORTHING", w: 0.17, align: "right" },
     { name: "EASTING", w: 0.17, align: "right" }, { name: "±95%", w: 0.11, align: "right" }, { name: "DEPTH", w: 0.22 }], ptRows);
  return { sheet: sh, scale, upi, T, Ti, frame: [mx0, my0, mx1, my1] };
}

/**
 * Imagery for the printed plan: tiles at ~200 dpi clipped to the map frame,
 * as SVG to place right after the sheet's white background.
 */
function planImagery(p, G, plan) {
  if (!G || !G.ok) return { svg: "", tiles: [] };
  const [x0, y0, x1, y1] = plan.frame;
  const toS = (w) => { const q = plan.T(w); return [q[0], SHEET_H - q[1]]; };
  const tiles = imageryTiles(p, G, toS, (q) => plan.Ti(q[0], SHEET_H - q[1]), [x0, SHEET_H - y1, x1, SHEET_H - y0], (plan.upi * G.u * G.s) / 200, 150);
  const attr = p.geo.source === "custom" ? "" : IMAGERY[p.geo.source].attr;
  const svg = `<defs><clipPath id="mapclip"><rect x="${x0}" y="${SHEET_H - y1}" width="${x1 - x0}" height="${y1 - y0}"/></clipPath></defs>` +
    `<g clip-path="url(#mapclip)"><g opacity="${p.geo.opacity}">${tilesSvg(tiles)}</g>` +
    (attr ? `<text x="${x1 - 0.06}" y="${SHEET_H - y0 - 0.06}" text-anchor="end" font-size="0.075" fill="#fff" stroke="#000" stroke-width="0.012" paint-order="stroke">${esc(attr)}</text>` : "") + `</g>`;
  return { svg, tiles };
}

// --------------------------------------------------------- 1:1 DXF and CSV
/** Site in world units (1:1), text sized for plotting at the plan scale. */
function renderSiteWorld(p, sol) {
  const ext = siteExtents(sol, p) || [0, 0, 1, 1];
  const scale = chooseScale(p, ext, IX1 - TB_W - IX0 - 2.2, IY1 - IY0 - 2.2);
  const upi = unitsPerInch(p, scale);
  const sh = new Sheet(FONTS[p.font] || FONTS[DEFAULT_FONT]);
  drawSite(sh, p, sol, (w) => w, { th: 0.08 * upi, sym: 0.14 * upi, sights: true, ellipses: 0, letterEvery: 1.4 * upi, k: 1 });
  return sh;
}

function worldDxf(p, sol) {
  const dxf = sheetToDxf(renderSiteWorld(p, sol));
  // drawing units: feet (2) or metres (6)
  return dxf.replace("$INSUNITS\n 70\n1\n", `$INSUNITS\n 70\n${p.units === "m" ? 6 : 2}\n`);
}

/** PNEZD-style CSV: point, northing, easting, (blank elevation), description. */
function coordinatesCsv(p, sol, G = null) {
  const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const geo = G && G.ok;
  const rows = [["Point", "Northing", "Easting", "Elevation", "Description", "Kind", "Type", "Depth", "Plus/minus 95%", "Checked",
                 ...(geo ? ["Latitude", "Longitude"] : [])]];
  for (const [id, ent] of entities(p)) {
    const c = sol.coords.get(id);
    if (!c) continue;
    const inf = sol.info.get(id);
    rows.push([ent.name, c[1].toFixed(3), c[0].toFixed(3), "", ent.desc, ent.kind === "lm" ? "landmark" : "point",
               ent.kind === "pt" ? (TYPES[ent.type] || TYPES[""]).name : "control", ent.depth || "", inf ? inf.r95.toFixed(3) : "",
               inf && inf.checked ? "yes" : "no", ...(geo ? localToLL(G, c).map((v) => v.toFixed(8)) : [])]);
  }
  return rows.map((r) => r.map((v, i) => (i === 1 || i === 2 || (i > 9 && r !== rows[0]) ? v : q(v))).join(",")).join("\r\n");
}

/* =========================================================================
 * Interactive map (screen pixels, y up internally) and the SVG converter
 * used for it and for the report figure.
 * ========================================================================= */

/** Sheet in pixel units -> SVG markup (height H for the y flip). Groups by owner. */
function sheetToPxSvg(sh, H, { strokeScale = 1 } = {}) {
  const Y = (y) => +(H - y).toFixed(2);
  const f = (v) => +v.toFixed(2);
  const groups = new Map();
  const add = (o, s) => { if (!groups.has(o)) groups.set(o, []); groups.get(o).push(s); };
  const col = (layer) => ACI_RGB[(LAYERS[layer] || [7])[0]] || "#000";
  const stroke = (layer) => {
    const [, lw, dashed] = LAYERS[layer] || [7, 25];
    const w = Math.max(0.9, (Math.max(lw, 13) / 100 / 25.4) * 96 * strokeScale);
    return `stroke="${col(layer)}" stroke-width="${w.toFixed(2)}"${dashed ? ` stroke-dasharray="${(6 * strokeScale).toFixed(1)} ${(4 * strokeScale).toFixed(1)}"` : ""}`;
  };
  for (const e of sh.ents) {
    if (e.t === "line") add(e.owner, `<line x1="${f(e.x0)}" y1="${Y(e.y0)}" x2="${f(e.x1)}" y2="${Y(e.y1)}" ${stroke(e.layer)}/>`);
    else if (e.t === "circle") add(e.owner, `<circle cx="${f(e.x)}" cy="${Y(e.y)}" r="${f(e.r)}" fill="#fff" ${stroke(e.layer)}/>`);
    else if (e.t === "poly") add(e.owner, `<path d="${svgPathD(e.pts, e.closed, Y)}" fill="${e.closed && e.layer === "CONTROL" ? "#fff" : "none"}" ${stroke(e.layer)}/>`);
    else if (e.t === "fill") add(e.owner, `<path d="${svgPathD(e.pts, true, Y)}" fill="${col(e.layer)}"${e.layer === "OBSTACLE-FILL" ? ' fill-opacity="0.45"' : ""} stroke="none"/>`);
    else if (e.t === "text") {
      const [v, hz] = e.align;
      const base = v === "M" ? e.y - e.h / 2 : v === "T" ? e.y - e.h : e.y;
      const anchor = hz === "L" ? "start" : hz === "R" ? "end" : "middle";
      add(e.owner, `<text x="${f(e.x)}" y="${Y(base)}" font-size="${f(e.h / sh.font.cap)}" text-anchor="${anchor}"` +
        `${e.bold ? ' font-weight="bold"' : ""} fill="${col(e.layer)}" paint-order="stroke" stroke="#fff" stroke-width="${(2.5 * strokeScale).toFixed(1)}" stroke-linejoin="round">${esc(e.s)}</text>`);
    }
  }
  let out = "";
  for (const [o, items] of groups) out += `<g data-owner="${esc(o)}">${items.join("")}</g>`;
  return out;
}

const MAP = {
  view: null,          // {cx, cy, ppu}
  opts: { sights: true, ellipses: true, labels: true },
  onPick: null,        // (worldXY, ownerId) => void
  find: null,          // {target: [E, N], setups: [option...]}
  selected: null,
  geo: null,           // georeference (06-geo) for the imagery
  edit: null,          // {pts: [[E, N] | null (vertex on a point)...], closed} obstacle being drawn
  banner: "",          // instruction shown while picking on the map
  onVertexDrag: null,  // (index, worldXY, done) => void
};

function mapSize() {
  const r = $("#mapSvg").getBoundingClientRect();
  return [Math.max(200, r.width), Math.max(200, r.height)];
}

function mapFit(sol, p = APP.p) {
  const ext = siteExtents(sol, p);
  const [W, H] = mapSize();
  if (!ext) { MAP.view = { cx: 5000, cy: 5000, ppu: 3 }; return; }
  const w = Math.max(R.w(ext), 10), h = Math.max(R.h(ext), 10);
  MAP.view = { cx: R.cx(ext), cy: R.cy(ext), ppu: Math.min((W - 140) / w, (H - 120) / h) };
}

const mapT = () => {
  const [W, H] = mapSize(), v = MAP.view;
  return { T: (w) => [(w[0] - v.cx) * v.ppu + W / 2, (w[1] - v.cy) * v.ppu + H / 2],
           Ti: (x, y) => [v.cx + (x - W / 2) / v.ppu, v.cy + (y - H / 2) / v.ppu], W, H };
}

function renderMap(p, sol) {
  if (!MAP.view) mapFit(sol, p);
  const { T, W, H } = mapT();
  const sh = new Sheet(FONTS[p.font] || FONTS[DEFAULT_FONT]);
  // ellipse exaggeration: largest 95 % ellipse drawn ~ 18 px
  let maxR = 0;
  for (const [, inf] of sol.info) maxR = Math.max(maxR, inf.r95 || 0);
  const exag = maxR > 0 ? Math.max(1, Math.round(18 / (maxR * MAP.view.ppu))) : 1;
  drawSite(sh, p, sol, T, { th: 9, sym: 15, sights: MAP.opts.sights, ellipses: MAP.opts.ellipses ? exag : 0,
                            letterEvery: 150, k: MAP.view.ppu, labels: MAP.opts.labels });
  // imagery underlay (screen coordinates are y down)
  let imagery = "";
  const G = MAP.geo;
  if (G && G.ok && p.geo.show && !HOSTED) {
    const { Ti } = mapT();
    const toS = (w) => { const q = T(w); return [q[0], H - q[1]]; };
    const tiles = imageryTiles(p, G, toS, (q) => Ti(q[0], H - q[1]), [0, 0, W, H], (G.u * G.s) / MAP.view.ppu);
    const attr = p.geo.source === "custom" ? "" : IMAGERY[p.geo.source].attr;
    imagery = `<g class="imagery" opacity="${p.geo.opacity}">${tilesSvg(tiles)}</g>` +
      (attr ? `<text x="${W - 6}" y="${H - 6}" text-anchor="end" class="attr">${esc(attr)}</text>` : "");
  }
  // find overlay
  const parts = [];
  if (MAP.find && MAP.find.target) {
    const X = T(MAP.find.target);
    for (const o of MAP.find.setups || []) {
      if (!sol.coords.has(o.station)) continue;
      const S = T(sol.coords.get(o.station)), B = T(sol.coords.get(o.backsight));
      parts.push(`<line x1="${S[0]}" y1="${H - S[1]}" x2="${B[0]}" y2="${H - B[1]}" class="find-bs"/>`);
      parts.push(`<line x1="${S[0]}" y1="${H - S[1]}" x2="${X[0]}" y2="${H - X[1]}" class="find-ray"/>`);
    }
    parts.push(`<circle cx="${X[0]}" cy="${H - X[1]}" r="9" class="find-target"/>`,
               `<path d="M${X[0] - 14} ${H - X[1]}h28M${X[0]} ${H - X[1] - 14}v28" class="find-target"/>`);
  }
  if (MAP.edit) {
    const e = MAP.edit;
    const scr = e.pts.map((w) => (w ? T(w) : null));
    const on = scr.filter(Boolean);
    if (on.length > 1) parts.push(`<path d="M${on.map((q) => `${q[0]} ${H - q[1]}`).join("L")}${e.closed ? "Z" : ""}" class="edit-outline"/>`);
    scr.forEach((q, i) => {
      if (!q) return;
      parts.push(e.free[i] ? `<rect x="${q[0] - 5}" y="${H - q[1] - 5}" width="10" height="10" class="vtx" data-vtx="${i}"/>`
                           : `<circle cx="${q[0]}" cy="${H - q[1]}" r="6" class="vtx-ref"/>`);
    });
  }
  if (MAP.banner) parts.push(`<g class="banner"><rect x="10" y="10" width="${Math.min(W - 80, MAP.banner.length * 6.2 + 24)}" height="26" rx="5"/>` +
                             `<text x="22" y="27">${esc(MAP.banner)}</text></g>`);
  if (MAP.selected && sol.coords.has(MAP.selected)) {
    const c = T(sol.coords.get(MAP.selected));
    parts.push(`<circle cx="${c[0]}" cy="${H - c[1]}" r="14" class="sel-ring"/>`);
  }
  // north arrow and scale bar (screen furniture)
  const unit = niceStep(90 / MAP.view.ppu);
  const bw = unit * MAP.view.ppu;
  parts.push(`<g class="furniture"><path d="M${W - 34} 22l9 26l-9-7l-9 7z" fill="#333"/><text x="${W - 34}" y="18" text-anchor="middle" font-weight="bold" font-size="13">N</text>` +
             `<rect x="16" y="${H - 26}" width="${bw}" height="6" fill="#333"/><text x="16" y="${H - 32}" font-size="11">${+unit.toFixed(2)} ${unitAbbr(p)}` +
             `${MAP.opts.ellipses && maxR > 0 ? ` · ellipses ×${exag}` : ""}</text></g>`);
  $("#mapSvg").setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("#mapSvg").classList.toggle("picking", !!MAP.banner);
  $("#mapSvg").innerHTML = `<rect width="${W}" height="${H}" fill="#fbfcfd"/>` + imagery + mapGrid(T, W, H) +
    sheetToPxSvg(sh, H) + parts.join("");
  $("#mapSvg").setAttribute("font-family", sh.font.css.replace(/"/g, "'"));
}

function mapGrid(T, W, H) {
  const { Ti } = mapT();
  const step = niceStep(110 / MAP.view.ppu);
  const [e0, n0] = Ti(0, 0), [e1, n1] = Ti(W, H);
  let s = "";
  for (let e = Math.ceil(e0 / step) * step; e <= e1; e += step) {
    const x = T([e, 0])[0];
    s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="grid"/><text x="${x + 3}" y="${H - 6}" class="grid-label">E ${+e.toFixed(1)}</text>`;
  }
  for (let n = Math.ceil(n0 / step) * step; n <= n1; n += step) {
    const y = H - T([0, n])[1];
    s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="grid"/><text x="4" y="${y - 3}" class="grid-label">N ${+n.toFixed(1)}</text>`;
  }
  return s;
}

function bindMap(getState) {
  const svg = $("#mapSvg");
  let drag = null;
  const local = (ev) => { const r = svg.getBoundingClientRect(); return [ev.clientX - r.left, r.height - (ev.clientY - r.top)]; };
  svg.addEventListener("pointerdown", (ev) => {
    const vtx = ev.target.dataset ? ev.target.dataset.vtx : undefined;
    drag = { start: local(ev), view: { ...MAP.view }, moved: false, target: ev.target, vtx: vtx === undefined ? null : +vtx };
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return;
    const [x, y] = local(ev);
    const dx = x - drag.start[0], dy = y - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    if (drag.vtx !== null && MAP.onVertexDrag) { MAP.onVertexDrag(drag.vtx, mapT().Ti(x, y), false); return; }
    MAP.view = { ...drag.view, cx: drag.view.cx - dx / drag.view.ppu, cy: drag.view.cy - dy / drag.view.ppu };
    const { p, sol } = getState();
    renderMap(p, sol);
  });
  svg.addEventListener("pointerup", (ev) => {
    const d = drag;
    drag = null;
    if (d && d.vtx !== null) { if (d.moved && MAP.onVertexDrag) MAP.onVertexDrag(d.vtx, mapT().Ti(...local(ev)), true); return; }
    if (!d || d.moved) return;
    const g = d.target.closest && d.target.closest("[data-owner]");
    const owner = g ? g.dataset.owner : null;
    const { Ti } = mapT();
    const [x, y] = local(ev);
    if (MAP.onPick) MAP.onPick(Ti(x, y), owner);
  });
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const [x, y] = local(ev);
    const { Ti } = mapT();
    const before = Ti(x, y);
    MAP.view.ppu = clamp(MAP.view.ppu * Math.exp(-ev.deltaY * 0.0015), 0.01, 2000);
    const after = mapT().Ti(x, y);
    MAP.view.cx += before[0] - after[0];
    MAP.view.cy += before[1] - after[1];
    const { p, sol } = getState();
    renderMap(p, sol);
  }, { passive: false });
}

/* =========================================================================
 * Printable survey report (US Letter): datum, coordinates, field book with
 * residuals, and a "how to find it" card for every point.
 * ========================================================================= */

const h = (s) => esc(String(s ?? ""));

/** Site figure for the report, `wIn` x `hIn` inches. */
function reportFigure(p, sol, wIn = 7.3, hIn = 4.6) {
  const W = wIn * 96, H = hIn * 96;
  const ext = siteExtents(sol, p);
  if (!ext) return "";
  const ppu = Math.min((W - 110) / Math.max(R.w(ext), 1), (H - 70) / Math.max(R.h(ext), 1));
  const T = (w) => [(w[0] - R.cx(ext)) * ppu + W / 2, (w[1] - R.cy(ext)) * ppu + H / 2];
  const sh = new Sheet(FONTS[p.font] || FONTS[DEFAULT_FONT]);
  drawSite(sh, p, sol, T, { th: 7.5, sym: 13, sights: !!p.planSights, ellipses: 0, letterEvery: 130, k: ppu });
  const unit = niceStep(80 / ppu);
  return `<svg viewBox="0 0 ${W} ${H}" width="${wIn}in" height="${hIn}in" font-family="${sh.font.css.replace(/"/g, "'")}">` +
    `<rect width="${W}" height="${H}" fill="#fff" stroke="#999"/>${sheetToPxSvg(sh, H, { strokeScale: 0.8 })}` +
    `<path d="M${W - 26} 16l7 20l-7-5l-7 5z" fill="#333"/><text x="${W - 26}" y="13" text-anchor="middle" font-size="10" font-weight="bold">N</text>` +
    `<rect x="12" y="${H - 18}" width="${unit * ppu}" height="5" fill="#333"/><text x="12" y="${H - 23}" font-size="9">${+unit.toFixed(2)} ${unitAbbr(p)}</text></svg>`;
}

function findCardHtml(p, sol, name, X, targetId, G = null) {
  const ents = entities(p);
  const nm = (id) => ents.get(id)?.name || "?";
  const f = findOptions(p, sol, X, targetId);
  const dir = p.circle === "cw" ? "clockwise" : "counter-clockwise";
  const ll = G && G.ok ? localToLL(G, X) : null;
  let s = `<div class="card"><div class="card-h">${h(name)}<span>N ${X[1].toFixed(2)} &nbsp; E ${X[0].toFixed(2)}` +
          `${ll ? ` &nbsp;·&nbsp; ${ll[0].toFixed(6)}, ${ll[1].toFixed(6)}` : ""}</span></div>`;
  if (f.inside) s += `<div class="card-n"><b>This spot is inside ${h(f.inside.name || "an obstacle")}.</b> Lines into it are not checked against that outline.</div>`;
  const blk = f.nBlocked ? ` ${f.nBlocked} other setup${f.nBlocked > 1 ? "s are" : " is"} blocked by obstacles.` : "";
  if (f.best) {
    s += `<ol>`;
    for (const o of f.best) {
      s += `<li>Set up on <b>${h(nm(o.station))}</b>, sight <b>${h(nm(o.backsight))}</b> and set the circle to 0°00'00". ` +
           `Turn ${dir} to <b>${fmtDMS(o.reading)}</b>; the point is <b>${fmtLen(p, o.dist)}</b> out along that line.` +
           `${targetId && !o.seen ? ' <i>(line of sight not yet checked)</i>' : ""}</li>`;
    }
    s += f.best.length > 1 ? `</ol><div class="card-n">Where the two lines cross: expected within ±${fmtLen(p, f.sigma95, 2)} (95%).${blk}`
      : `</ol><div class="card-n"><b>Only one landmark has a clear line to this spot</b>, so use the distance along it and the tape check.${blk}`;
  } else s += `<div class="card-n">${f.nBlocked ? "Every setup's line to this spot is blocked by an obstacle." : "Not enough located landmarks to set up on."}`;
  if (f.tapes.length >= 2) {
    s += ` Tape check: ${f.tapes.slice(0, 2).map((t) => `${fmtLen(p, t.dist)} from ${h(nm(t.id))}`).join(" and ")}` +
         `${f.tapes.length > 2 ? `; ${fmtLen(p, f.tapes[2].dist)} from ${h(nm(f.tapes[2].id))}` : ""}.`;
  }
  return s + "</div></div>";
}

function reportHtml(p, sol, G = null) {
  const ents = entities(p);
  const nm = (id) => ents.get(id)?.name || "?";
  const u = unitAbbr(p);
  const nA = sol.obs.filter((o) => o.kind === "angle").length, nD = sol.obs.filter((o) => o.kind === "dist").length;
  const located = [...ents.keys()].filter((id) => sol.coords.has(id)).length;
  let s = `<div class="rep"><header><h1>${h(p.name)}</h1><div>${h(p.location)}</div>` +
          `<div class="meta">Surveyed by ${h(p.surveyor || "—")} · Report printed ${isoToday()}</div></header>`;
  s += `<div class="fig">${reportFigure(p, sol)}</div>`;

  // datum and quality
  const msgs = sol.messages.filter((m) => m.lvl !== "info");
  s += `<h2>Datum and solution</h2><table class="kv">` +
       `<tr><th>Coordinates</th><td>Local, in ${UNITS[p.units].name}. ${h(nm(p.datum.origin))} held at N ${p.datum.originN.toFixed(2)}, E ${p.datum.originE.toFixed(2)}.</td></tr>` +
       `<tr><th>Basis of bearings</th><td>${h(nm(p.datum.origin))} to ${h(nm(p.datum.orient))} = ${fmtBearing(parseBearing(p.datum.bearing))} (grid north).</td></tr>` +
       `<tr><th>Measurements</th><td>${nA} angles, ${nD} distances. Reading precision assumed ${p.angleSigma}" (one pointing); distances ±(${p.distSigma.fixed} ${u} + 1:${p.distSigma.ratio}).</td></tr>` +
       `<tr><th>Solution</th><td>${located} of ${ents.size} located. ${sol.dof} redundant measurements` +
       `${sol.sigma0 ? `; readings fit at ${sol.sigma0.toFixed(2)}× the assumed precision` : ""}.` +
       `${sol.unscaled ? " <b>No measured distance: arbitrary scale.</b>" : ""}</td></tr>` +
       `${G && G.ok && !G.single ? `<tr><th>Georeference</th><td>Grid north is ${gridNorthText(G.theta)} (±${fmtDMS(2 * G.sigTheta).replace(/^0°/, "")}, 95%), ` +
         `from a fit to the latitude/longitude of ${G.n} landmarks${G.sigma0 !== null ? `; they agree with the survey to ${fmtLen(p, rmsGeo(G), 1)} RMS` : ""}.` +
         `${G.fitScale ? " Scale taken from GPS." : ""} Latitudes/longitudes below are good to a few ${p.units === "m" ? "metres" : "feet"}, enough to walk to a spot with a phone.</td></tr>` : ""}` +
       `${msgs.length ? `<tr><th>Open items</th><td><ul>${msgs.map((m) => `<li>${h(m.msg)}</li>`).join("")}</ul></td></tr>` : ""}</table>`;

  // landmarks
  const geo = G && G.ok;
  s += `<h2>Landmarks (control)</h2><table class="grid"><tr><th>Name</th><th>Northing</th><th>Easting</th><th>±95%</th>` +
       `${geo ? "<th>Latitude, longitude</th>" : ""}<th>Description / how to find it</th></tr>`;
  for (const l of p.landmarks) {
    const c = sol.coords.get(l.id), inf = sol.info.get(l.id);
    const ll = geo && c ? localToLL(G, c) : null;
    s += `<tr><td><b>${h(l.name)}</b></td><td class="n">${c ? c[1].toFixed(2) : "—"}</td><td class="n">${c ? c[0].toFixed(2) : "—"}</td>` +
         `<td class="n">${inf ? inf.r95.toFixed(2) : "—"}</td>${geo ? `<td class="n">${ll ? `${ll[0].toFixed(6)}, ${ll[1].toFixed(6)}` : "—"}</td>` : ""}<td>${h(l.desc)}</td></tr>`;
  }
  s += `</table>`;

  // points
  s += `<h2>Points</h2><table class="grid"><tr><th>Name</th><th>Type</th><th>Northing</th><th>Easting</th><th>±95%</th><th>Check</th><th>Depth</th><th>Description</th></tr>`;
  for (const x of p.points) {
    const c = sol.coords.get(x.id), inf = sol.info.get(x.id);
    s += `<tr><td><b>${h(x.name)}</b></td><td>${h((TYPES[x.type] || TYPES[""]).name)}</td><td class="n">${c ? c[1].toFixed(2) : "—"}</td>` +
         `<td class="n">${c ? c[0].toFixed(2) : "—"}</td><td class="n">${inf ? inf.r95.toFixed(2) : "—"}</td>` +
         `<td>${inf ? (inf.checked ? "yes" : "no") : "—"}</td><td>${h(x.depth)}</td><td>${h(x.desc)}</td></tr>`;
  }
  s += `</table><p class="small">“Check” = the point is seen from enough different directions that a misread angle would have shown up as a flagged reading.</p>`;

  // lines
  if (p.lines.length) {
    s += `<h2>Lines</h2><table class="grid"><tr><th>Name</th><th>Type</th><th>Route</th><th>Length</th><th>Depth</th><th>Description</th></tr>`;
    for (const l of p.lines) {
      s += `<tr><td><b>${h(l.name)}</b></td><td>${h((TYPES[l.type] || TYPES[""]).name)}</td><td>${l.pts.map((id) => h(nm(id))).join(" → ")}</td>` +
           `<td class="n">${fmtLen(p, lineLength(sol, l), 1)}</td><td>${h(l.depth)}</td><td>${h(l.desc)}</td></tr>`;
    }
    s += `</table>`;
  }

  if (p.obstacles.length) {
    s += `<h2>Obstacles</h2><table class="grid"><tr><th>Name</th><th>Kind</th><th>Blocks sight</th><th>Corners</th><th>Description</th></tr>`;
    for (const o of p.obstacles) {
      s += `<tr><td><b>${h(o.name)}</b></td><td>${h(OBSTACLE_KINDS[o.kind].name)}</td><td>${o.blocks ? "yes" : "no"}</td>` +
           `<td class="n">${obstacleCoords(sol, o).length}</td><td>${h(o.desc)}</td></tr>`;
    }
    s += `</table>`;
  }

  // field book
  s += `<h2>Field book</h2><table class="grid fb"><tr><th>Date</th><th>Station</th><th>Backsight</th><th>Target</th><th>Reading</th><th>Angle right</th><th>Distance</th><th>Residual</th><th>Note</th></tr>`;
  for (const st of p.setups) {
    st.readings.forEach((r, i) => {
      const oa = sol.obs.find((o) => o.kind === "angle" && o.ref?.reading === r.id);
      const od = sol.obs.find((o) => o.kind === "dist" && o.ref?.reading === r.id);
      const resid = [oa && oa.v !== undefined ? fmtSec(oa.v) : "", od && od.v !== undefined ? fmtLen(p, od.v, 3) : ""].filter(Boolean).join(" / ");
      const flag = (oa && oa.flag) || (od && od.flag);
      s += `<tr class="${flag ? "flag" : ""}${r.off ? " off" : ""}"><td>${i ? "" : h(st.date)}</td><td>${i ? "" : `<b>${h(nm(st.station))}</b>`}</td>` +
           `<td>${i ? "" : `${h(nm(st.backsight))} @ ${h(st.bsReading || "0")}`}</td><td>${h(nm(r.target))}</td><td>${h(r.reading)}</td>` +
           `<td>${oa ? fmtDMS(oa.value) : ""}</td><td class="n">${h(r.dist)}</td><td class="n">${resid}${flag ? " ⚠" : ""}</td>` +
           `<td>${r.off ? "IGNORED. " : ""}${h(r.note)}</td></tr>`;
    });
  }
  for (const b of p.baselines) {
    const od = sol.obs.find((o) => o.kind === "dist" && o.ref?.baseline === b.id);
    s += `<tr class="${od && od.flag ? "flag" : ""}${b.off ? " off" : ""}"><td></td><td colspan="3">Taped: ${h(nm(b.a))} – ${h(nm(b.b))}</td><td></td><td></td>` +
         `<td class="n">${h(b.dist)}</td><td class="n">${od && od.v !== undefined ? fmtLen(p, od.v, 3) : ""}</td><td>${b.off ? "IGNORED. " : ""}${h(b.note)}</td></tr>`;
  }
  s += `</table>`;

  // finding cards
  s += `<h2 class="break">How to find each point</h2><div class="cards">`;
  for (const x of p.points) {
    const c = sol.coords.get(x.id);
    if (c) s += findCardHtml(p, sol, `${x.name}${x.desc ? " — " + x.desc : ""}`, c, x.id, G);
  }
  s += `</div>`;
  if (p.notes.some((n) => n.trim())) s += `<h2>Notes</h2><ol>${p.notes.filter((n) => n.trim()).map((n) => `<li>${h(n)}</li>`).join("")}</ol>`;
  return s + "</div>";
}

/* =========================================================================
 * Host services: in-page dialogs (used everywhere), file saving, and, when
 * the page runs as a hosted claude.ai artifact (SV_HOSTED), saving surveys
 * to the viewer's account and offering files through the host.
 *
 * A hosted page can't print, start downloads itself, show alert/confirm/
 * prompt dialogs or load map tiles from other sites, so the plan and report
 * are offered as SVG and HTML files instead, and the imagery is turned off.
 * ========================================================================= */

const HOSTED = typeof SV_HOSTED !== "undefined" && !!SV_HOSTED;

// ----------------------------------------------------------------- dialogs
/**
 * Modal dialog. Resolves true/false (confirm), the entered text or null
 * (with `input`), or undefined (alert).
 */
function ask({ title = "", message = "", input = null, okText = "OK", cancelText = "Cancel", danger = false, alertOnly = false }) {
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const field = input !== null ? el("input", { type: "text", id: "dlgInput", class: "dlg-input" }) : null;
    if (field) field.value = input;
    const done = (ok) => {
      back.remove();
      document.removeEventListener("keydown", onKey, true);
      if (prevFocus && prevFocus.focus) prevFocus.focus();
      resolve(alertOnly ? undefined : field ? (ok ? field.value : null) : ok);
    };
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === "Enter" && (field ? document.activeElement === field : true)) { e.preventDefault(); done(true); }
    };
    const okBtn = el("button", { class: danger ? "danger-fill" : "primary", onclick: () => done(true) }, okText);
    const back = el("div", { class: "dlg-back", onclick: (e) => { if (e.target === back) done(false); } },
      el("div", { class: "dlg", role: "dialog", "aria-modal": "true", "aria-labelledby": "dlgTitle" },
        title ? el("h4", { id: "dlgTitle" }, title) : null,
        message ? el("p", {}, message) : null,
        field,
        el("div", { class: "dlg-buttons" }, alertOnly ? null : el("button", { onclick: () => done(false) }, cancelText), okBtn)));
    document.body.append(back);
    document.addEventListener("keydown", onKey, true);
    (field || okBtn).focus();
    if (field) field.select();
  });
}
const uiAlert = (message, title = "") => ask({ title, message, alertOnly: true });
const uiConfirm = (message, opts = {}) => ask({ message, ...opts });
const uiPrompt = (message, value = "", opts = {}) => ask({ message, input: String(value), ...opts });

// -------------------------------------------------------------------- zip
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

/** A .zip (stored, no compression) of [{name, data: string}]. */
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const head = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2], [14, crc, 4],
     [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
      .forEach(([o, v, n]) => (n === 4 ? head.setUint32(o, v, true) : head.setUint16(o, v, true)));
    const cen = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2], [16, crc, 4],
     [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2],
     [38, 0, 4], [42, offset, 4]]
      .forEach(([o, v, n]) => (n === 4 ? cen.setUint32(o, v, true) : cen.setUint16(o, v, true)));
    parts.push(new Uint8Array(head.buffer), name, data);
    central.push(new Uint8Array(cen.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cenSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cenSize, 4], [16, offset, 4], [20, 0, 2]]
    .forEach(([o, v, n]) => (n === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true)));
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}

// ------------------------------------------------------------ file saving
// extensions the host lets a page offer; other formats travel in a .zip
const HOST_EXTS = new Set("gif png jpg jpeg webp mp4 webm txt json md docx pptx epub csv ttf html svg pdf xlsx zip".split(" "));

const HOST = { db: null, col: null, downloads: null, written: new Map(), state: HOSTED ? "connecting" : "local", timer: null, busy: false };

/** Offer a file: a browser download, or through the host when hosted. `data` is a string or Blob. */
async function saveFile(name, data) {
  if (!HOSTED) {
    downloadBlob(data instanceof Blob ? data : new Blob([data]), name);
    return;
  }
  if (!HOST.downloads) {
    await uiAlert("Saving files isn't available where this page is open. Open the artifact in claude.ai to save files.", "Can't save files here");
    return;
  }
  const ext = name.split(".").pop().toLowerCase();
  let fname = name, payload = data;
  if (!HOST_EXTS.has(ext)) {
    payload = makeZip([{ name, data: data instanceof Blob ? await data.text() : data }]);
    fname = name + ".zip";
  }
  try {
    await HOST.downloads.save({ filename: fname, data: payload });
  } catch (e) {
    if (e && (e.code === "declined" || e.code === "rate_limited")) return;
    await uiAlert(`The file couldn't be saved (${(e && e.message) || e}).`, "Not saved");
  }
}

/** The embedded font faces as CSS, for files that leave the page. */
function fontFaceCss(fontKey) {
  const font = FONTS[fontKey];
  const fam = font && font.css.match(/^'([^']+)'/);
  if (!fam) return "";
  const data = JSON.parse(document.getElementById("font-data").textContent);
  return font.files.map((f, i) => `@font-face{font-family:'${fam[1]}';font-weight:${i ? 700 : 400};src:url(data:font/ttf;base64,${data[f]}) format('truetype')}`).join("");
}

/** A plan sheet SVG that stands on its own (fonts embedded). */
function standaloneSvg(svg, fontKey) {
  return svg.replace(/<svg [^>]*>/, (m) => `${m}<style>${fontFaceCss(fontKey)}</style>`);
}

/** The report as a complete HTML document, ready to open and print. */
function standaloneReport(p, html) {
  const css = [];
  for (const sheet of document.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch (_) { continue; }
    for (const r of rules) if (r.selectorText && /(^|,\s*)\.rep\b/.test(r.selectorText)) css.push(r.cssText);
  }
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">` +
    `<title>${esc(p.name)} — survey report</title><style>${fontFaceCss(p.font)}` +
    `@page{size:letter;margin:0.55in}body{margin:0;background:#fff}.rep{max-width:7.4in;margin:0 auto;padding:0.3in 0}` +
    `@media print{.rep{padding:0}}${css.join("\n")}</style></head><body>${html}</body></html>`;
}

// ------------------------------------------------- surveys in the account
/** Connect to the host (hosted only): file saving and the account store. `onProjects(list)` gets saved surveys. */
async function connectHost(onProjects) {
  if (!HOSTED || !window.claude || !window.claude.use) { setSaveState("local"); return; }
  try { HOST.downloads = await window.claude.use("downloads"); } catch (_) { HOST.downloads = null; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = db && user ? await user.id() : null;
    if (!uid) { setSaveState("local"); return; }
    HOST.db = db;
    HOST.col = db.collection("data/users/" + uid);
    const snap = await HOST.col.get();
    const list = [];
    for (const d of snap.docs) {
      const body = d.data();
      try { list.push({ order: Number(body.order) || 0, p: JSON.parse(body.json) }); HOST.written.set(d.id, body.json); } catch (_) { /* skip a bad row */ }
    }
    list.sort((a, b) => a.order - b.order);
    setSaveState("account");
    if (list.length) onProjects(list.map((x) => x.p));
  } catch (e) {
    HOST.col = null;
    setSaveState("local");
  }
}

function setSaveState(s) {
  HOST.state = s;
  const n = document.getElementById("saveState");
  if (!n) return;
  const txt = { local: HOSTED ? "Saved in this browser only" : "", connecting: "Connecting…", account: "Saved to your account",
                saving: "Saving…", error: "Not saved to your account" }[s];
  n.textContent = txt;
  n.className = `save-state ${s}`;
  n.title = s === "local" && HOSTED ? "Your surveys are kept in this browser. Use Save JSON for a backup." :
            s === "error" ? "The last change couldn't be saved to your account. It is kept in this browser; use Save JSON for a backup." : "";
}

/** Write changed surveys to the account (debounced; one write at a time). */
function hostSave(store) {
  if (!HOST.col) return;
  clearTimeout(HOST.timer);
  HOST.timer = setTimeout(() => flushHost(store), 1200);
}
async function flushHost(store) {
  if (HOST.busy) { hostSave(store); return; }
  HOST.busy = true;
  try {
    let wrote = false;
    for (const [i, p] of store.projects.entries()) {
      const json = JSON.stringify(p);
      if (HOST.written.get(p.id) === json) continue;
      if (!wrote) { setSaveState("saving"); wrote = true; }
      await HOST.col.doc(p.id).set({ order: i, updated: new Date().toISOString(), json });
      HOST.written.set(p.id, json);
    }
    const ids = new Set(store.projects.map((p) => p.id));
    for (const id of [...HOST.written.keys()]) {
      if (ids.has(id)) continue;
      await HOST.col.doc(id).delete();
      HOST.written.delete(id);
    }
    setSaveState("account");
  } catch (e) {
    setSaveState("error");
  } finally {
    HOST.busy = false;
  }
}

/* =========================================================================
 * UI: tabs and forms, live solution, map wiring, storage, import/export.

const APP = {
  store: { projects: [], cur: 0 },
  p: null, sol: null, geo: null, tab: "book", sel: null, hiRef: null,
  edit: null,   // obstacle being drawn on the map
  pick: null,   // landmark whose lat/lon is being picked on the imagery
  find: { mode: "point", id: "", line: "", s: "", n: "", e: "", lat: "", lon: "", snap: true, target: null, label: "" },
};
const STORE_KEY = "siteSurvey.v1";

// ------------------------------------------------------------- storage
let _saveT = null;
function save() {
  clearTimeout(_saveT);
  _saveT = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(APP.store)); } catch (_) { /* ignore */ } }, 200);
  hostSave(APP.store);
}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.projects) && s.projects.length) {
      APP.store = { projects: s.projects.map(normalizeProject), cur: clamp(s.cur | 0, 0, s.projects.length - 1) };
    }
  } catch (_) { /* ignore */ }
}
const exampleProject = () => normalizeProject(JSON.parse(JSON.stringify(JSON.parse($("#examples").textContent).example_property)));

function switchProject(i) {
  APP.store.cur = clamp(i, 0, APP.store.projects.length - 1);
  APP.p = APP.store.projects[APP.store.cur];
  try { localStorage.setItem(STORE_KEY + ".cur", APP.p.id); } catch (_) { /* ignore */ }
  APP.sel = null; APP.find.target = null; MAP.find = null; MAP.selected = null; MAP.view = null; APP.edit = null; APP.pick = null;
  save();
  renderProjList();
  solve(true);
  renderPane();
}
function addProject(p) { APP.store.projects.push(p); switchProject(APP.store.projects.length - 1); }

function renderProjList() {
  $("#projSelect").replaceChildren(...APP.store.projects.map((p, i) => el("option", { value: i, selected: i === APP.store.cur }, p.name)));
}

// --------------------------------------------------------------- solving
let _solveT = null;
function changed(structural = false) {
  save();
  if (structural) { solve(); renderPane(); return; }
  clearTimeout(_solveT);
  _solveT = setTimeout(() => solve(), 120);
}

function solve(fit = false) {
  APP.sol = solveProject(APP.p);
  APP.geo = georeference(APP.p, APP.sol);
  MAP.geo = APP.geo;
  APP.sol.messages.push(...geoMessages(APP.p, APP.geo), ...obstacleMessages(APP.p, APP.sol));
  if (fit) MAP.view = null;
  syncEdit();
  renderGeoTools();
  updateFind(false);
  renderMap(APP.p, APP.sol);
  renderMessages();
  renderSummary();
  refreshComputed();
  renderTabCounts();
}

function renderSummary() {
  const p = APP.p, sol = APP.sol;
  const total = p.landmarks.length + p.points.length;
  let worst = null;
  for (const [id, inf] of sol.info) if (!worst || inf.r95 > worst.r) worst = { id, r: inf.r95 };
  const ents = entities(p);
  const sus = sol.obs.filter((o) => o.flag).length;
  $("#summary").innerHTML = total ? `<b>${sol.coords.size}</b> of ${total} located · ${sol.dof} redundant` +
    (worst && worst.r > 0 ? ` · worst ±${worst.r.toFixed(2)} ${unitAbbr(p)} (${esc(ents.get(worst.id)?.name || "")})` : "") +
    (sus ? ` · <span style="color:var(--warn)">${sus} suspect reading${sus > 1 ? "s" : ""}</span>` : "") +
    (sol.unscaled ? ` · <span style="color:var(--danger)">no distance yet</span>` : "") : "Add landmarks to begin.";
}

function renderMessages() {
  const box = $("#messages");
  const msgs = APP.sol.messages;
  if (!msgs.length) {
    box.replaceChildren(APP.sol.coords.size > 1 ? el("div", { class: "msg" }, el("span", { class: "lvl ok" }, "OK"),
      el("span", {}, "Everything is located and the readings agree.")) : "");
    return;
  }
  const order = { error: 0, warn: 1, info: 2 };
  box.replaceChildren(...[...msgs].sort((a, b) => order[a.lvl] - order[b.lvl]).map((m) => el("div", {
    class: "msg",
    onclick: () => {
      if (m.ref && (m.ref.setup || m.ref.baseline)) { APP.hiRef = m.ref; APP.tab = "book"; renderPane(); }
      else if (m.ids && m.ids[0]) selectEntity(m.ids[0]);
    },
  }, el("span", { class: `lvl ${m.lvl}` }, m.lvl === "warn" ? "CHECK" : m.lvl === "error" ? "TO DO" : "NOTE"), el("span", {}, m.msg))));
}

/** Update every computed value in the pane without rebuilding it (keeps focus). */
function refreshComputed() {
  const p = APP.p, sol = APP.sol, u = unitAbbr(p);
  for (const node of $$("[data-calc]")) {
    const [kind, id] = node.dataset.calc.split(":");
    if (kind === "pt") {
      const c = sol.coords.get(id), inf = sol.info.get(id);
      if (!c) { node.innerHTML = `<span class="badge no">not located</span>`; continue; }
      const sights = inf.rays ? `seen from ${inf.rays}` : "";
      node.innerHTML = `N ${fmtCoord(c[1])} &nbsp;E ${fmtCoord(c[0])} &nbsp;±${inf.r95.toFixed(2)} ${u}` +
        `${sights ? " · " + sights : ""} &nbsp;${id === p.datum.origin ? '<span class="badge ok">origin</span>' :
          inf.checked ? `<span class="badge ok" title="A misread angle on this point would be flagged. The largest error that could slip through unflagged moves it ${fmtLen(p, inf.shift)}.">checked</span>` :
          `<span class="badge unchk" title="${Number.isFinite(inf.shift) ? `A misread that would not be flagged could move it ${fmtLen(p, inf.shift)}. ` : ""}${inf.rays >= 3 ? "Its sight lines are poorly spread, so add a sighting from a different direction." : "Add a sighting from another landmark so a misread angle would show up."}">no check</span>`}`;
    } else if (kind === "ang" || kind === "res") {
      const [sId, rId] = id.split("/");
      const st = p.setups.find((s) => s.id === sId), r = st && st.readings.find((x) => x.id === rId);
      if (!r) continue;
      if (kind === "ang") {
        const o = sol.obs.find((x) => x.kind === "angle" && x.ref?.reading === rId);
        node.textContent = o ? fmtDMS(o.value) : r.target === st.backsight && r.reading ? "backsight" : "";
      } else {
        const oa = sol.obs.find((x) => x.kind === "angle" && x.ref?.reading === rId);
        const od = sol.obs.find((x) => x.kind === "dist" && x.ref?.reading === rId);
        const parts = [];
        if (oa && oa.v !== undefined) parts.push(fmtSec(oa.v));
        if (od && od.v !== undefined) parts.push(`${od.v.toFixed(3)}`);
        node.textContent = parts.join(" / ");
        const flag = (oa && oa.flag) || (od && od.flag);
        node.classList.toggle("flag", !!flag);
        node.closest("tr")?.classList.toggle("flag", !!flag);
        node.title = flag ? "This reading disagrees with the others; see the messages under the map." : "Residual: measured minus adjusted";
      }
    } else if (kind === "bres") {
      const o = sol.obs.find((x) => x.kind === "dist" && x.ref?.baseline === id);
      node.textContent = o && o.v !== undefined ? o.v.toFixed(3) : "";
      node.classList.toggle("flag", !!(o && o.flag));
    } else if (kind === "len") {
      const l = p.lines.find((x) => x.id === id);
      node.textContent = l ? `Length ${fmtLen(p, lineLength(sol, l), 1)}` : "";
    } else if (kind === "bearing") {
      const az = parseBearing(p.datum.bearing);
      node.textContent = Number.isFinite(az) ? `= ${fmtBearing(az)} (azimuth ${fmtDMS(az)})` : "Can't read this bearing";
      node.classList.toggle("bad", !Number.isFinite(az));
    } else if (kind === "angle") {
      node.classList.toggle("bad", !!node.value.trim() && !Number.isFinite(parseAngle(node.value)));
    } else if (kind === "lat" || kind === "lon") {
      node.classList.toggle("bad", !!node.value.trim() && !Number.isFinite(parseLatLon(node.value, kind === "lon")));
    } else if (kind === "geo") {
      const l = p.landmarks.find((x) => x.id === id);
      const r = APP.geo && APP.geo.resid && APP.geo.resid.get(id);
      node.textContent = !l || (!l.lat.trim() && !l.lon.trim()) ? "" : r ? (APP.geo.n > 1 ? `${fmtLen(p, r.d, 1)} from survey` : "pins the imagery")
        : sol.coords.has(id) ? "can't read" : "not located yet";
      node.classList.toggle("flag", !!r && r.z > 3.5 && APP.geo.n >= 3);
    } else if (kind === "geofit") {
      node.innerHTML = geoSummary();
    }
  }
  if (APP.tab === "find") renderFindResult();
}

function renderTabCounts() {
  const p = APP.p;
  const counts = { landmarks: p.landmarks.length, book: p.setups.length, points: p.points.length, lines: p.lines.length, obstacles: p.obstacles.length };
  for (const b of $$("#tabs button")) {
    const n = counts[b.dataset.tab];

// ---------------------------------------------------------------- inputs
function inp(value, onInput, attrs = {}) {
  const i = el("input", { type: "text", ...attrs });
  i.value = value ?? "";
  i.addEventListener("input", () => { onInput(i.value); changed(); });
  return i;
}
function area(value, onInput, rows = 2, attrs = {}) {
  const t = el("textarea", { rows, ...attrs });
  t.value = value ?? "";
  t.addEventListener("input", () => { onInput(t.value); changed(); });
  return t;
}
function sel(value, options, onChange, attrs = {}) {
  const s = el("select", attrs, options.map((o) => (o.group
    ? el("optgroup", { label: o.group }, o.items.map(([v, t]) => el("option", { value: v, selected: v === value }, t)))
    : el("option", { value: o[0], selected: o[0] === value }, o[1]))));
  s.addEventListener("change", () => onChange(s.value, s));

const field = (label, input) => el("label", { class: "field" }, el("span", {}, label), input);
const btn = (text, onClick, cls = "") => el("button", { class: cls, onclick: onClick }, text);
const lmOptions = (excl = null) => APP.p.landmarks.filter((l) => l.id !== excl).map((l) => [l.id, l.name || "(unnamed)"]);

    { group: "Points", items: APP.p.points.map((x) => [x.id, x.name || "(unnamed)"]) },

function nextName(list, prefix) {
  let i = list.length + 1;
  while (list.some((x) => x.name === `${prefix}${i}`)) i++;
  return `${prefix}${i}`;
}

function geoRow(l) {
  let lonIn = null;
  const latIn = inp(l.lat, (v) => {

function geoSummary() {

  const ents = entities(p);
  const ll = localToLL(G, [p.datum.originE, p.datum.originN]);

    `${G.dof > 0 ? `RMS misfit ${fmtLen(p, rmsGeo(G), 1)}. ` : "Two landmarks fit exactly, so there is no check on them. "}` +
    `${G.fitScale ? "<b>Scale taken from GPS</b> (no taped distance yet). " : "Scale from your survey. "}` +
    `${esc(ents.get(p.datum.origin)?.name || "Origin")} ≈ ${fmtLat(ll[0])}, ${fmtLon(ll[1])}.`;
