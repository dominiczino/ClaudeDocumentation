<!doctype html>
<!--
  Diagram Drafter: one-line diagrams and P&IDs on ANSI B (17x11 landscape) sheets.
  Self-contained: open this file in a browser. No server, no network access needed.
  Built from src/ by tools/build.py; edit the sources, not this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Drafter</title>
<style>
:root {
  --bg: #e9ecf0;
  --panel: #ffffff;
  --ink: #1d232b;
  --muted: #6a737e;
  --line: #d5d9df;
  --accent: #1f5fa8;
  --accent-soft: #e6eef8;
  --sel: #1f6fd1;
  --danger: #a3302a;
  --top: #17202b;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  color: var(--ink);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }

button, select, input, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 4px 10px; cursor: pointer;
  white-space: nowrap;
}
button:hover { border-color: #9aa6b4; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.accent { background: var(--accent-soft); border-color: #b9cde6; color: var(--accent); font-weight: 600; }
button.danger { color: var(--danger); }
input, select, textarea { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid #9cc0ea; border-color: var(--accent); }
textarea { resize: vertical; width: 100%; }

/* ------------------------------------------------------------- top bar */
.topbar { display: flex; align-items: center; gap: 14px; padding: 7px 12px; background: var(--top); color: #fff; flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: .02em; }
.brand span { font-weight: 400; color: #9aa6b4; margin-left: 6px; font-size: 12px; }
.group { display: flex; gap: 5px; align-items: center; }
.group.right { margin-left: auto; }
.topbar button { border-color: #3a4654; color: var(--ink); }
.topbar button.primary { color: #fff; }
.topbar button.accent { color: var(--accent); }
.topbar button.danger { color: var(--danger); }
.topbar select { min-width: 190px; color: var(--ink); }
.menu { position: relative; }
.menu-list {
  display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 20; min-width: 220px;
  background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; border-radius: 4px; padding: 6px 8px; }
.menu-list button:hover { background: var(--accent-soft); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
.menu-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px 2px; }

/* -------------------------------------------------------------- layout */
main { flex: 1; display: grid; grid-template-columns: 236px 1fr 300px; min-height: 0; }
.palette, .props { background: var(--panel); overflow-y: auto; min-height: 0; }
.palette { border-right: 1px solid var(--line); padding: 10px; }
.props { border-left: 1px solid var(--line); padding: 12px; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ------------------------------------------------------------- palette */
#paletteSearch { width: 100%; margin-bottom: 6px; }
.hint { font-size: 11.5px; color: var(--muted); margin: 4px 2px 10px; line-height: 1.35; }
.pal-cat { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 2px 5px; }
.pal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.pal-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 3px 4px;
  border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; cursor: pointer; user-select: none;
  font-size: 11px; text-align: center; line-height: 1.15; min-height: 66px;
}
.pal-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.pal-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px #b9cde6 inset; }
.pal-item svg { width: 64px; height: 38px; }

/* -------------------------------------------------------------- canvas */
.canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #c9ced5; }
#canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#canvas.panning { cursor: grabbing; }
#canvas.placing { cursor: crosshair; }
.statusbar {
  display: flex; align-items: center; gap: 14px; padding: 5px 12px; background: var(--panel);
  border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.statusbar .spacer { flex: 1; }
.toggle { display: flex; gap: 4px; align-items: center; cursor: pointer; }
.zoom { display: flex; gap: 4px; align-items: center; }
.zoom button { padding: 1px 8px; }
#zoomLabel { min-width: 42px; text-align: center; }

/* overlay */
.hit { fill: transparent; stroke: none; cursor: move; }
.hit-edge { fill: none; stroke: transparent; cursor: pointer; }
.sel-box { fill: none; stroke: var(--sel); stroke-dasharray: 0.04 0.03; pointer-events: none; }
.sel-edge { fill: none; stroke: var(--sel); opacity: .35; pointer-events: none; stroke-linecap: round; stroke-linejoin: round; }
.keep { fill: rgba(31, 111, 209, .05); stroke: rgba(31, 111, 209, .35); pointer-events: none; }
.keep.bad { fill: rgba(200, 40, 30, .10); stroke: rgba(200, 40, 30, .7); }
.port { fill: #fff; stroke: var(--sel); cursor: crosshair; }
.port.hot { fill: var(--sel); }
.guide { stroke: #e0458b; pointer-events: none; }
.band { fill: rgba(31, 111, 209, .08); stroke: var(--sel); pointer-events: none; }
.preview-line { stroke: var(--sel); fill: none; pointer-events: none; stroke-dasharray: 0.06 0.04; }
.ghost { opacity: .55; pointer-events: none; }
.insert-hl { fill: none; stroke: #e0458b; opacity: .6; pointer-events: none; }
.bus-target { stroke: var(--sel); opacity: .45; pointer-events: none; }

/* --------------------------------------------------------- properties */
.props h3 { margin: 0 0 2px; font-size: 14px; }
.props .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 9px; }
.field > span { font-size: 11.5px; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { flex: 1; }
.section { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.check { display: flex; gap: 6px; align-items: center; margin-bottom: 9px; }
.kbd { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.kbd b { color: var(--ink); font-weight: 600; }
.note { font-size: 12px; color: var(--muted); }
.font-note a { color: var(--accent); }

/* --------------------------------------------------------------- dialog */
.dialog { position: fixed; inset: 0; background: rgba(15, 20, 28, .35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.dialog[hidden] { display: none; }
.dialog-box { background: #fff; border-radius: 8px; width: min(560px, 92vw); max-height: 75vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
.dialog-head button { border: 0; font-size: 18px; padding: 0 6px; }
#checkList { padding: 6px 0; }
.issue { padding: 7px 14px; cursor: pointer; display: flex; gap: 8px; }
.issue:hover { background: var(--accent-soft); }
.issue .lvl { font-size: 11px; font-weight: 700; width: 52px; flex: none; }
.issue .lvl.warn { color: #b06d00; } .issue .lvl.info { color: var(--muted); } .issue .lvl.error { color: var(--danger); }
.ok { padding: 14px; color: #2d7d46; }

/* ---------------------------------------------------------------- print */
#printSheet { display: none; }
@page { size: 17in 11in; margin: 0; }
@media print {
  body > *:not(#printSheet) { display: none !important; }
  body { background: #fff; display: block; overflow: visible; }
  #printSheet { display: block; width: 17in; height: 11in; }
  #printSheet svg { width: 17in; height: 11in; display: block; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Diagram Drafter <span>ANSI B · 17×11</span></div>
  <div class="group">
    <select id="docSelect" title="Drawings in this browser"></select>
    <div class="menu">
      <button id="btnNew">New ▾</button>
      <div class="menu-list" id="newMenu">
        <button data-new="oneline">One-line diagram</button>
        <button data-new="pid">P&amp;ID</button>
        <hr>
        <div class="menu-head">Examples</div>
        <div id="exampleList"></div>
      </div>
    </div>
    <button id="btnDup" title="Duplicate this drawing">Duplicate</button>
    <button id="btnDelDoc" class="danger" title="Delete this drawing">Delete</button>
  </div>
  <div class="group">
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
  </div>
  <div class="group">
    <button id="btnArrange" class="accent" title="Lay out the whole drawing automatically (A)">Auto-arrange</button>
    <button id="btnRoute" title="Re-route all connections">Re-route</button>
    <button id="btnCheck" title="Check the layout for problems">Check</button>
  </div>
  <div class="group right">
    <button id="btnImport">Import</button>
    <button id="btnSaveJson">Save JSON</button>
    <button id="btnPrint" title="Print at 17×11, or Save as PDF from the print dialog">Print / PDF</button>
    <button id="btnDxf" class="primary">Download DXF</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<main>
  <aside class="palette">
    <input id="paletteSearch" type="search" placeholder="Search symbols…">
    <p class="hint" id="paletteHint">Click a symbol to place it. With a symbol selected, a click adds the new one connected after it; with a line selected, it is inserted into the line.</p>
    <div id="paletteList"></div>
  </aside>

  <section class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <rect id="sheetBg" x="0" y="0" width="17" height="11" fill="#fff"/>
        <g id="gridLayer"></g>
        <g id="content"></g>
        <g id="overlay"></g>
      </svg>
    </div>
    <div class="statusbar">
      <span id="status">Ready</span>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="optKeep"> Show clearances</label>
      <label class="toggle"><input type="checkbox" id="optGrid" checked> Grid</label>
      <label class="toggle" title="Push dropped symbols clear of their neighbours"><input type="checkbox" id="optAvoid" checked> Avoid overlaps</label>
      <span class="zoom">
        <button id="zoomOut" title="Zoom out (−)">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Zoom in (+)">+</button>
        <button id="zoomFit" title="Fit sheet (0)">Fit</button>
      </span>
    </div>
  </section>

  <aside class="props" id="props"></aside>
</main>

<div class="dialog" id="checkDialog" hidden>
  <div class="dialog-box">
    <div class="dialog-head"><b>Layout check</b><button id="checkClose">×</button></div>
    <div id="checkList"></div>
  </div>
</div>

<div id="printSheet"></div>

<script>
/* =========================================================================
 * Utilities

"use strict";

const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const snap = (v, g) => Math.round(v / g) * g;
const round4 = (v) => Math.round(v * 1e4) / 1e4;
const clone = (o) => JSON.parse(JSON.stringify(o));
let _uidCounter = 0;
const uid = (p = "n") => `${p}${Date.now().toString(36)}${(_uidCounter++).toString(36)}`;

// rectangles are [x0, y0, x1, y1] with x0 <= x1, y0 <= y1
const R = {
  of: (x0, y0, x1, y1) => [Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)],
  union: (a, b) => (!a ? b : !b ? a : [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]),
  inflate: (r, d) => [r[0] - d, r[1] - d, r[2] + d, r[3] + d],
  overlaps: (a, b, eps = 1e-6) => a[0] < b[2] - eps && b[0] < a[2] - eps && a[1] < b[3] - eps && b[1] < a[3] - eps,
  contains: (r, x, y, eps = 0) => x >= r[0] - eps && x <= r[2] + eps && y >= r[1] - eps && y <= r[3] + eps,
  w: (r) => r[2] - r[0],
  h: (r) => r[3] - r[1],
  cx: (r) => (r[0] + r[2]) / 2,
  cy: (r) => (r[1] + r[3]) / 2,
  shift: (r, dx, dy) => [r[0] + dx, r[1] + dy, r[2] + dx, r[3] + dy],
};

// 2D transforms for symbols: local -> world. rot is CCW degrees in {0,90,180,270}.
function rotVec(x, y, rot) {
  switch (((rot % 360) + 360) % 360) {
    case 90: return [-y, x];
    case 180: return [-x, -y];
    case 270: return [y, -x];
    default: return [x, y];
  }
}

/** Rotation (CCW deg) that maps unit vector a onto unit vector b (axis-aligned). */
function rotBetween(a, b) {
  for (const r of [0, 90, 180, 270]) {
    const [x, y] = rotVec(a[0], a[1], r);
    if (Math.abs(x - b[0]) < 1e-9 && Math.abs(y - b[1]) < 1e-9) return r;
  }
  return 0;
}

const DIRS = { N: [0, 1], S: [0, -1], E: [1, 0], W: [-1, 0] };
const dirName = (v) => (v[1] > 0.5 ? "N" : v[1] < -0.5 ? "S" : v[0] > 0.5 ? "E" : "W");

function isoToday() {
  const d = new Date();
  const z = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

/** Binary min-heap keyed by numeric priority. */
class Heap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item, pri) {
    const a = this.a;
    a.push([pri, item]);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (a[p][0] <= a[i][0]) break;
      [a[p], a[i]] = [a[i], a[p]];
      i = p;
    }
  }
  pop() {
    const a = this.a;
    const top = a[0];
    const last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1;
        let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]];
        i = m;
      }
    }
    return top[1];
  }
}

/* =========================================================================
 * Fonts: embedded B612 / Jost, or system Arial. Text heights are cap heights.
 * ========================================================================= */

const FONTS = {
  b612: { label: "B612", css: "'DD B612', sans-serif", cap: 0.760,
          files: ["B612-Regular.ttf", "B612-Bold.ttf"], subst: {} },
  jost: { label: "Jost (Futura-style)", css: "'DD Jost', sans-serif", cap: 0.700,
          files: ["Jost-Regular.ttf", "Jost-Bold.ttf"], subst: { "Φ": "PH" } },
  arial: { label: "Arial", css: "Arial, 'Liberation Sans', Helvetica, sans-serif", cap: 0.716,
           files: ["arial.ttf", "arialbd.ttf"], subst: {} },
};
const DEFAULT_FONT = "b612";

/** Register the embedded TTFs with the page (preview, print and measurement). */
function loadEmbeddedFonts() {
  const data = JSON.parse(document.getElementById("font-data").textContent);
  const faces = [];
  for (const font of Object.values(FONTS)) {
    const family = font.css.match(/^'([^']+)'/);
    if (!family) continue;
    font.files.forEach((file, i) => {
      const bytes = Uint8Array.from(atob(data[file]), (c) => c.charCodeAt(0));
      const face = new FontFace(family[1], bytes.buffer, { weight: i ? "700" : "400" });
      document.fonts.add(face);
      faces.push(face.load());
    });
  }
  return Promise.all(faces);
}

function fontFileBlob(file) {
  const data = JSON.parse(document.getElementById("font-data").textContent);
  return new Blob([Uint8Array.from(atob(data[file]), (c) => c.charCodeAt(0))], { type: "font/ttf" });
}

let _measureCtx = null;
const _widthCache = new Map();

/** Width of `s` at cap height 1 in the given font. */
function unitWidth(s, bold, font) {
  const key = font.label + (bold ? "\u0001" : "\u0000") + s;
  let w = _widthCache.get(key);
  if (w === undefined) {
    if (!_measureCtx) _measureCtx = document.createElement("canvas").getContext("2d");
    _measureCtx.font = `${bold ? "bold " : ""}100px ${font.css}`;
    w = _measureCtx.measureText(s).width / 100 / font.cap;
    _widthCache.set(key, w);
  }
  return w;
}

function applySubst(s, font) {
  s = String(s);
  for (const [from, to] of Object.entries(font.subst)) s = s.split(from).join(to);
  return s;
}

/** Text measurement in sheet inches (with a little slack for CAD font differences). */
const textWidth = (s, h, bold, font) => unitWidth(applySubst(s, font), bold, font) * h * 1.04;

/* =========================================================================
 * Sheet: a flat list of drawing entities in sheet inches (y up), rendered
 * to SVG (screen/print) and DXF. Every entity carries the `owner` (node or
 * edge id, or "sheet") so the SVG can be grouped for hit-testing.
 * ========================================================================= */

const SHEET_W = 17.0, SHEET_H = 11.0;     // ANSI B landscape
const FRAME = 0.40, BAND = 0.25;          // border offset and zone band
const IX0 = FRAME + BAND, IY0 = FRAME + BAND;
const IX1 = SHEET_W - IX0, IY1 = SHEET_H - IY0;
const TB_W = 5.6, TB_H = 1.55;            // title block (bottom right)
const LINE_SPACING = 1.55;                // baseline pitch / cap height

// name: [ACI color, lineweight (1/100 mm), dashed]. Must match tools/make_dxf_template.py.
const LAYERS = {
  "FRAME": [7, 60], "FRAME-THIN": [7, 18], "TITLE": [7, 35], "TITLE-GRID": [7, 18],
  "TEXT": [7, 25], "TEXT-MINOR": [8, 18], "LABEL": [7, 18],
  "SYMBOL": [7, 35], "SYMBOL-FILL": [7, 0], "BUS": [7, 80],
  "WIRE": [7, 35], "WIRE-UG": [7, 35, true], "WIRE-CTRL": [7, 18, true], "WIRE-GND": [7, 25],
  "PIPE-MAJOR": [7, 50], "PIPE-MINOR": [7, 35], "PIPE-UG": [7, 35, true],
  "SIGNAL": [7, 18], "SIGNAL-ELEC": [7, 18, true],
};
const ACI_RGB = { 7: "#000000", 8: "#808080", 254: "#cfcfcf" };

class Sheet {
  constructor(font) {
    this.ents = [];
    this.font = font || FONTS[DEFAULT_FONT];
    this.owner = "sheet";
  }

  _push(e) { e.owner = this.owner; this.ents.push(e); }

  width(s, h, bold = false) { return textWidth(s, h, bold, this.font); }

  line(x0, y0, x1, y1, layer) { this._push({ t: "line", layer, x0, y0, x1, y1 }); }

  /** pts: [[x, y, bulge?], ...]; bulge applies to the segment leaving that vertex. */
  poly(pts, layer, closed = false) {
    this._push({ t: "poly", layer, pts: pts.map((p) => [p[0], p[1], p[2] || 0]), closed });
  }

  rect(x0, y0, x1, y1, layer, r = 0) {
    [x0, x1] = [Math.min(x0, x1), Math.max(x0, x1)];
    [y0, y1] = [Math.min(y0, y1), Math.max(y0, y1)];
    this.poly(rectPts(x0, y0, x1, y1, r), layer, true);
  }

  circle(x, y, r, layer) { this._push({ t: "circle", layer, x, y, r }); }

  /** Solid fill of a closed polygon (vertices may carry bulges). */
  fill(pts, layer = "SYMBOL-FILL") {
    this._push({ t: "fill", layer, pts: pts.map((p) => [p[0], p[1], p[2] || 0]) });
  }

  /** align: vertical (M/T/B) + horizontal (L/C/R), e.g. "ML". */
  text(s, x, y, h, align = "MC", layer = "TEXT", bold = false) {
    if (s === "" || s == null) return;
    this._push({ t: "text", layer, s: applySubst(s, this.font), x, y, h, align, bold });
  }

  wrap(s, w, h, bold = false) {
    const lines = [];
    for (const para of String(s).split("\n")) {
      let cur = "";
      for (const word of para.split(/\s+/).filter(Boolean)) {
        const trial = (cur + " " + word).trim();
        if (this.width(trial, h, bold) <= w || !cur) cur = trial;
        else { lines.push(cur); cur = word; }
      }
      lines.push(cur);
    }
    return lines;
  }

  /** Largest text height (<= hMax) at which `s` wraps into the box. */
  fit(s, w, boxH, hMax, hMin, bold = false, maxLines = 3) {
    let h = hMax;
    for (;;) {
      // n lines occupy (n - 1) line pitches plus one cap height
      const nFit = Math.max(1, Math.min(maxLines, Math.floor((boxH - h) / (h * LINE_SPACING) + 1e-9) + 1));
      let lines = this.wrap(s, w, h, bold);
      if (lines.length <= nFit && lines.every((l) => this.width(l, h, bold) <= w)) return [lines, h];
      if (h <= hMin + 1e-9) {
        const all = lines;
        lines = lines.slice(0, nFit);
        const orig = lines[lines.length - 1];
        let last = orig;
        while (last && this.width(last + "…", h, bold) > w) last = last.slice(0, -1);
        lines[lines.length - 1] = last !== orig || all.length > nFit ? last.trimEnd() + "…" : last;
        return [lines, h];
      }
      h = Math.max(hMin, h - 0.005);
    }
  }

  textBox(s, x0, y0, x1, y1, hMax, { hMin = 0.06, align = "left", pad = 0.05, layer = "TEXT",
                                     bold = false, maxLines = 3 } = {}) {
    if (!s) return;
    const w = (x1 - x0) - 2 * pad;
    const [lines, h] = this.fit(s, w, (y1 - y0) - 0.04, hMax, hMin, bold, maxLines);
    const top = (y0 + y1) / 2 + (lines.length - 1) * h * LINE_SPACING / 2;
    lines.forEach((ln, i) => {
      const y = top - i * h * LINE_SPACING;
      if (align === "left") this.text(ln, x0 + pad, y, h, "ML", layer, bold);
      else if (align === "right") this.text(ln, x1 - pad, y, h, "MR", layer, bold);
      else this.text(ln, (x0 + x1) / 2, y, h, "MC", layer, bold);
    });
  }
}

function rectPts(x0, y0, x1, y1, r = 0) {
  r = Math.min(r, (x1 - x0) / 2.01, (y1 - y0) / 2.01);
  if (r <= 1e-6) return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const b = 0.41421356; // tan(22.5 deg): 90 deg fillet
  return [[x0 + r, y0, 0], [x1 - r, y0, b], [x1, y0 + r, 0], [x1, y1 - r, b],
          [x1 - r, y1, 0], [x0 + r, y1, b], [x0, y1 - r, 0], [x0, y0 + r, b]];
}

/**
 * Drawing context for a symbol in its local frame (inches, origin at the
 * symbol's insertion point, canonical orientation). Applies scale, mirror
 * (about local y axis) and rotation; text stays upright.
 */
class SymCtx {
  constructor(sheet, x, y, rot = 0, flip = false, s = 1) {
    Object.assign(this, { sheet, ox: x, oy: y, rot, flip, s });
    this.layer = "SYMBOL";
  }
  P(x, y) {
    const [rx, ry] = rotVec((this.flip ? -x : x) * this.s, y * this.s, this.rot);
    return [this.ox + rx, this.oy + ry];
  }
  _pts(pts) {
    return pts.map(([x, y, b]) => [...this.P(x, y), (b || 0) * (this.flip ? -1 : 1)]);
  }
  line(x0, y0, x1, y1, layer = this.layer) {
    const [a, b] = this.P(x0, y0), [c, d] = this.P(x1, y1);
    this.sheet.line(a, b, c, d, layer);
  }
  poly(pts, closed = false, layer = this.layer) { this.sheet.poly(this._pts(pts), layer, closed); }
  rect(x0, y0, x1, y1, r = 0, layer = this.layer) { this.poly(rectPts(x0, y0, x1, y1, r), true, layer); }
  circle(x, y, r, layer = this.layer) { const [a, b] = this.P(x, y); this.sheet.circle(a, b, r * this.s, layer); }
  fill(pts) { this.sheet.fill(this._pts(pts)); }
  dot(x, y, r) { this.fill([[x - r, y, 1], [x + r, y, 1]]); }
  /** Upright text at a local position. */
  text(s, x, y, h, align = "MC", bold = false, layer = "TEXT") {
    const [a, b] = this.P(x, y);
    this.sheet.text(s, a, b, Math.max(0.05, h * this.s), align, layer, bold);
  }
  /** Text fitted to a local width (single line, shrinks to fit). */
  fitText(s, x, y, w, h, bold = false) {
    if (!s) return;
    const ws = this.sheet.width(s, 1, bold);
    this.text(s, x, y, Math.min(h, (w / ws) || h), "MC", bold);
  }
}

/* =========================================================================
 * Symbol libraries.
 *
 * Each symbol is drawn in its canonical orientation, in inches, around its
 * insertion point:
 *   one-line ("ol"):  power flows DOWN  (line side N, load side S)
 *   P&ID     ("pid"): flow goes RIGHT   (inlet W, outlet E)
 * Ports: {id, x, y, dir: N|S|E|W, role: in|out|io}. Bus symbols have
 * `bus: true` ports that attach anywhere along the bus.
 * ========================================================================= */

const LIB_FLOW = { ol: [0, -1], pid: [1, 0] };
const SYMBOLS = {};
const PALETTE = { ol: [], pid: [] };

/**
 * def: {id, lib, name, cat, box(n) | box, ports(n) | ports, draw(g, n, doc),
 *       props: [{k, label, type, options, def}], spec(n) -> [lines],
 *       tag: auto-tag prefix, source, satellite, bus, inner (prop key drawn inside)}
 */
function defSym(def) {
  def.props = def.props || [];
  if (typeof def.box !== "function") { const b = def.box; def.box = () => b; }
  if (typeof def.ports !== "function") { const p = def.ports; def.ports = () => p; }
  def.spec = def.spec || (() => []);
  SYMBOLS[def.id] = def;
  return def;
}

/** Palette entry: a symbol with preset properties. */
function pal(lib, cat, sym, name, props = {}, extra = {}) {
  PALETTE[lib].push({ cat, sym, name, props, ...extra });
}

const P = (id, x, y, dir, role = "io", extra = {}) => ({ id, x, y, dir, role, ...extra });
const join = (...xs) => xs.filter((x) => x !== "" && x != null).join(" ");
const unit = (v, u) => (v === "" || v == null ? "" : `${v}${u}`);

// ----------------------------------------------------------- shared shapes
function leadV(g, y0, y1) { g.line(0, y0, 0, y1); }
function leadH(g, x0, x1) { g.line(x0, 0, x1, 0); }

function bowtie(g, w = 0.15, h = 0.09) {
  g.poly([[-w, h], [-w, -h], [w, h], [w, -h]], true);
}

function zigzag(g, x0, y0, x1, y1, n, amp) {
  // zigzag along the segment (x0,y0)-(x1,y1)
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const pts = [[x0, y0]];
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, s = i % 2 ? -1 : 1;
    pts.push([x0 + dx * t + nx * amp * s, y0 + dy * t + ny * amp * s]);
  }
  pts.push([x1, y1]);
  g.poly(pts);
}

function groundBars(g, y) {
  g.line(-0.125, y, 0.125, y);
  g.line(-0.08, y - 0.045, 0.08, y - 0.045);
  g.line(-0.035, y - 0.09, 0.035, y - 0.09);
}

function arrowHead(g, x, y, dx, dy, len = 0.09, half = 0.035) {
  const nx = -dy, ny = dx;
  g.fill([[x, y], [x - dx * len + nx * half, y - dy * len + ny * half], [x - dx * len - nx * half, y - dy * len - ny * half]]);
}

/** Width of bold symbol text in the drawing's font (palette previews use the default font). */
const symTextW = (t, h, doc) => textWidth(String(t || ""), h, true, doc ? docFont(doc) : FONTS[DEFAULT_FONT]);
const BOX_TEXT_H = 0.09;
const MIN_SYM_TEXT = 0.065; // smallest text inside symbols, on paper

/**
 * Box with text inside that grows to fit the text. ports: [{id, side, role, lead}].
 * base: minimum half width / half height of the box.
 */
const boxSym = (id, lib, name, inner, ports, base, extra = {}) => {
  // text stays at least MIN_SYM_TEXT tall on paper even when symbols are scaled down
  const hw = (n, doc) => {
    const s = doc ? doc.symScale : 1;
    const h = Math.max(BOX_TEXT_H, MIN_SYM_TEXT / s);
    return Math.max(base.hw, symTextW(n.props.name ?? inner, h, doc) / 2 + 0.09);
  };
  const portsOf = (n, doc) => {
    const w = hw(n, doc);
    return ports.map((p) => {
      const off = { N: [0, base.hh + p.lead], S: [0, -base.hh - p.lead], E: [w + p.lead, 0], W: [-w - p.lead, 0] }[p.side];
      return P(p.id, off[0], off[1], p.side, p.role);
    });
  };
  return defSym({
    id, lib, name, inner: "name",
    box: (n, doc) => { const w = hw(n, doc); return [-w, -base.hh, w, base.hh]; },
    ports: portsOf,
    props: [{ k: "name", label: "Text in box", type: "text", def: inner },
            { k: "rating", label: "Rating", type: "text", def: "" }, ...(extra.props || [])],
    spec: (n) => [n.props.rating],
    draw(g, n, doc) {
      const w = hw(n, doc);
      g.rect(-w, -base.hh, w, base.hh, 0.03);
      g.fitText(n.props.name ?? inner, 0, 0, 2 * w - 0.1, Math.max(BOX_TEXT_H, MIN_SYM_TEXT / g.s), true);
      for (const p of portsOf(n, doc)) {
        const bx = clamp(p.x, -w, w), by = clamp(p.y, -base.hh, base.hh);
        if (Math.hypot(p.x - bx, p.y - by) > 1e-6) g.line(bx, by, p.x, p.y);
      }
    },
    ...extra,
  });
};

/** Arrow-shaped connector sized to its text; points along the flow. */
function connector(id, name, extra) {
  const th = (doc) => Math.max(0.075, MIN_SYM_TEXT / (doc ? doc.symScale : 1));
  const half = (n, doc) => Math.max(0.375, symTextW(n.props.name, th(doc), doc) / 2 + 0.16);
  const isSource = !!extra.source;
  return defSym({
    id, lib: "pid", name,
    box: (n, doc) => { const L = half(n, doc); return [-L, -0.125, L, 0.125]; },
    ports: (n, doc) => {
      const L = half(n, doc);
      return isSource ? [P("E", L + 0.125, 0, "E", "out")] : [P("W", -L - 0.125, 0, "W", "in")];
    },
    draw(g, n, doc) {
      const L = half(n, doc);
      g.poly([[-L, 0.125], [L - 0.125, 0.125], [L, 0], [L - 0.125, -0.125], [-L, -0.125]], true);
      g.fitText(n.props.name || "", -0.0625, 0, 2 * L - 0.25, th(doc), true);
      if (isSource) leadH(g, L, L + 0.125); else leadH(g, -L - 0.125, -L);
    },
    ...extra,
  });
}

// ------------------------------------------------------------- edge styles
const EDGE_STYLES = {
  power: { lib: "ol", name: "Power conductor", layer: "WIRE" },
  "power-ug": { lib: "ol", name: "Power, underground", layer: "WIRE-UG" },
  control: { lib: "ol", name: "Control / signal", layer: "WIRE-CTRL", minor: true },
  ground: { lib: "ol", name: "Grounding conductor", layer: "WIRE-GND", minor: true },
  pipe: { lib: "pid", name: "Process pipe (major)", layer: "PIPE-MAJOR" },
  "pipe-minor": { lib: "pid", name: "Process pipe (minor)", layer: "PIPE-MINOR" },
  "pipe-ug": { lib: "pid", name: "Pipe, underground / buried", layer: "PIPE-UG" },
  "inst-conn": { lib: "pid", name: "Instrument process connection", layer: "SIGNAL", minor: true },
  "sig-elec": { lib: "pid", name: "Electric signal", layer: "SIGNAL-ELEC", minor: true },
  "sig-pneu": { lib: "pid", name: "Pneumatic signal", layer: "SIGNAL", deco: "slash", minor: true },
  "sig-cap": { lib: "pid", name: "Capillary", layer: "SIGNAL", deco: "x", minor: true },
  "sig-data": { lib: "pid", name: "Data link", layer: "SIGNAL", deco: "o", minor: true },
};
const LINE_WEIGHT_RANK = (style) => (EDGE_STYLES[style]?.minor ? 0 : 1);

/* =========================================================================
 * Document model and node geometry.
 *
 * doc = {type: "oneline"|"pid", name, flow: "down"|"right", font, symScale,
 *        spacing, crossing, uppercase, nodes: [...], edges: [...], notes, titleblock}
 * node = {id, sym, x, y, rot, flip, tag, text, props, labelPos, len?}
 * edge = {id, from: {n, p}, to: {n, p}, style, label, arrow, pts?}
 * ========================================================================= */

const SPACING = {
  compact: { clear: 0.0625, gap: 0.1875 },
  normal: { clear: 0.125, gap: 0.25 },
  airy: { clear: 0.1875, gap: 0.375 },
};
const TEXT_H = { tag: 0.1, line: 0.08, edge: 0.08 };
const LABEL_GAP = 0.08;
const GRID = 0.0625;

const libOf = (doc) => (doc.type === "pid" ? "pid" : "ol");
const flowVec = (doc) => (doc.flow === "right" ? [1, 0] : [0, -1]);
const crossVec = (doc) => (doc.flow === "right" ? [0, -1] : [1, 0]);
const spacingOf = (doc) => SPACING[doc.spacing] || SPACING.normal;
const docFont = (doc) => FONTS[doc.font] || FONTS[DEFAULT_FONT];

function newDoc(type = "oneline") {
  return normalizeDoc({ type, name: type === "pid" ? "New P&ID" : "New one-line" });
}

function normalizeDoc(d) {
  const type = d.type === "pid" ? "pid" : "oneline";
  const doc = {
    v: 1,
    id: d.id || uid("d"),
    type,
    name: d.name || "Untitled",
    flow: d.flow === "right" || d.flow === "down" ? d.flow : type === "pid" ? "right" : "down",
    font: d.font in FONTS ? d.font : DEFAULT_FONT,
    symScale: clamp(Number(d.symScale) || 1, 0.5, 1.5),
    spacing: d.spacing in SPACING ? d.spacing : "normal",
    crossing: ["hop", "gap", "none"].includes(d.crossing) ? d.crossing : "hop",
    uppercase: d.uppercase !== false,
    nodes: [],
    edges: [],
    notes: (d.notes || []).map(String),
    titleblock: Object.assign({ project: "", title: "", drawn_by: "", date: isoToday(), dwg_no: "",
                                rev: "", sheet: "1 OF 1", scale: "NONE" }, d.titleblock || {}),
  };
  for (const n of d.nodes || []) {
    if (!SYMBOLS[n.sym]) continue;
    doc.nodes.push({
      id: n.id || uid("n"), sym: n.sym, x: +n.x || 0, y: +n.y || 0,
      rot: [0, 90, 180, 270].includes(n.rot) ? n.rot : 0, flip: !!n.flip,
      tag: n.tag || "", text: n.text || "", props: Object.assign(defaultProps(n.sym), n.props || {}),
      labelPos: n.labelPos || "auto", ...(n.len ? { len: +n.len } : {}),
    });
  }
  const ids = new Set(doc.nodes.map((n) => n.id));
  for (const e of d.edges || []) {
    if (!e.from || !e.to || !ids.has(e.from.n) || !ids.has(e.to.n)) continue;
    doc.edges.push({
      id: e.id || uid("e"), from: { n: e.from.n, p: e.from.p }, to: { n: e.to.n, p: e.to.p },
      style: EDGE_STYLES[e.style] ? e.style : defaultEdgeStyle(doc),
      label: e.label || "", arrow: ["none", "mid", "end"].includes(e.arrow) ? e.arrow : "none",
      ...(Array.isArray(e.pts) ? { pts: e.pts } : {}),
    });
  }
  return doc;
}

function defaultProps(symId) {
  const o = {};
  for (const p of SYMBOLS[symId].props) o[p.k] = p.def ?? "";
  return o;
}

const defaultEdgeStyle = (doc) => (libOf(doc) === "pid" ? "pipe" : "power");

function nextTag(doc, prefix) {
  let max = 0;
  const re = new RegExp(`^${prefix.replace(/[^A-Za-z0-9]/g, "\\$&")}-(\\d+)$`, "i");
  for (const n of doc.nodes) {
    const m = re.exec(n.tag || "");
    if (m) max = Math.max(max, +m[1]);
  }
  return `${prefix}-${max + 1}`;
}

/** Ids of ports on node `id` that have an edge attached. */
function connectedPorts(doc, id) {
  const s = new Set();
  for (const e of doc.edges) {
    if (e.from.n === id) s.add(e.from.p);
    if (e.to.n === id) s.add(e.to.p);
  }
  return s;
}

// ---------------------------------------------------------------- geometry
const _geomCache = new Map();

/**
 * World geometry of a node: body box, ports, label block and keep-out box.
 * Cached on everything that affects it.
 */
function nodeGeom(doc, n, connected) {
  connected = connected || connectedPorts(doc, n.id);
  const key = JSON.stringify([n.sym, n.x, n.y, n.rot, n.flip, n.len, n.tag, n.text, n.props, n.labelPos,
    doc.symScale, doc.font, doc.uppercase, doc.spacing, doc.type, [...connected].sort()]);
  const hit = _geomCache.get(n.id);
  if (hit && hit.key === key) return hit.g;
  const g = computeGeom(doc, n, connected);
  _geomCache.set(n.id, { key, g });
  return g;
}

function computeGeom(doc, n, connected) {
  const sym = SYMBOLS[n.sym];
  const s = doc.symScale;
  const tf = (x, y) => {
    const [rx, ry] = rotVec((n.flip ? -x : x) * s, y * s, n.rot);
    return [n.x + rx, n.y + ry];
  };
  const tdir = (d) => rotVec(n.flip ? -d[0] : d[0], d[1], n.rot);

  const ports = sym.ports(n, doc).map((p) => {
    const [x, y] = tf(p.x, p.y);
    const dir = tdir(DIRS[p.dir]).map((v) => Math.round(v));
    const port = { id: p.id, x, y, dir, role: p.role, bus: !!p.bus, canon: p.dir };
    return port;
  });

  // body box: symbol box plus port positions
  let lb = sym.box(n, doc);
  for (const p of sym.ports(n, doc)) lb = R.union(lb, [p.x, p.y, p.x, p.y]);
  const c = [tf(lb[0], lb[1]), tf(lb[2], lb[1]), tf(lb[2], lb[3]), tf(lb[0], lb[3])];
  const body = R.of(Math.min(...c.map((p) => p[0])), Math.min(...c.map((p) => p[1])),
                    Math.max(...c.map((p) => p[0])), Math.max(...c.map((p) => p[1])));

  if (sym.bus) {
    const horiz = R.w(body) >= R.h(body);
    for (const p of ports) {
      p.seg = horiz ? [body[0], n.y, body[2], n.y] : [n.x, body[1], n.x, body[3]];
      p.x = n.x; p.y = n.y;
    }
  }

  const flowW = tdir(LIB_FLOW[sym.lib]).map((v) => Math.round(v));
  const label = layoutLabel(doc, n, sym, body, ports, flowW, connected);
  const clear = spacingOf(doc).clear;
  const outer = label ? R.union(body, label.box) : body;
  return { sym, s, body, ports, flowW, label, outer, keep: R.inflate(outer, clear) };
}

function labelLines(doc, n, sym) {
  const up = (t) => (doc.uppercase ? String(t).toUpperCase() : String(t));
  const lines = [];
  if (n.tag) lines.push({ s: up(n.tag), h: TEXT_H.tag, bold: true });
  for (const t of sym.spec(n)) if (t) lines.push({ s: up(t), h: TEXT_H.line, bold: false });
  for (const t of String(n.text || "").split("\n")) if (t.trim()) lines.push({ s: up(t.trim()), h: TEXT_H.line, bold: false });
  return lines;
}

function layoutLabel(doc, n, sym, body, ports, flowW, connected) {
  if (n.labelPos === "none") return null;
  const lines = labelLines(doc, n, sym);
  if (!lines.length) return null;
  const font = docFont(doc);
  const widths = lines.map((l) => textWidth(l.s, l.h, l.bold, font));
  const W = Math.max(...widths);
  const H = lines.reduce((a, l) => a + l.h * LINE_SPACING, 0) - lines[lines.length - 1].h * (LINE_SPACING - 1);

  let side = n.labelPos;
  if (sym.bus && (side === "auto" || side === "end")) side = "end";
  if (side === "auto") {
    const vertical = Math.abs(flowW[1]) > 0.5;
    const prefs = vertical ? ["right", "left", "below", "above"] : ["below", "above", "right", "left"];
    const faces = { right: [1, 0], left: [-1, 0], below: [0, -1], above: [0, 1] };
    const used = ports.filter((p) => connected.has(p.id) && !p.bus);
    side = prefs.find((sd) => !used.some((p) => p.dir[0] === faces[sd][0] && p.dir[1] === faces[sd][1])) || prefs[0];
  }

  let align, x, top;
  const [cx, cy] = [R.cx(body), R.cy(body)];
  if (side === "end") {
    // horizontal bus: above its left end; vertical header: above its top end
    if (R.w(body) >= R.h(body)) {
      // above the left end when the bus is long enough to keep it clear of a centre feed,
      // otherwise beyond the end
      if (W <= R.w(body) / 2 - 0.3) { align = "L"; x = body[0] + 0.02; top = body[3] + 0.1 + H; }
      else { align = "R"; x = body[0] - 0.12; top = cy + H / 2; }
    }
    else { align = "C"; x = cx; top = body[3] + 0.12 + H; }
  } else if (side === "right") { align = "L"; x = body[2] + LABEL_GAP; top = cy + H / 2; }
  else if (side === "left") { align = "R"; x = body[0] - LABEL_GAP; top = cy + H / 2; }
  else if (side === "above") { align = "C"; x = cx; top = body[3] + LABEL_GAP + H; }
  else { align = "C"; x = cx; top = body[1] - LABEL_GAP; }

  const x0 = align === "L" ? x : align === "R" ? x - W : x - W / 2;
  return { lines, widths, align, x, top, side, box: [x0, top - H, x0 + W, top] };
}

/** Port record of node `n` by id, from its geometry. */
const portOf = (g, pid) => g.ports.find((p) => p.id === pid) || g.ports[0];

/** All node geometries for the doc (shared connected-port sets). */
function allGeoms(doc) {
  const conn = new Map(doc.nodes.map((n) => [n.id, new Set()]));
  for (const e of doc.edges) {
    conn.get(e.from.n)?.add(e.from.p);
    conn.get(e.to.n)?.add(e.to.p);
  }
  return new Map(doc.nodes.map((n) => [n.id, nodeGeom(doc, n, conn.get(n.id))]));
}

/** Endpoint of an edge end: {x, y, dir, bus, seg} (bus attach point: nearest to `toward`). */
function endPoint(g, pid, toward) {
  const p = portOf(g, pid);
  if (!p.bus) return { x: p.x, y: p.y, dir: p.dir, bus: false };
  const [x0, y0, x1, y1] = p.seg;
  const inset = 0.0625;
  const horiz = y0 === y1;
  const x = horiz ? clamp(toward ? toward[0] : (x0 + x1) / 2, x0 + inset, x1 - inset) : x0;
  const y = horiz ? y0 : clamp(toward ? toward[1] : (y0 + y1) / 2, y0 + inset, y1 - inset);
  return { x, y, dir: p.dir, bus: true, seg: p.seg };
}

/** Area available for the diagram, and the reserved title/notes corner. */
function drawingArea(doc, notesTop) {
  const m = 0.2;
  const reserved = [IX1 - TB_W, IY0, IX1, notesTop ?? IY0 + TB_H];
  return { outer: [IX0 + m, IY0 + m, IX1 - m, IY1 - m], reserved };
}

/* =========================================================================
 * Render a document to a Sheet (border, title block, notes, nodes, edges).
 * ========================================================================= */

const TYPE_TITLE = { oneline: "ONE-LINE DIAGRAM", pid: "PIPING & INSTRUMENTATION DIAGRAM" };

function drawBorder(sh) {
  sh.rect(FRAME, FRAME, SHEET_W - FRAME, SHEET_H - FRAME, "FRAME-THIN");
  sh.rect(IX0, IY0, IX1, IY1, "FRAME");
  // zones: numbers right-to-left, letters bottom-to-top (ASME Y14.1 style)
  const ncol = 8, nrow = 4;
  const zw = (SHEET_W - 2 * FRAME) / ncol, zh = (SHEET_H - 2 * FRAME) / nrow;
  for (let i = 0; i < ncol; i++) {
    const x0 = SHEET_W - FRAME - (i + 1) * zw;
    if (i < ncol - 1) {
      sh.line(x0, FRAME, x0, IY0, "FRAME-THIN");
      sh.line(x0, IY1, x0, SHEET_H - FRAME, "FRAME-THIN");
    }
    for (const yc of [FRAME + BAND / 2, SHEET_H - FRAME - BAND / 2]) sh.text(String(i + 1), x0 + zw / 2, yc, 0.11);
  }
  for (let j = 0; j < nrow; j++) {
    const y0 = FRAME + j * zh;
    if (j) {
      sh.line(FRAME, y0, IX0, y0, "FRAME-THIN");
      sh.line(IX1, y0, SHEET_W - FRAME, y0, "FRAME-THIN");
    }
    for (const xc of [FRAME + BAND / 2, SHEET_W - FRAME - BAND / 2]) sh.text("ABCD"[j], xc, y0 + zh / 2, 0.11);
  }
}

function cell(sh, x0, y0, x1, y1, label, value, { vh = 0.11, bold = false, align = "left", maxLines = 2 } = {}) {
  sh.text(label, x0 + 0.05, y1 - 0.05, 0.055, "TL", "TEXT-MINOR");
  sh.textBox(value, x0, y0, x1, y1 - 0.09, vh, { hMin: 0.06, align, bold, maxLines });
}

function drawTitleBlock(sh, doc) {
  const tb = doc.titleblock;
  const up = (v, def = "") => String(v || def).toUpperCase();
  const x0 = IX1 - TB_W, y0 = IY0, x1 = IX1, y1 = IY0 + TB_H;
  sh.rect(x0, y0, x1, y1, "TITLE");
  const ys = [y1];
  for (const h of [0.40, 0.45, 0.35, 0.35]) ys.push(ys[ys.length - 1] - h);
  for (const y of ys.slice(1, -1)) sh.line(x0, y, x1, y, "TITLE-GRID");
  cell(sh, x0, ys[1], x1, ys[0], "PROJECT / PROPERTY", up(tb.project), { vh: 0.14, bold: true, maxLines: 1 });
  cell(sh, x0, ys[2], x1, ys[1], "DRAWING TITLE", up(tb.title, `${doc.name} — ${TYPE_TITLE[doc.type]}`),
       { vh: 0.13, bold: true });
  const k = TB_W / 4.6;
  const row3 = [["DRAWN BY", up(tb.drawn_by), 1.6], ["DATE", tb.date || isoToday(), 1.5], ["SCALE", up(tb.scale, "NONE"), 1.5]];
  const row4 = [["SIZE", "B", 0.55], ["DWG NO.", up(tb.dwg_no), 2.15], ["REV", up(tb.rev), 0.55], ["SHEET", up(tb.sheet, "1 OF 1"), 1.35]];
  for (const [row, ya, yb] of [[row3, ys[3], ys[2]], [row4, ys[4], ys[3]]]) {
    let x = x0;
    row.forEach(([lab, val, w], i) => {
      w *= k;
      if (i) sh.line(x, ya, x, yb, "TITLE-GRID");
      cell(sh, x, ya, x + w, yb, lab, val, { vh: lab === "SIZE" ? 0.15 : 0.11, align: "center", maxLines: 1,
                                             bold: lab === "SIZE" || lab === "REV" });
      x += w;
    });
  }
}

/** Notes layout (shared with auto-layout): returns {top, h, blocks}. */
function notesLayout(doc, sh) {
  const notes = doc.notes.filter((n) => String(n).trim());
  if (!notes.length) return { top: IY0 + TB_H, blocks: [], h: TEXT_H.line };
  sh = sh || new Sheet(docFont(doc));
  const w = TB_W - 0.25 - 0.2;
  let h = 0.09;
  const lay = () => {
    const blocks = notes.map((n) => sh.wrap(n, w, h));
    return [blocks, 0.28 + blocks.reduce((a, b) => a + b.length, 0) * h * LINE_SPACING + 0.06];
  };
  let [blocks, need] = lay();
  while (need > 3.5 && h > 0.065) { h -= 0.005; [blocks, need] = lay(); }
  return { top: IY0 + TB_H + need, blocks, h };
}

function drawNotes(sh, doc) {
  const L = notesLayout(doc, sh);
  if (!L.blocks.length) return L.top;
  const x0 = IX1 - TB_W, x1 = IX1, y0 = IY0 + TB_H, y1 = L.top;
  sh.rect(x0, y0, x1, y1, "TITLE");
  sh.text("NOTES", x0 + 0.08, y1 - 0.08, 0.085, "TL", "TEXT", true);
  let y = y1 - 0.28 - L.h / 2;
  L.blocks.forEach((blk, i) => {
    sh.text(`${i + 1}.`, x0 + 0.1, y, L.h, "ML");
    for (const ln of blk) { sh.text(ln, x0 + 0.35, y, L.h, "ML"); y -= L.h * LINE_SPACING; }
  });
  return L.top;
}

// ------------------------------------------------------------------- nodes
function drawNode(sh, doc, n, g) {
  sh.owner = n.id;
  const ctx = new SymCtx(sh, n.x, n.y, n.rot, n.flip, g.s);
  g.sym.draw(ctx, n, doc);
  if (g.label) {
    const L = g.label;
    let y = L.top;
    L.lines.forEach((l) => {
      sh.text(l.s, L.x, y, l.h, "T" + L.align, "TEXT", l.bold);
      y -= l.h * LINE_SPACING;
    });
  }
  sh.owner = "sheet";
}

// ------------------------------------------------------------------- edges
function edgeLayer(e) { return EDGE_STYLES[e.style]?.layer || "WIRE"; }

/** Straight-line fallback path between two ends (used before routing). */
function provisionalPath(doc, e, geoms) {
  const ga = geoms.get(e.from.n), gb = geoms.get(e.to.n);
  if (!ga || !gb) return null;
  const pb0 = portOf(gb, e.to.p);
  const a = endPoint(ga, e.from.p, [pb0.x, pb0.y]);
  const b = endPoint(gb, e.to.p, [a.x, a.y]);
  const s = 0.125;
  const a1 = [a.x + a.dir[0] * s, a.y + a.dir[1] * s], b1 = [b.x + b.dir[0] * s, b.y + b.dir[1] * s];
  const pts = [[a.x, a.y], a1];
  if (Math.abs(a.dir[0]) > 0) pts.push([(a1[0] + b1[0]) / 2, a1[1]], [(a1[0] + b1[0]) / 2, b1[1]]);
  else pts.push([a1[0], (a1[1] + b1[1]) / 2], [b1[0], (a1[1] + b1[1]) / 2]);
  pts.push(b1, [b.x, b.y]);
  return simplifyPath(pts);
}

function simplifyPath(pts) {
  const out = [];
  for (const p of pts) {
    const q = out[out.length - 1];
    if (q && Math.abs(q[0] - p[0]) < 2e-3 && Math.abs(q[1] - p[1]) < 2e-3) continue;
    out.push([round4(p[0]), round4(p[1])]);
    while (out.length >= 3) {
      const [a, b, c] = out.slice(-3);
      const e = 2e-3;
      const col = (Math.abs(a[0] - b[0]) < e && Math.abs(b[0] - c[0]) < e) ||
                  (Math.abs(a[1] - b[1]) < e && Math.abs(b[1] - c[1]) < e);
      if (!col) break;
      out.splice(out.length - 2, 1);
    }
  }
  return out;
}

/** Find crossings between edges; returns Map edgeId -> [{seg, x, y}] marks to draw. */
function findCrossings(doc, paths) {
  const marks = new Map();
  if (doc.crossing === "none") return marks;
  const segs = [];
  for (const e of doc.edges) {
    const pts = paths.get(e.id);
    if (!pts) continue;
    for (let i = 0; i < pts.length - 1; i++) {
      const [a, b] = [pts[i], pts[i + 1]];
      const horiz = Math.abs(a[1] - b[1]) < 1e-6;
      segs.push({ e, i, horiz, a, b, rank: LINE_WEIGHT_RANK(e.style) });
    }
  }
  const H = segs.filter((s) => s.horiz), V = segs.filter((s) => !s.horiz);
  const eps = 0.06;
  for (const h of H) {
    const [hx0, hx1] = [Math.min(h.a[0], h.b[0]), Math.max(h.a[0], h.b[0])];
    const y = h.a[1];
    for (const v of V) {
      if (v.e === h.e) continue;
      const x = v.a[0];
      const [vy0, vy1] = [Math.min(v.a[1], v.b[1]), Math.max(v.a[1], v.b[1])];
      if (x <= hx0 + eps || x >= hx1 - eps || y <= vy0 + eps || y >= vy1 - eps) continue;
      // the lighter line yields; on a tie: hop on the horizontal, gap in the vertical
      let who;
      if (h.rank !== v.rank) who = h.rank < v.rank ? h : v;
      else who = doc.crossing === "hop" ? h : v;
      if (!marks.has(who.e.id)) marks.set(who.e.id, []);
      marks.get(who.e.id).push({ seg: who.i, x, y });
    }
  }
  return marks;
}

/** Split a path into polylines with hops / gaps at the crossing marks. */
function pathWithCrossings(pts, marks, mode) {
  const r = 0.05;
  if (!marks || !marks.length) return [pts.map((p) => [p[0], p[1], 0])];
  const out = [];
  let cur = [[pts[0][0], pts[0][1], 0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [a, b] = [pts[i], pts[i + 1]];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const u = [(b[0] - a[0]) / L, (b[1] - a[1]) / L];
    const ms = marks.filter((m) => m.seg === i)
      .map((m) => ({ ...m, t: (m.x - a[0]) * u[0] + (m.y - a[1]) * u[1] }))
      .filter((m) => m.t > r && m.t < L - r)
      .sort((p, q) => p.t - q.t);
    let lastT = -1;
    for (const m of ms) {
      if (m.t - lastT < 2 * r + 0.02) continue;
      lastT = m.t;
      const p0 = [m.x - u[0] * r, m.y - u[1] * r], p1 = [m.x + u[0] * r, m.y + u[1] * r];
      if (mode === "hop") {
        // arc on the upper side (or left side for vertical runs)
        const up = Math.abs(u[1]) < 0.5 ? (u[0] > 0 ? -1 : 1) : (u[1] > 0 ? 1 : -1);
        cur.push([p0[0], p0[1], up]);
        cur.push([p1[0], p1[1], 0]);
      } else {
        cur.push([p0[0], p0[1], 0]);
        out.push(cur);
        cur = [[p1[0], p1[1], 0]];
      }
    }
    cur.push([b[0], b[1], 0]);
  }
  out.push(cur);
  return out;
}

function pointsAlong(pts, step, skip) {
  const res = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) total += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
  const n = Math.floor((total - 2 * skip) / step);
  if (n < 1) {
    if (total > 0.3) return pointsAt(pts, [total / 2]);
    return res;
  }
  const start = (total - (n - 1) * step) / 2;
  return pointsAt(pts, Array.from({ length: n }, (_, k) => start + k * step));
}

function pointsAt(pts, dists) {
  const res = [];
  let acc = 0, j = 0;
  for (let i = 0; i < pts.length - 1 && j < dists.length; i++) {
    const [a, b] = [pts[i], pts[i + 1]];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    while (j < dists.length && dists[j] <= acc + L + 1e-9) {
      const t = (dists[j] - acc) / L;
      res.push({ x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, u: [(b[0] - a[0]) / L, (b[1] - a[1]) / L] });
      j++;
    }
    acc += L;
  }
  return res;
}

function longestSegment(pts) {
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    const L = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    if (!best || L > best.L + 1e-6) best = { i, L, a: pts[i], b: pts[i + 1] };
  }
  return best;
}

/**
 * Placement of an edge label: {lines, x, top, align, box}. Tries each segment
 * (longest first) on both sides and takes the first spot clear of `avoid`
 * rectangles (symbols, other labels); falls back to the longest segment.
 */
function edgeLabelLayout(doc, e, pts, avoid = []) {
  const text = String(e.label || "").trim();
  if (!text || !pts || pts.length < 2) return null;
  const font = docFont(doc);
  const lines = text.split("\n").map((t) => t.trim()).filter(Boolean)
    .map((t) => (doc.uppercase ? t.toUpperCase() : t));
  const h = TEXT_H.edge;
  const W = Math.max(...lines.map((l) => textWidth(l, h, false, font)));
  const H = lines.length * h * LINE_SPACING - h * (LINE_SPACING - 1);
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [a, b] = [pts[i], pts[i + 1]];
    segs.push({ a, b, L: Math.hypot(b[0] - a[0], b[1] - a[1]), vertical: Math.abs(a[0] - b[0]) < 1e-6 });
  }
  segs.sort((p, q) => q.L - p.L);
  const place = (sg, side) => {
    const mx = (sg.a[0] + sg.b[0]) / 2, my = (sg.a[1] + sg.b[1]) / 2;
    if (sg.vertical) {
      const x = side > 0 ? mx + 0.07 : mx - 0.07, top = my + H / 2;
      return { lines, h, x, top, align: side > 0 ? "L" : "R", box: side > 0 ? [x, top - H, x + W, top] : [x - W, top - H, x, top] };
    }
    const top = side > 0 ? my + 0.07 + H : my - 0.07;
    return { lines, h, x: mx, top, align: "C", box: [mx - W / 2, top - H, mx + W / 2, top] };
  };
  const fits = (sg) => (sg.vertical ? sg.L >= H + 0.1 : sg.L >= W + 0.1);
  const clear = (lab) => !avoid.some((r) => R.overlaps(R.inflate(lab.box, 0.03), r));
  for (const sg of segs.filter(fits)) {
    for (const side of [1, -1]) {
      const lab = place(sg, side);
      if (clear(lab)) return lab;
    }
  }
  return place(segs[0], 1);
}

function drawEdge(sh, doc, e, pts, marks, avoid = []) {
  sh.owner = e.id;
  const style = EDGE_STYLES[e.style] || EDGE_STYLES.power;
  const layer = style.layer;
  for (const piece of pathWithCrossings(pts, marks, doc.crossing)) {
    if (piece.length >= 2) sh.poly(piece, layer);
  }
  // decorations (pneumatic //, capillary x, data o)
  if (style.deco) {
    for (const p of pointsAlong(pts, 0.375, 0.2)) {
      const [ux, uy] = p.u, [nx, ny] = [-uy, ux];
      const d = 0.05;
      if (style.deco === "slash") {
        for (const off of [-0.025, 0.025]) {
          const cx = p.x + ux * off, cy = p.y + uy * off;
          sh.line(cx - (nx + ux) * d * 0.7, cy - (ny + uy) * d * 0.7, cx + (nx + ux) * d * 0.7, cy + (ny + uy) * d * 0.7, layer);
        }
      } else if (style.deco === "x") {
        sh.line(p.x - (nx + ux) * d * 0.6, p.y - (ny + uy) * d * 0.6, p.x + (nx + ux) * d * 0.6, p.y + (ny + uy) * d * 0.6, layer);
        sh.line(p.x - (nx - ux) * d * 0.6, p.y - (ny - uy) * d * 0.6, p.x + (nx - ux) * d * 0.6, p.y + (ny - uy) * d * 0.6, layer);
      } else if (style.deco === "o") {
        sh.circle(p.x, p.y, 0.025, layer);
      }
    }
  }
  // flow arrows
  const head = (x, y, ux, uy) => {
    const len = 0.1, half = 0.04, nx = -uy, ny = ux;
    sh.fill([[x, y], [x - ux * len + nx * half, y - uy * len + ny * half], [x - ux * len - nx * half, y - uy * len - ny * half]]);
  };
  if (e.arrow === "end" && pts.length >= 2) {
    const [a, b] = [pts[pts.length - 2], pts[pts.length - 1]];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (L > 1e-6) head(b[0], b[1], (b[0] - a[0]) / L, (b[1] - a[1]) / L);
  } else if (e.arrow === "mid") {
    const seg = longestSegment(pts);
    if (seg && seg.L > 0.25) {
      const ux = (seg.b[0] - seg.a[0]) / seg.L, uy = (seg.b[1] - seg.a[1]) / seg.L;
      head((seg.a[0] + seg.b[0]) / 2 + ux * 0.05, (seg.a[1] + seg.b[1]) / 2 + uy * 0.05, ux, uy);
    }
  }
  const lab = edgeLabelLayout(doc, e, pts, avoid);
  if (lab) {
    if (avoid) avoid.push(lab.box);
    let y = lab.top;
    for (const l of lab.lines) { sh.text(l, lab.x, y, lab.h, "T" + lab.align, "LABEL"); y -= lab.h * LINE_SPACING; }
  }
  sh.owner = "sheet";
}

/** Path to draw for every edge: its routed points, or a provisional path. */
function edgePaths(doc, geoms) {
  const m = new Map();
  for (const e of doc.edges) m.set(e.id, e.pts && e.pts.length >= 2 ? e.pts : provisionalPath(doc, e, geoms));
  return m;
}

/** Rectangles edge labels must keep clear of: symbols and their labels. */
function labelObstacles(doc, geoms) {
  return doc.nodes.map((n) => geoms.get(n.id)?.outer).filter(Boolean);
}

/** Build the whole sheet. */
function renderDoc(doc, { geoms } = {}) {
  geoms = geoms || allGeoms(doc);
  const sh = new Sheet(docFont(doc));
  drawBorder(sh);
  drawTitleBlock(sh, doc);
  drawNotes(sh, doc);
  const paths = edgePaths(doc, geoms);
  const marks = findCrossings(doc, paths);
  const avoid = labelObstacles(doc, geoms);
  for (const e of doc.edges) {
    const pts = paths.get(e.id);
    if (pts) drawEdge(sh, doc, e, pts, marks.get(e.id), avoid);
  }
  for (const n of doc.nodes) drawNode(sh, doc, n, geoms.get(n.id));
  return { sheet: sh, geoms, paths };
}

/* =========================================================================
 * Output: Sheet -> SVG markup (grouped by owner) and Sheet -> DXF (R2013).
 * ========================================================================= */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const n4 = (v) => +v.toFixed(4);

function svgPathD(pts, closed, Y) {
  let d = `M${n4(pts[0][0])} ${Y(pts[0][1])}`;
  const n = pts.length;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const [xa, ya, bulge] = pts[i], [xb, yb] = pts[(i + 1) % n];
    if (Math.abs(bulge || 0) < 1e-9) { d += `L${n4(xb)} ${Y(yb)}`; continue; }
    const theta = 4 * Math.atan(Math.abs(bulge));
    const chord = Math.hypot(xb - xa, yb - ya);
    if (chord < 1e-9) continue;
    const r = chord / (2 * Math.sin(theta / 2));
    // DXF positive bulge = CCW (y up) -> SVG sweep-flag 0 after the y flip
    d += `A${n4(r)} ${n4(r)} 0 ${theta > Math.PI ? 1 : 0} ${bulge > 0 ? 0 : 1} ${n4(xb)} ${Y(yb)}`;
  }
  return closed ? d + "Z" : d;
}

/**
 * SVG markup for a sheet. Entities are grouped per owner as
 * <g data-owner="id">; `minStroke` keeps hairlines visible on screen.
 */
function sheetToSvgContent(sh, { minStroke = 0 } = {}) {
  const Y = (y) => n4(SHEET_H - y);
  const groups = new Map();
  const add = (owner, s) => { if (!groups.has(owner)) groups.set(owner, []); groups.get(owner).push(s); };
  const stroke = (layer) => {
    const [color, lw, dashed] = LAYERS[layer] || [7, 25];
    const w = Math.max(Math.max(lw, 9) / 100 / 25.4, minStroke);
    return `stroke="${ACI_RGB[color] || "#000"}" stroke-width="${n4(w)}"${dashed ? ' stroke-dasharray="0.125 0.0625"' : ""}`;
  };
  for (const e of sh.ents) {
    const col = ACI_RGB[(LAYERS[e.layer] || [7])[0]] || "#000";
    if (e.t === "line") {
      add(e.owner, `<line x1="${n4(e.x0)}" y1="${Y(e.y0)}" x2="${n4(e.x1)}" y2="${Y(e.y1)}" ${stroke(e.layer)}/>`);
    } else if (e.t === "circle") {
      add(e.owner, `<circle cx="${n4(e.x)}" cy="${Y(e.y)}" r="${n4(e.r)}" fill="none" ${stroke(e.layer)}/>`);
    } else if (e.t === "poly") {
      add(e.owner, `<path d="${svgPathD(e.pts, e.closed, Y)}" fill="none" ${stroke(e.layer)}/>`);
    } else if (e.t === "fill") {
      add(e.owner, `<path d="${svgPathD(e.pts, true, Y)}" fill="${col}" stroke="none"/>`);
    } else if (e.t === "text") {
      const [v, hz] = e.align;
      const base = v === "M" ? e.y - e.h / 2 : v === "T" ? e.y - e.h : e.y;
      const anchor = hz === "L" ? "start" : hz === "R" ? "end" : "middle";
      add(e.owner, `<text x="${n4(e.x)}" y="${Y(base)}" font-size="${n4(e.h / sh.font.cap)}" text-anchor="${anchor}"` +
        `${e.bold ? ' font-weight="bold"' : ""} fill="${col}">${esc(e.s)}</text>`);
    }
  }
  let out = "";
  for (const [owner, items] of groups) out += `<g data-owner="${esc(owner)}">${items.join("")}</g>`;
  return out;
}

function sheetToSvg(sh, { width = "100%", height = "100%", minStroke = 0 } = {}) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SHEET_W} ${SHEET_H}" width="${width}" height="${height}" ` +
         `font-family="${sh.font.css.replace(/"/g, "'")}" stroke-linecap="round" stroke-linejoin="round">` +
         `<rect width="${SHEET_W}" height="${SHEET_H}" fill="#fff"/>${sheetToSvgContent(sh, { minStroke })}</svg>`;
}

// ---------------------------------------------------------------------- DXF
/**
 * Splice the entities into the embedded R2013 template (generated by
 * tools/make_dxf_template.py: header, layers, text styles, ANSI B layout).
 */
function sheetToDxf(sh) {
  const tpl = JSON.parse(document.getElementById("dxf-template").textContent);
  let handle = parseInt(tpl.seed, 16);
  const out = [];
  const tag = (code, value) => out.push(String(code).padStart(3, " "), String(value));
  const num = (v) => {
    let s = String(+v.toFixed(6));
    if (s === "-0") s = "0";
    return s.includes(".") || s.includes("e") ? s : s + ".0";
  };
  const head = (type, layer, sub, color) => {
    tag(0, type); tag(5, (handle++).toString(16).toUpperCase()); tag(330, tpl.owner);
    tag(100, "AcDbEntity"); tag(8, layer);
    if (color !== undefined) tag(62, color);
    tag(100, sub);
  };
  const ALIGN_H = { L: 0, C: 1, R: 2 }, ALIGN_V = { B: 1, M: 2, T: 3 };

  for (const e of sh.ents) {
    if (e.t === "line") {
      head("LINE", e.layer, "AcDbLine");
      tag(10, num(e.x0)); tag(20, num(e.y0)); tag(30, "0.0");
      tag(11, num(e.x1)); tag(21, num(e.y1)); tag(31, "0.0");
    } else if (e.t === "poly") {
      head("LWPOLYLINE", e.layer, "AcDbPolyline");
      tag(90, e.pts.length); tag(70, e.closed ? 1 : 0);
      for (const [x, y, b] of e.pts) {
        tag(10, num(x)); tag(20, num(y));
        if (b) tag(42, num(b));
      }
    } else if (e.t === "circle") {
      head("CIRCLE", e.layer, "AcDbCircle");
      tag(10, num(e.x)); tag(20, num(e.y)); tag(30, "0.0"); tag(40, num(e.r));
    } else if (e.t === "text") {
      head("TEXT", e.layer, "AcDbText");
      tag(10, num(e.x)); tag(20, num(e.y)); tag(30, "0.0"); tag(40, num(e.h));
      tag(1, e.s.replace(/%%/g, "%%%")); tag(7, e.bold ? "DD-BOLD" : "DD-STD");
      const hz = ALIGN_H[e.align[1]];
      if (hz) tag(72, hz);
      tag(11, num(e.x)); tag(21, num(e.y)); tag(31, "0.0");
      tag(100, "AcDbText"); tag(73, ALIGN_V[e.align[0]]);
    } else if (e.t === "fill") {
      const bulges = e.pts.some((p) => p[2]);
      head("HATCH", e.layer, "AcDbHatch", LAYERS[e.layer][0]);
      tag(10, "0.0"); tag(20, "0.0"); tag(30, "0.0");
      tag(210, "0.0"); tag(220, "0.0"); tag(230, "1.0");
      tag(2, "SOLID"); tag(70, 1); tag(71, 0);
      tag(91, 1); tag(92, 3); tag(72, bulges ? 1 : 0); tag(73, 1); tag(93, e.pts.length);
      for (const [x, y, b] of e.pts) {
        tag(10, num(x)); tag(20, num(y));
        if (bulges) tag(42, num(b || 0));
      }
      tag(97, 0); tag(75, 1); tag(76, 1); tag(98, 0);
    }
  }
  const [reg, bold] = sh.font.files;
  return tpl.dxf
    .replace("\n  3\narial.ttf\n", () => `\n  3\n${reg}\n`)
    .replace("\n  3\narialbd.ttf\n", () => `\n  3\n${bold}\n`)
    .replace("%%ENTITIES%%", () => (out.length ? out.join("\n") + "\n" : ""))
    .replace("%%HANDSEED%%", () => handle.toString(16).toUpperCase());
}

/* =========================================================================
 * Orthogonal connector routing.
 *
 * Builds a sparse "visibility grid" from interesting coordinates: obstacle
 * edges (symbol bodies inflated by a margin, label boxes), port and stub
 * coordinates, centrelines (plus parallel tracks) of the channels between
 * obstacles, and a coarse background grid. A* over (grid point, heading)
 * minimises length + bends, and penalises crossing, touching or running
 * along wires that are already routed.
 * ========================================================================= */

const ROUTE = { margin: 0.125, bend: 0.4, cross: 0.15, overlap: 6, touch: 2.0, track: 0.125, coarse: 0.5 };
const HEAD = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // E N W S
const headOf = (d) => (d[0] > 0.5 ? 0 : d[1] > 0.5 ? 1 : d[0] < -0.5 ? 2 : 3);
// all routing coordinates are quantised to 0.001" so equal positions compare equal
const Q = (v) => Math.round(v * 1000) / 1000;
const kf = (v) => Math.round(v * 1000);

function lowerBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; }
  return lo;
}

class Router {
  constructor(doc, geoms) {
    this.doc = doc;
    this.geoms = geoms;
    const M = ROUTE.margin;
    const obs = [];
    const q = (r) => r.map(Q);
    for (const [id, g] of geoms) {
      if (g.sym.junction) continue;
      obs.push({ r: q(R.inflate(g.body, M)), id });
      if (g.label) obs.push({ r: q(R.inflate(g.label.box, 0.03)), id });
    }
    const nt = notesLayout(doc).top;
    obs.push({ r: [IX1 - TB_W - 0.1, IY0 - 1, IX1 + 1, nt + 0.1], id: null });
    this.obs = obs;
    this.area = [IX0 + 0.06, IY0 + 0.06, IX1 - 0.06, IY1 - 0.06];
    this.hOcc = new Map(); // y key -> [[x0, x1, id]]
    this.vOcc = new Map(); // x key -> [[y0, y1, id]]
    this.verts = new Map(); // "x,y" key -> Set(id)
  }

  // ------------------------------------------------------------ occupancy
  occupy(id, pts) {
    for (let i = 0; i < pts.length - 1; i++) {
      const [a, b] = [pts[i], pts[i + 1]];
      if (Math.abs(a[1] - b[1]) < 1e-6) {
        const k = kf(a[1]);
        if (!this.hOcc.has(k)) this.hOcc.set(k, []);
        this.hOcc.get(k).push([Math.min(a[0], b[0]), Math.max(a[0], b[0]), id]);
      } else {
        const k = kf(a[0]);
        if (!this.vOcc.has(k)) this.vOcc.set(k, []);
        this.vOcc.get(k).push([Math.min(a[1], b[1]), Math.max(a[1], b[1]), id]);
      }
    }
    for (const p of pts) {
      const k = kf(p[0]) + "," + kf(p[1]);
      if (!this.verts.has(k)) this.verts.set(k, new Set());
      this.verts.get(k).add(id);
    }
  }

  // ------------------------------------------------------------- the grid
  endSpec(g, pid, toward) {
    const p = portOf(g, pid);
    const M = ROUTE.margin;
    if (p.bus) {
      const [x0, y0, x1, y1] = p.seg;
      const horiz = Math.abs(y0 - y1) < 1e-9;
      const off = (horiz ? R.h(g.body) : R.w(g.body)) / 2 + M;
      return { bus: true, horiz, seg: p.seg, dir: p.dir, line: Q(horiz ? y0 + p.dir[1] * off : x0 + p.dir[0] * off),
               lo: Q((horiz ? x0 : y0) + 0.0625), hi: Q((horiz ? x1 : y1) - 0.0625), toward };
    }
    return { bus: false, x: p.x, y: p.y, dir: p.dir, sx: Q(p.x + p.dir[0] * M), sy: Q(p.y + p.dir[1] * M) };
  }

  build(specs) {
    const [ax0, ay0, ax1, ay1] = this.area;
    const X = new Set(), Y = new Set();
    const addX = (v) => { if (v >= ax0 - 1e-9 && v <= ax1 + 1e-9) X.add(Q(v)); };
    const addY = (v) => { if (v >= ay0 - 1e-9 && v <= ay1 + 1e-9) Y.add(Q(v)); };
    addX(ax0); addX(ax1); addY(ay0); addY(ay1);
    for (const { r } of this.obs) { addX(r[0]); addX(r[2]); addY(r[1]); addY(r[3]); }
    for (const s of specs) {
      if (s.bus) {
        if (s.horiz) addY(s.line); else addX(s.line);
        if (s.toward) { if (s.horiz) addX(clamp(s.toward[0], s.lo, s.hi)); else addY(clamp(s.toward[1], s.lo, s.hi)); }
      } else { addX(s.x); addY(s.y); addX(s.sx); addY(s.sy); }
    }
    // channel centrelines and tracks
    const channels = (vals, add) => {
      const v = [...vals].sort((a, b) => a - b);
      for (let i = 0; i < v.length - 1; i++) {
        const [a, b] = [v[i], v[i + 1]];
        if (b - a < 0.2) continue;
        const mid = (a + b) / 2;
        add(mid);
        for (let k = 1; k <= 3; k++) {
          for (const t of [mid - k * ROUTE.track, mid + k * ROUTE.track]) if (t > a + 0.06 && t < b - 0.06) add(t);
        }
      }
    };
    const obsX = new Set(), obsY = new Set();
    for (const { r } of this.obs) { obsX.add(r[0]); obsX.add(r[2]); obsY.add(r[1]); obsY.add(r[3]); }
    obsX.add(ax0); obsX.add(ax1); obsY.add(ay0); obsY.add(ay1);
    channels(obsX, addX); channels(obsY, addY);
    for (let x = Math.ceil(ax0 / ROUTE.coarse) * ROUTE.coarse; x < ax1; x += ROUTE.coarse) addX(x);
    for (let y = Math.ceil(ay0 / ROUTE.coarse) * ROUTE.coarse; y < ay1; y += ROUTE.coarse) addY(y);

    const xs = [...X].sort((a, b) => a - b), ys = [...Y].sort((a, b) => a - b);
    const nx = xs.length, ny = ys.length;
    const nodeB = new Uint8Array(nx * ny), hB = new Uint8Array(nx * ny), vB = new Uint8Array(nx * ny);
    const eps = 1e-6;
    for (const { r } of this.obs) {
      const i0 = lowerBound(xs, r[0] - eps), i1 = lowerBound(xs, r[2] + eps);   // xs[i0..i1-1] within [x0, x1]
      const j0 = lowerBound(ys, r[1] - eps), j1 = lowerBound(ys, r[3] + eps);
      for (let j = j0; j < j1; j++) {
        const yIn = ys[j] > r[1] + eps && ys[j] < r[3] - eps;
        for (let i = i0; i < i1; i++) {
          const xIn = xs[i] > r[0] + eps && xs[i] < r[2] - eps;
          if (xIn && yIn) nodeB[j * nx + i] = 1;
          // horizontal move (i -> i+1) along row j crosses the interior
          if (yIn && i + 1 < i1) hB[j * nx + i] = 1;
          // vertical move (j -> j+1) along column i crosses the interior
          if (xIn && j + 1 < j1) vB[j * nx + i] = 1;
        }
      }
    }
    Object.assign(this, { xs, ys, nx, ny, nodeB, hB, vB });
    this.xi = new Map(xs.map((v, i) => [kf(v), i]));
    this.yi = new Map(ys.map((v, i) => [kf(v), i]));
  }

  idx(x, y) {
    const i = this.xi.get(kf(x)), j = this.yi.get(kf(y));
    return i === undefined || j === undefined ? -1 : j * this.nx + i;
  }

  /** Grid nodes along a bus stub line, with the heading that leads away from / into the bus. */
  busNodes(s) {
    const out = [];
    if (s.horiz) {
      const j = this.yi.get(kf(s.line));
      if (j === undefined) return out;
      for (let i = 0; i < this.nx; i++) if (this.xs[i] >= s.lo && this.xs[i] <= s.hi) out.push(j * this.nx + i);
    } else {
      const i = this.xi.get(kf(s.line));
      if (i === undefined) return out;
      for (let j = 0; j < this.ny; j++) if (this.ys[j] >= s.lo && this.ys[j] <= s.hi) out.push(j * this.nx + i);
    }
    return out.filter((k) => !this.nodeB[k]);
  }

  /** Does the straight segment a-b pass through any obstacle (other than the given owners)? */
  blockedSegment(a, b, ignore) {
    const r = R.of(a[0], a[1], b[0], b[1]);
    return this.obs.some((o) => !ignore.includes(o.id) && R.overlaps(R.inflate(o.r, -ROUTE.margin + 0.02), r, -1e-9));
  }

  // -------------------------------------------------------------- costs
  overlapCost(horiz, line, a, b, id) {
    const list = (horiz ? this.hOcc : this.vOcc).get(kf(line));
    if (!list) return 0;
    let c = 0;
    const [lo, hi] = [Math.min(a, b), Math.max(a, b)];
    for (const [s0, s1, oid] of list) {
      if (oid === id) continue;
      const ov = Math.min(hi, s1) - Math.max(lo, s0);
      if (ov > 1e-6) c += ROUTE.overlap * (1 + ov);
    }
    return c;
  }

  /** Another wire passes through point (x, y) perpendicular to `horiz` motion. */
  crossesAt(horiz, x, y, id) {
    const list = (horiz ? this.vOcc : this.hOcc).get(kf(horiz ? x : y));
    if (!list) return false;
    const v = horiz ? y : x;
    return list.some(([s0, s1, oid]) => oid !== id && v > s0 + 1e-6 && v < s1 - 1e-6);
  }

  occupiedAt(x, y, id) {
    const vs = this.verts.get(kf(x) + "," + kf(y));
    if (vs && [...vs].some((o) => o !== id)) return true;
    return this.crossesAt(true, x, y, id) || this.crossesAt(false, x, y, id);
  }

  // ----------------------------------------------------------------- A*
  search(starts, goals, id, goalBox) {
    const { nx, ny, xs, ys } = this;
    const N = nx * ny * 4;
    const gS = new Float64Array(N).fill(Infinity);
    const from = new Int32Array(N).fill(-1);
    const heap = new Heap();
    const h = (k) => {
      const i = k % nx, j = (k / nx) | 0;
      const x = xs[i], y = ys[j];
      const dx = x < goalBox[0] ? goalBox[0] - x : x > goalBox[2] ? x - goalBox[2] : 0;
      const dy = y < goalBox[1] ? goalBox[1] - y : y > goalBox[3] ? y - goalBox[3] : 0;
      return dx + dy;
    };
    for (const { k, hd } of starts) {
      const s = k * 4 + hd;
      gS[s] = 0;
      heap.push(s, h(k));
    }
    let expansions = 0;
    let best = null;
    while (heap.size) {
      const s = heap.pop();
      const k = s >> 2, hd = s & 3;
      const g0 = gS[s];
      if (best && g0 + h(k) >= best.cost) break;
      if (++expansions > 400000) break;
      const req = goals.get(k);
      if (req !== undefined && req !== (hd + 2) % 4) {
        const cost = g0 + (req === hd ? 0 : ROUTE.bend);
        if (!best || cost < best.cost) best = { cost, s };
      }
      const i = k % nx, j = (k / nx) | 0;
      for (const nh of [hd, (hd + 1) % 4, (hd + 3) % 4]) {
        let ni = i, nj = j;
        if (nh === 0) { if (i + 1 >= nx || this.hB[j * nx + i]) continue; ni = i + 1; }
        else if (nh === 2) { if (i === 0 || this.hB[j * nx + i - 1]) continue; ni = i - 1; }
        else if (nh === 1) { if (j + 1 >= ny || this.vB[j * nx + i]) continue; nj = j + 1; }
        else { if (j === 0 || this.vB[(j - 1) * nx + i]) continue; nj = j - 1; }
        const nk = nj * nx + ni;
        if (this.nodeB[nk]) continue;
        const horiz = nh === 0 || nh === 2;
        let c = g0 + Math.abs(xs[ni] - xs[i]) + Math.abs(ys[nj] - ys[j]);
        if (nh !== hd) {
          c += ROUTE.bend;
          if (this.occupiedAt(xs[i], ys[j], id)) c += ROUTE.touch;
        }
        c += horiz ? this.overlapCost(true, ys[j], xs[i], xs[ni], id) : this.overlapCost(false, xs[i], ys[j], ys[nj], id);
        if (this.crossesAt(horiz, xs[ni], ys[nj], id)) c += ROUTE.cross;
        const ns = nk * 4 + nh;
        if (c < gS[ns] - 1e-9) {
          gS[ns] = c;
          from[ns] = s;
          heap.push(ns, c + h(nk));
        }
      }
    }
    if (!best) return null;
    const seq = [];
    for (let s = best.s; s !== -1; s = from[s]) seq.push(s >> 2);
    seq.reverse();
    return seq.map((k) => [this.xs[k % nx], this.ys[(k / nx) | 0]]);
  }

  route(e) {
    const ga = this.geoms.get(e.from.n), gb = this.geoms.get(e.to.n);
    const A = e._A, B = e._B;
    const startList = [], goals = new Map();
    let goalBox;
    if (A.bus) {
      for (const k of this.busNodes(A)) startList.push({ k, hd: headOf(A.dir) });
    } else {
      const k = this.idx(A.sx, A.sy);
      if (k >= 0 && !this.nodeB[k]) startList.push({ k, hd: headOf(A.dir) });
    }
    if (B.bus) {
      const req = headOf([-B.dir[0], -B.dir[1]]);
      for (const k of this.busNodes(B)) goals.set(k, req);
      goalBox = B.horiz ? [B.lo, B.line, B.hi, B.line] : [B.line, B.lo, B.line, B.hi];
    } else {
      const k = this.idx(B.sx, B.sy);
      if (k >= 0 && !this.nodeB[k]) goals.set(k, headOf([-B.dir[0], -B.dir[1]]));
      goalBox = [B.sx, B.sy, B.sx, B.sy];
    }
    // facing ports on one line with nothing between them: connect directly
    if (!A.bus && !B.bus && A.dir[0] === -B.dir[0] && A.dir[1] === -B.dir[1]) {
      const along = (B.x - A.x) * A.dir[0] + (B.y - A.y) * A.dir[1];
      const offAxis = Math.abs((B.x - A.x) * A.dir[1]) + Math.abs((B.y - A.y) * A.dir[0]);
      if (along > 0 && offAxis < 2e-3 && !this.blockedSegment([A.x, A.y], [B.x, B.y], [e.from.n, e.to.n])) {
        return A.dir[0] ? [[A.x, A.y], [B.x, A.y]] : [[A.x, A.y], [A.x, B.y]];
      }
    }
    if (!startList.length || !goals.size || !ga || !gb) return null;
    const mid = this.search(startList, goals, e.id, goalBox);
    if (!mid) return null;
    const first = mid[0], last = mid[mid.length - 1];
    const pa = A.bus ? (A.horiz ? [first[0], A.seg[1]] : [A.seg[0], first[1]]) : [A.x, A.y];
    const pb = B.bus ? (B.horiz ? [last[0], B.seg[1]] : [B.seg[0], last[1]]) : [B.x, B.y];
    const pts = simplifyPath([[Q(pa[0]), Q(pa[1])], ...mid, [Q(pb[0]), Q(pb[1])]]);
    // put the exact port coordinates back, keeping the end segments orthogonal
    const fix = (end, i, j) => {
      const p = pts[i], q = pts[j];
      if (Math.abs(p[0] - q[0]) < 1e-9) q[0] = end[0]; else q[1] = end[1];
      pts[i] = [end[0], end[1]];
    };
    if (pts.length >= 2) { fix(pa, 0, 1); fix(pb, pts.length - 1, pts.length - 2); }
    return pts;
  }
}

/**
 * Route edges. `ids`: edges to (re)route (default: all). Other edges keep
 * their paths and count as occupied.
 */
function routeEdges(doc, ids = null, geoms = null) {
  geoms = geoms || allGeoms(doc);
  const router = new Router(doc, geoms);
  const todo = doc.edges.filter((e) => !ids || ids.has(e.id));
  const todoSet = new Set(todo.map((e) => e.id));
  for (const e of doc.edges) if (!todoSet.has(e.id) && e.pts) router.occupy(e.id, e.pts);
  for (const e of todo) {
    const ga = geoms.get(e.from.n), gb = geoms.get(e.to.n);
    if (!ga || !gb) continue;
    const pa = portOf(ga, e.from.p), pb = portOf(gb, e.to.p);
    e._A = router.endSpec(ga, e.from.p, [pb.x, pb.y]);
    e._B = router.endSpec(gb, e.to.p, [pa.x, pa.y]);
  }
  router.build(todo.filter((e) => e._A).flatMap((e) => [e._A, e._B]));
  const len = (e) => {
    if (!e._A) return 0;
    const a = e._A.bus ? e._A.toward || [0, 0] : [e._A.x, e._A.y];
    const b = e._B.bus ? e._B.toward || [0, 0] : [e._B.x, e._B.y];
    return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
  };
  const order = [...todo].sort((a, b) => len(a) - len(b));
  let failed = 0;
  for (const e of order) {
    if (!e._A) continue;
    let pts = router.route(e);
    if (!pts) { pts = provisionalPath(doc, e, geoms); failed++; e.routeFailed = true; }
    else delete e.routeFailed;
    e.pts = pts;
    if (pts) router.occupy(e.id, pts);
    delete e._A; delete e._B;
  }
  return { failed };
}

/* =========================================================================
 * Auto-arrange: layered tree layout with contour packing.
 *
 * Coordinates: m = along the flow (down or right), c = across it.
 *  1. Satellites (instruments, vents, expansion tanks with one connection)
 *     ride alongside their host.
 *  2. A spanning tree is grown from the sources. Port sides decide
 *     direction: a neighbour on a node's upstream-facing port is a "feeder"
 *     (one rank up), anything else is a child (one rank down). Each node is
 *     rotated so the connecting port faces its parent.
 *  3. Subtrees are packed across the flow using per-rank contours; runs are
 *     aligned port-to-port so connections are straight; buses stretch to
 *     span their branches.
 *  4. Rank and sibling gaps are scaled so the drawing fills the free sheet
 *     area (or compressed, then symbols scaled down, if it doesn't fit).
 * ========================================================================= */

function autoArrange(doc, { route = true } = {}) {
  const F = { m: flowVec(doc), c: crossVec(doc) };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const lib = libOf(doc);
  const baseRot = rotBetween(LIB_FLOW[lib], F.m);
  const sp = spacingOf(doc);
  const byId = new Map(doc.nodes.map((n) => [n.id, n]));
  const symOf = (id) => SYMBOLS[byId.get(id).sym];

  // ------------------------------------------------------------ adjacency
  const adj = new Map(doc.nodes.map((n) => [n.id, []]));
  for (const e of doc.edges) {
    if (e.from.n === e.to.n || !adj.has(e.from.n) || !adj.has(e.to.n)) continue;
    adj.get(e.from.n).push({ e, p: e.from.p, o: e.to.n, q: e.to.p });
    adj.get(e.to.n).push({ e, p: e.to.p, o: e.from.n, q: e.from.p });
  }
  const conn = new Map(doc.nodes.map((n) => [n.id, new Set(adj.get(n.id).map((l) => l.p))]));

  const canonDir = (id, pid) => {
    const n = byId.get(id);
    const ports = SYMBOLS[n.sym].ports(n, doc);
    const p = ports.find((x) => x.id === pid) || ports[0];
    return DIRS[p.dir];
  };
  const worldDir = (id, pid, rot) => rotVec(...canonDir(id, pid), rot);

  // ----------------------------------------------------------- satellites
  const satOf = new Map();    // satellite id -> link from satellite to host
  const satsOn = new Map();   // host id -> [satellite ids]
  for (const n of doc.nodes) {
    const sym = SYMBOLS[n.sym], links = adj.get(n.id);
    if (!sym.satellite || links.length !== 1) continue;
    const hs = symOf(links[0].o);
    if (hs.satellite || hs.bus) continue;
    satOf.set(n.id, links[0]);
    if (!satsOn.has(links[0].o)) satsOn.set(links[0].o, []);
    satsOn.get(links[0].o).push(n.id);
  }

  // ------------------------------------------------------------- the tree
  const posKey = (n) => [dot([n.x, n.y], F.m), dot([n.x, n.y], F.c)];
  const mains = doc.nodes.filter((n) => !satOf.has(n.id));
  const rootOrder = [...mains].sort((a, b) => {
    const pa = SYMBOLS[a.sym].primary ? 0 : SYMBOLS[a.sym].source ? 1 : 2;
    const pb = SYMBOLS[b.sym].primary ? 0 : SYMBOLS[b.sym].source ? 1 : 2;
    if (pa !== pb) return pa - pb;
    const [am, ac] = posKey(a), [bm, bc] = posKey(b);
    return Math.abs(am - bm) > 0.05 ? am - bm : ac - bc;
  });
  // Grow the tree with prioritised links so loops break at their return side:
