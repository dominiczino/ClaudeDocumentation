  //  tier 0: downstream links entering V on its natural inlet side (no rotation needed)
  //  tier 1: other downstream links;  tier 2: upstream "feeder" links.
  const info = new Map();
  const roots = [];
  const inletSide = (id, pid) => {
    const sym = symOf(id);
    if (sym.junction || sym.bus || sym.instrument) return true;
    const d = canonDir(id, pid), f = LIB_FLOW[sym.lib];
    return dot(d, f) < -0.5;
  };
  for (const r of rootOrder) {
    if (info.has(r.id)) continue;
    roots.push(r.id);
    info.set(r.id, { rank: 0, rot: baseRot, parent: null, kids: [], root: r.id });
    const tiers = [[], [], []];
    const enqueue = (U) => {
      const I = info.get(U);
      for (const L of adj.get(U)) {
        if (info.has(L.o) || satOf.has(L.o)) continue;
        const side = dot(worldDir(U, L.p, I.rot), F.m);
        const tier = side < -0.5 ? 2 : inletSide(L.o, L.q) ? 0 : 1;
        tiers[tier].push({ U, L, side });
      }
    };
    enqueue(r.id);
    for (;;) {
      const t = tiers.findIndex((q) => q.length);
      if (t < 0) break;
      const { U, L, side } = tiers[t].shift();
      if (info.has(L.o)) continue;
      const I = info.get(U);
      const feeder = side < -0.5;
      const want = feeder ? F.m : [-F.m[0], -F.m[1]];
      const rot = rotBetween(canonDir(L.o, L.q), want);
      info.set(L.o, { rank: I.rank + (feeder ? -1 : 1), rot, parent: U, pp: L.p, q: L.q, feeder,
                      down: side > 0.5, kids: [], root: r.id, edge: L.e });
      I.kids.push(L.o);
      enqueue(L.o);
    }
  }
  // satellites: connected port faces the host side
  const satSide = new Map();
  for (const [sid, L] of satOf) {
    const H = info.get(L.o);
    if (!H) continue;
    const hd = worldDir(L.o, L.q, H.rot);
    const side = dot(hd, F.c) > 0.5 ? 1 : -1;       // place where the host port points
    satSide.set(sid, side);
    info.set(sid, { rank: H.rank, rot: rotBetween(canonDir(sid, L.p), [-side * F.c[0], -side * F.c[1]]),
                    sat: true, host: L.o, kids: [] });
  }

  // --------------------------------------------------------- measurements
  const geomAt = (id, rot, len) => {
    const n = byId.get(id);
    const tmp = { ...n, x: 0, y: 0, rot, flip: false, ...(len ? { len } : {}) };
    return computeGeom(doc, tmp, conn.get(id));
  };
  const extOf = (g) => {
    const r = g.keep, pts = [[r[0], r[1]], [r[2], r[1]], [r[0], r[3]], [r[2], r[3]]];
    const ms = pts.map((p) => dot(p, F.m)), cs = pts.map((p) => dot(p, F.c));
    return { mMin: Math.min(...ms), mMax: Math.max(...ms), cMin: Math.min(...cs), cMax: Math.max(...cs) };
  };
  const portOff = (g, pid) => { const p = portOf(g, pid); return { m: dot([p.x, p.y], F.m), c: dot([p.x, p.y], F.c) }; };
  const edgeLabelSize = (e) => {
    const t = String(e?.label || "").trim();
    if (!t) return null;
    const lines = t.split("\n").filter((x) => x.trim());
    const font = docFont(doc);
    const W = Math.max(...lines.map((l) => textWidth(doc.uppercase ? l.toUpperCase() : l, TEXT_H.edge, false, font)));
    const H = lines.length * TEXT_H.edge * LINE_SPACING;
    return { W, H };
  };

  // ---------------------------------------------------------- one layout
  function compute(kc, km, foldLen = Infinity) {
    const gapC = sp.gap * kc, gapM = sp.gap * km;
    const blocks = new Map();   // id -> {E (m/c extents incl. satellites), g}
    const lens = new Map();
    const satPos = new Map();   // sat id -> {m, c} relative to host

    const ownBlock = (id) => {
      const I = info.get(id);
      const g = geomAt(id, I.rot, lens.get(id));
      const E = extOf(g);
      // edge label from the parent sits beside the incoming run
      if (I.parent && I.edge) {
        const ls = edgeLabelSize(I.edge);
        if (ls) {
          const pq = portOff(g, I.q);
          if (doc.flow === "down") E.cMax = Math.max(E.cMax, pq.c + ls.W + 0.15);
          else E.cMin = Math.min(E.cMin, pq.c - ls.H - 0.15);
        }
      }
      // satellites
      const sats = satsOn.get(id) || [];
      const placed = [];
      for (const sid of sats) {
        const S = info.get(sid), L = satOf.get(sid);
        const gs = geomAt(sid, S.rot);
        const ES = extOf(gs);
        const side = satSide.get(sid);
        const hp = portOff(g, L.q), sq = portOff(gs, L.p);
        const c = side < 0 ? E.cMin - gapC * 0.5 - ES.cMax : E.cMax + gapC * 0.5 - ES.cMin;
        placed.push({ sid, ES, c, want: hp.m - sq.m, side });
      }
      // spread satellites on the same side along the flow
      for (const side of [-1, 1]) {
        const group = placed.filter((p) => p.side === side).sort((a, b) => a.want - b.want);
        let last = -Infinity;
        for (const p of group) {
          p.m = Math.max(p.want, last - p.ES.mMin + gapC * 0.5);
          last = p.m + p.ES.mMax;
        }
        // keep the group centred on where its connections want it
        if (group.length > 1) {
          const avg = (k) => group.reduce((a, p) => a + p[k], 0) / group.length;
          const shift = avg("want") - avg("m");
          for (const p of group) p.m += shift;
        }
      }
      for (const p of placed) {
        satPos.set(p.sid, { m: p.m, c: p.c });
        E.mMin = Math.min(E.mMin, p.m + p.ES.mMin); E.mMax = Math.max(E.mMax, p.m + p.ES.mMax);
        E.cMin = Math.min(E.cMin, p.c + p.ES.cMin); E.cMax = Math.max(E.cMax, p.c + p.ES.cMax);
      }
      blocks.set(id, { E, g });
      return { E, g };
    };

    const kidPos = new Map();
    const addCont = (cont, rank, lo, hi) => {
      const cur = cont.get(rank);
      cont.set(rank, cur ? [Math.min(cur[0], lo), Math.max(cur[1], hi)] : [lo, hi]);
    };

    /** Lay out the subtree of U (U at c = 0). Returns its contour: rank -> [lo, hi]. */
    function layout(U, parentBlock) {
      const I = info.get(U);
      const isBus = symOf(U).bus;
      const pre = isBus ? null : ownBlock(U);
      const subs = I.kids.map((V) => {
        const J = info.get(V);
        let desired = null;
        if (!isBus) {
          const gv = geomAt(V, J.rot, null);
          desired = portOff(pre.g, J.pp).c - portOff(gv, J.q).c;
        }
        return { V, J, desired };
      });
      for (const s of subs) {
        const pb = s.desired != null && pre ? { rank: I.rank, lo: pre.E.cMin - s.desired, hi: pre.E.cMax - s.desired } : null;
        s.cont = layout(s.V, pb);
        const n = byId.get(s.V);
        s.key = s.desired != null ? s.desired : dot([n.x, n.y], F.c);
      }
      subs.sort((a, b) => a.key - b.key || (a.J.feeder - b.J.feeder));

      const merged = new Map();
      if (parentBlock) addCont(merged, parentBlock.rank, parentBlock.lo, parentBlock.hi);
      if (pre) addCont(merged, I.rank, pre.E.cMin, pre.E.cMax);
      const minRight = (cont) => {
        let v = -Infinity;
        for (const [r, [lo]] of cont) { const m = merged.get(r); if (m) v = Math.max(v, m[1] - lo + gapC); }
        return v;
      };
      const maxLeft = (cont) => {
        let v = Infinity;
        for (const [r, [, hi]] of cont) { const m = merged.get(r); if (m) v = Math.min(v, m[0] - hi - gapC); }
        return v;
      };
      const put = (s, pos) => {
        s.pos = pos;
        for (const [r, [lo, hi]] of s.cont) addCont(merged, r, lo + pos, hi + pos);
      };
      let anchor = subs.findIndex((s) => s.J.down && Math.abs(s.desired ?? 1) < 1e-6);
      if (anchor < 0) anchor = subs.findIndex((s) => s.J.down);
      if (anchor >= 0) put(subs[anchor], subs[anchor].desired ?? 0);
      let last = anchor >= 0 ? subs[anchor].pos : 0;
      for (let k = anchor + 1; k < subs.length; k++) {
        const s = subs[k];
        let pos = Math.max(s.desired ?? -Infinity, minRight(s.cont));
        if (!Number.isFinite(pos)) pos = s.desired ?? last;
        put(s, pos); last = pos;
      }
      last = anchor >= 0 ? subs[anchor].pos : 0;
      for (let k = anchor - 1; k >= 0; k--) {
        const s = subs[k];
        let pos = Math.min(s.desired ?? Infinity, maxLeft(s.cont));
        if (!Number.isFinite(pos)) pos = s.desired ?? last;
        put(s, pos); last = pos;
      }

      // centre buses over their branches; centre plain fan-outs
      let shift = 0;
      if (isBus && subs.length) {
        const att = subs.map((s) => s.pos + portOff(geomAt(s.V, s.J.rot, null), s.J.q).c);
        const lo = Math.min(...att), hi = Math.max(...att);
        shift = (lo + hi) / 2;
        const L = Math.max(hi - lo + 0.8, 1.0);
        lens.set(U, L / doc.symScale);
      } else if (isBus) {
        lens.set(U, Math.max(byId.get(U).len || SYMBOLS[byId.get(U).sym].defLen, 1.0));
      } else if (anchor < 0 && subs.length > 1 && subs.every((s) => Math.abs((s.desired ?? 0) - (subs[0].desired ?? 0)) < 1e-6)) {
        shift = (subs[0].pos + subs[subs.length - 1].pos) / 2 - (subs[0].desired ?? 0);
      }
      const own = pre || ownBlock(U);
      const cont = new Map();
      addCont(cont, I.rank, own.E.cMin, own.E.cMax);
      for (const s of subs) {
        s.pos -= shift;
        kidPos.set(s.V, s.pos);
        for (const [r, [lo, hi]] of s.cont) addCont(cont, r, lo + s.pos, hi + s.pos);
      }
      return cont;
    }

    // components side by side
    const compPos = new Map();
    const forest = new Map();
    const conts = roots.map((r) => ({ r, cont: layout(r, null) }));
    // normalise ranks so every component starts at rank 0
    const rankShift = new Map();
    for (const { r, cont } of conts) {
      const minR = Math.min(...cont.keys());
      rankShift.set(r, -minR);
      const c2 = new Map();
      for (const [k, v] of cont) c2.set(k - minR, v);
      forest.set(r, c2);
    }
    const merged = new Map();
    let lastPos = 0;
    conts.forEach(({ r }, i) => {
      const cont = forest.get(r);
      let pos = 0;
      if (i) {
        pos = -Infinity;
        for (const [k, [lo]] of cont) { const m = merged.get(k); if (m) pos = Math.max(pos, m[1] - lo + gapC * 2); }
        if (!Number.isFinite(pos)) pos = lastPos;
      }
      compPos.set(r, pos);
      lastPos = pos;
      for (const [k, [lo, hi]] of cont) addCont(merged, k, lo + pos, hi + pos);
    });

    // absolute c and rank for every node
    const C = new Map(), RK = new Map();
    const walk = (U, c, rs) => {
      C.set(U, c);
      RK.set(U, info.get(U).rank + rs);
      for (const V of info.get(U).kids) walk(V, c + kidPos.get(V), rs);
    };
    for (const r of roots) walk(r, compPos.get(r), rankShift.get(r));

    // rank positions along the flow
    const ranks = [...new Set(RK.values())].sort((a, b) => a - b);
    const up = new Map(), down = new Map(), need = new Map();
    for (const [id, r] of RK) {
      const { E } = blocks.get(id);
      up.set(r, Math.max(up.get(r) ?? 0, -E.mMin));
      down.set(r, Math.max(down.get(r) ?? 0, E.mMax));
      const I = info.get(id);
      if (I.parent && I.edge) {
        const ls = edgeLabelSize(I.edge);
        if (ls) {
          const gapRank = Math.min(r, RK.get(I.parent));
          need.set(gapRank, Math.max(need.get(gapRank) ?? 0, (doc.flow === "down" ? ls.H : ls.W) + 0.2));
        }
      }
    }
    const M = new Map();
    let m = 0;
    ranks.forEach((r, i) => {
      if (i) {
        const pr = ranks[i - 1];
        m += down.get(pr) + Math.max(gapM, need.get(pr) ?? 0) + up.get(r);
      }
      M.set(r, m);
    });

    // fold long flows into bands (rows for flow-right, columns for flow-down)
    const bandM = new Map(), bandC = new Map();   // rank -> shifts
    const lo = (r) => M.get(r) - up.get(r), hi = (r) => M.get(r) + down.get(r);
    let folded = false;
    if (ranks.length > 2 && hi(ranks[ranks.length - 1]) - lo(ranks[0]) > foldLen) {
      // connections crossing each rank boundary (fewer = better place to fold)
      const crossing = new Map();
      for (const e of doc.edges) {
        const ra = RK.get(e.from.n) ?? RK.get(satOf.get(e.from.n)?.o), rb = RK.get(e.to.n) ?? RK.get(satOf.get(e.to.n)?.o);
        if (ra == null || rb == null) continue;
        for (const r of ranks) if (r >= Math.min(ra, rb) && r < Math.max(ra, rb)) crossing.set(r, (crossing.get(r) || 0) + 1);
      }
      const bands = [];
      let i = 0;
      while (i < ranks.length) {
        const start = lo(ranks[i]);
        let j = i;
        while (j + 1 < ranks.length && hi(ranks[j + 1]) - start <= foldLen) j++;
        if (j + 1 < ranks.length && j > i) {
          // best cut in the back half of the band: fewest crossings, then latest
          let bestJ = j, bestX = Infinity;
          for (let k = j; k >= i + Math.max(1, Math.floor((j - i) / 2)); k--) {
            const x = crossing.get(ranks[k]) || 0;
            if (x < bestX) { bestX = x; bestJ = k; }
          }
          j = bestJ;
        }
        bands.push(ranks.slice(i, j + 1));
        i = j + 1;
      }
      if (bands.length > 1) {
        folded = true;
        let cOff = 0, prevMax = null;
        const m0 = lo(ranks[0]);
        for (const band of bands) {
          const set = new Set(band);
          let cMin = Infinity, cMax = -Infinity;
          for (const [id, c] of C) {
            if (!set.has(RK.get(id))) continue;
            const { E } = blocks.get(id);
            cMin = Math.min(cMin, c + E.cMin); cMax = Math.max(cMax, c + E.cMax);
          }
          if (prevMax != null) cOff = prevMax - cMin + gapC * 3;
          const mShift = m0 - lo(band[0]);
          for (const r of band) { bandM.set(r, mShift); bandC.set(r, cOff); }
          prevMax = cMax + cOff;
        }
      }
    }

    // world positions (relative) and bounding box
    const out = new Map();
    let bbox = null;
    const boxes = [];
    const bandOf = new Map();
    let bi = 0, lastShift = null;
    for (const r of ranks) { const k = bandC.get(r) || 0; if (lastShift !== null && k !== lastShift) bi++; lastShift = k; bandOf.set(r, bi); }
    const place = (id, mm, cc, rot, len, r) => {
      const x = mm * F.m[0] + cc * F.c[0], y = mm * F.m[1] + cc * F.c[1];
      out.set(id, { x, y, rot, len, rank: r, band: bandOf.get(r) });
    };
    for (const [id, c0] of C) {
      const r = RK.get(id), I = info.get(id);
      const mm = M.get(r) + (bandM.get(r) || 0), c = c0 + (bandC.get(r) || 0);
      place(id, mm, c, I.rot, lens.get(id), r);
      const { E } = blocks.get(id);
      const pts = [[mm + E.mMin, c + E.cMin], [mm + E.mMax, c + E.cMax]]
        .map(([a, b]) => [a * F.m[0] + b * F.c[0], a * F.m[1] + b * F.c[1]]);
      const box = R.of(pts[0][0], pts[0][1], pts[1][0], pts[1][1]);
      boxes.push(box);
      bbox = R.union(bbox, box);
      for (const sid of satsOn.get(id) || []) {
        const s = satPos.get(sid);
        if (s) place(sid, mm + s.m, c + s.c, info.get(sid).rot, undefined, r);
      }
    }
    return { out, boxes, folded, bbox: bbox || [0, 0, 0, 0] };
  }

  // ---------------------------------------------------------- fit to sheet
  // The free area is the sheet minus the title-block/notes corner (an L shape).
  const area = drawingArea(doc, notesLayout(doc).top);
  const O = area.outer, RS = R.inflate(area.reserved, 0.15);

  /** Find a grid-snapped translation that puts the layout on the sheet clear of the corner. */
  const placeable = (L) => {
    const bb = L.bbox;
    if (R.w(bb) > R.w(O) + 1e-6 || R.h(bb) > R.h(O) + 1e-6) return null;
    const txMin = O[0] - bb[0], txMax = O[2] - bb[2], tyMin = O[1] - bb[1], tyMax = O[3] - bb[3];
    const clear = (tx, ty) => !L.boxes.some((b) => R.overlaps(R.shift(b, tx, ty), RS));
    const tx0 = snap((txMin + txMax) / 2, GRID), ty0 = snap((tyMin + tyMax) / 2, GRID);
    const tries = [[tx0, ty0]];
    // slide left, up, or both until the corner is clear
    const hits = (tx, ty) => L.boxes.map((b) => R.shift(b, tx, ty)).filter((b) => R.overlaps(b, RS));
    let h = hits(tx0, ty0);
    if (h.length) {
      const left = Math.max(txMin, tx0 - (Math.max(...h.map((b) => b[2])) - RS[0]));
      const up = Math.min(tyMax, ty0 + (RS[3] - Math.min(...h.map((b) => b[1]))));
      tries.push([snap(left - GRID / 2, GRID), ty0], [tx0, snap(up + GRID / 2, GRID)], [snap(left - GRID / 2, GRID), snap(up + GRID / 2, GRID)]);
      tries.push([txMin, tyMax], [txMin, ty0]);
    }
    for (const [tx, ty] of tries) {
      const x = clamp(tx, txMin, txMax), y = clamp(ty, tyMin, tyMax);
      if (clear(x, y)) return { tx: x, ty: y };
    }
    return null;
  };
  const mLen = doc.flow === "down" ? R.h(O) : R.w(O);
  let fold = Infinity;
  const okAt = (s, kc, km) => { doc.symScale = s; const L = compute(kc, km, fold); const t = placeable(L); return t ? { L, t } : null; };
  /** Largest x in [lo, hi] with f(x) true, assuming f(lo) is true. */
  const bsearch = (lo, hi, f) => {
    if (f(hi)) return hi;
    for (let i = 0; i < 6; i++) { const mid = (lo + hi) / 2; if (f(mid)) lo = mid; else hi = mid; }
    return lo;
  };

  const warnings = [];
  const scale0 = doc.symScale;
  let s = scale0, kc = 1, km = 1, kHi = 1;
  if (!okAt(s, 0.5, 0.5)) {
    // too long for the sheet: fold the flow into bands before shrinking symbols
    for (const f of [mLen, mLen * 0.92, mLen * 0.8]) {
      fold = f;
      if (okAt(s, 0.5, 0.5)) break;
      fold = Infinity;
    }
  }
  if (okAt(s, 1, 1)) {
    kHi = 1.9; // room to spare: open the gaps up so the drawing fills the sheet
  } else if (!okAt(s, 0.5, 0.5)) {
    if (fold === Infinity) fold = mLen;
    if (!okAt(0.5, 0.4, 0.4)) {
      s = 0.5;
      warnings.push("The drawing is too large for one sheet even at minimum spacing; consider splitting it with off-sheet connectors.");
    } else {
      s = Math.floor(bsearch(0.5, scale0, (x) => !!okAt(x, 0.5, 0.5) || !!okAt(x, 0.4, 0.4)) * 40) / 40;
    }
  }
  let fin = null;
  if (okAt(s, 0.4, 0.4) || kHi > 1) {
    const lo = kHi > 1 ? 1 : 0.4;
    const ku = bsearch(lo, kHi, (k) => !!okAt(s, k, k));
    kc = bsearch(ku, kHi, (k) => !!okAt(s, k, ku));
    km = bsearch(ku, kHi, (k) => !!okAt(s, kc, k));
    // keep the two directions from diverging too much
    kc = Math.min(kc, km * 1.5); km = Math.min(km, kc * 1.5);
    fin = okAt(s, kc, km);
  }
  doc.symScale = s;
  if (s !== scale0) warnings.push(`Symbols scaled to ${Math.round(s * 100)}% to fit the sheet.`);
  if (!fin) {
    const L = compute(0.4, 0.4);
    fin = { L, t: { tx: snap(O[0] - L.bbox[0], GRID), ty: snap(O[3] - L.bbox[3], GRID) } };
  }
  const { tx, ty } = fin.t;
  for (const [id, p] of fin.L.out) {
    const n = byId.get(id);
    n.x = round4(p.x + tx); n.y = round4(p.y + ty);
    n.rot = p.rot; n.flip = false;
    if (p.len) n.len = round4(p.len);
  }
  // buses span the branches laid out next to them (same band, adjacent rank)
  const meta = fin.L.out;
  fitBuses(doc, null, (bus, other) => {
    const a = meta.get(bus.id), b = meta.get(other.id);
    return a && b && a.band === b.band && Math.abs(a.rank - b.rank) <= 1;
  });
  for (const e of doc.edges) delete e.pts;
  let routeInfo = null;
  if (route) routeInfo = routeEdges(doc);
  if (routeInfo && routeInfo.failed) warnings.push(`${routeInfo.failed} connection(s) could not be routed cleanly.`);
  return { warnings, scale: doc.symScale };
}

/**
 * Stretch (or shrink) buses / headers so they span every connection made to
 * them, plus a margin at each end. Buses with autoLen === false are left alone.
 */
function fitBuses(doc, ids = null, accept = null) {
  const byId = new Map(doc.nodes.map((n) => [n.id, n]));
  for (const n of doc.nodes) {
    const sym = SYMBOLS[n.sym];
    if (!sym.bus || n.autoLen === false || (ids && !ids.has(n.id))) continue;
    const g = nodeGeom(doc, n);
    const horiz = R.w(g.body) >= R.h(g.body);
    const att = [];
    for (const e of doc.edges) {
      let other = null;
      if (e.from.n === n.id) other = e.to;
      else if (e.to.n === n.id) other = e.from;
      if (!other || other.n === n.id) continue;
      const on = byId.get(other.n);
      if (!on || SYMBOLS[on.sym].bus || (accept && !accept(n, on))) continue;
      const p = portOf(nodeGeom(doc, on), other.p);
      att.push(horiz ? p.x : p.y);
    }
    if (!att.length) continue;
    const pad = 0.4;
    let lo = Math.min(...att) - pad, hi = Math.max(...att) + pad;
    const minL = 1.0;
    if (hi - lo < minL) { const c = (lo + hi) / 2; lo = c - minL / 2; hi = c + minL / 2; }
    const c = snap((lo + hi) / 2, GRID / 2);
    const L = Math.max(hi - c, c - lo) * 2;
    if (horiz) n.x = round4(c); else n.y = round4(c);
    n.len = round4(L / doc.symScale);
  }
}

/* =========================================================================
 * Interactive editor: canvas rendering, selection, dragging (with snapping,
 * alignment guides and overlap avoidance), connecting ports, placing and
 * inserting symbols, undo/redo, keyboard shortcuts.
 * ========================================================================= */

const ED = {
  store: { docs: [], cur: 0 },
  doc: null,
  sel: new Set(),
  view: { x: -0.3, y: -0.3, w: 17.6, h: 11.6 },
  undo: [], redo: [], lastSnap: null,
  mode: null,          // current pointer gesture
  place: null,         // palette entry being placed
  hover: null,         // hovered node id
  hoverPort: null,     // "nodeId|portId"
  geoms: new Map(), paths: new Map(),
  opts: { keep: false, grid: true, avoid: true },
  guides: [], insertEdge: null, spaceDown: false, clipboard: null,
};
const STORE_KEY = "diagramDrafter.v1";

// ------------------------------------------------------------- utilities
const svgEl = () => $("#canvas");
const toSvgY = (y) => SHEET_H - y;
const isNode = (id) => ED.doc.nodes.some((n) => n.id === id);
const nodeById = (id) => ED.doc.nodes.find((n) => n.id === id);
const edgeById = (id) => ED.doc.edges.find((e) => e.id === id);
const selNodes = () => ED.doc.nodes.filter((n) => ED.sel.has(n.id));
const selEdges = () => ED.doc.edges.filter((e) => ED.sel.has(e.id));

/** Pointer event -> sheet coordinates (inches, y up). */
function eventPt(ev) {
  const svg = svgEl();
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, SHEET_H - p.y];
}

function pxPerInch() {
  const r = svgEl().getBoundingClientRect();
  return Math.min(r.width / ED.view.w, r.height / ED.view.h) || 50;
}

function setStatus(t) { $("#status").textContent = t; }

// ---------------------------------------------------------------- storage
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(ED.store)); } catch (_) { /* ignore */ }
}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.docs) && s.docs.length) {
      ED.store = { docs: s.docs.map(normalizeDoc), cur: clamp(s.cur | 0, 0, s.docs.length - 1) };
    }
  } catch (_) { /* ignore */ }
}
const cleanDoc = (doc) => JSON.stringify(doc, (k, v) => (k === "routeFailed" || k.startsWith("_") ? undefined : v));

// -------------------------------------------------------------- undo/redo
function commit(what) {
  const snap = cleanDoc(ED.doc);
  if (snap === ED.lastSnap) return;
  if (ED.lastSnap) ED.undo.push(ED.lastSnap);
  if (ED.undo.length > 150) ED.undo.shift();
  ED.redo = [];
  ED.lastSnap = snap;
  ED.store.docs[ED.store.cur] = ED.doc;
  saveStore();
  if (what) setStatus(what);
  updateUndoButtons();
}
function restore(snap) {
  ED.doc = normalizeDoc(JSON.parse(snap));
  ED.store.docs[ED.store.cur] = ED.doc;
  ED.lastSnap = snap;
  for (const id of [...ED.sel]) if (!isNode(id) && !edgeById(id)) ED.sel.delete(id);
  saveStore();
  render(); renderProps(); renderDocList(); updateUndoButtons();
}
function doUndo() { if (ED.undo.length) { ED.redo.push(ED.lastSnap); restore(ED.undo.pop()); setStatus("Undone"); } }
function doRedo() { if (ED.redo.length) { ED.undo.push(ED.lastSnap); restore(ED.redo.pop()); setStatus("Redone"); } }
function updateUndoButtons() { $("#btnUndo").disabled = !ED.undo.length; $("#btnRedo").disabled = !ED.redo.length; }

function switchDoc(i) {
  ED.store.cur = clamp(i, 0, ED.store.docs.length - 1);
  ED.doc = ED.store.docs[ED.store.cur];
  ED.sel.clear(); ED.undo = []; ED.redo = []; ED.lastSnap = cleanDoc(ED.doc);
  ED.place = null;
  for (const e of ED.doc.edges) if (!e.pts) { routeEdges(ED.doc); break; }
  saveStore();
  renderPalette(); renderDocList(); render(); renderProps(); zoomFit(); updateUndoButtons();
}

// --------------------------------------------------------------- rendering
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  const doc = ED.doc;
  const { sheet, geoms, paths } = renderDoc(doc);
  ED.geoms = geoms; ED.paths = paths;
  $("#content").innerHTML = sheetToSvgContent(sheet, { minStroke: 0.9 / pxPerInch() });
  $("#canvas").setAttribute("font-family", sheet.font.css.replace(/"/g, "'"));
  renderOverlay();
}

const d4 = (v) => +v.toFixed(4);
const rectSvg = (r, cls, extra = "") =>
  `<rect class="${cls}" x="${d4(r[0])}" y="${d4(toSvgY(r[3]))}" width="${d4(R.w(r))}" height="${d4(R.h(r))}" ${extra}/>`;
const pathSvg = (pts) => "M" + pts.map((p) => `${d4(p[0])} ${d4(toSvgY(p[1]))}`).join("L");

function portMarkers(id, g) {
  const out = [];
  for (const p of g.ports) {
    let x = p.x, y = p.y;
    if (p.bus) { x += p.dir[0] * 0.09; y += p.dir[1] * 0.09; }
    const key = `${id}|${p.id}`;
    out.push(`<circle class="port${ED.hoverPort === key ? " hot" : ""}" data-port="${key}" cx="${d4(x)}" cy="${d4(toSvgY(y))}" r="${d4(Math.max(0.03, 5 / pxPerInch()))}" stroke-width="${d4(1.2 / pxPerInch())}"/>`);
  }
  return out.join("");
}

function renderOverlay() {
  const doc = ED.doc, ppi = pxPerInch();
  const parts = [];
  const sw = (px) => d4(px / ppi);
  // hit areas: edges first, nodes on top
  for (const e of doc.edges) {
    const pts = ED.paths.get(e.id);
    if (pts) parts.push(`<path class="hit-edge" data-edge="${e.id}" d="${pathSvg(pts)}" stroke-width="${sw(10)}"/>`);
  }
  const moving = ED.mode && ED.mode.type === "move" && ED.mode.moved;
  const showKeep = ED.opts.keep || moving;
  const overlaps = showKeep ? overlapSet(doc) : new Set();
  for (const n of doc.nodes) {
    const g = ED.geoms.get(n.id);
    if (!g) continue;
    if (showKeep) parts.push(rectSvg(g.keep, "keep" + (overlaps.has(n.id) ? " bad" : ""), `stroke-width="${sw(1)}"`));
    parts.push(rectSvg(R.inflate(g.outer, 0.03), "hit", `data-node="${n.id}"`));
  }
  // selection
  for (const id of ED.sel) {
    const g = ED.geoms.get(id);
    if (g) parts.push(rectSvg(R.inflate(g.outer, 0.05), "sel-box", `stroke-width="${sw(1.3)}" stroke-dasharray="${sw(5)} ${sw(3)}"`));
    const pts = ED.paths.get(id);
    if (pts) parts.push(`<path class="sel-edge" d="${pathSvg(pts)}" stroke-width="${sw(6)}"/>`);
  }
  if (ED.insertEdge) {
    const pts = ED.paths.get(ED.insertEdge);
    if (pts) parts.push(`<path class="insert-hl" d="${pathSvg(pts)}" stroke-width="${sw(7)}"/>`);
  }
  // ports: hovered / selected nodes, or all while connecting
  const connecting = ED.mode && ED.mode.type === "connect";
  for (const n of doc.nodes) {
    if (connecting || n.id === ED.hover || (ED.sel.has(n.id) && ED.sel.size === 1)) {
      const g = ED.geoms.get(n.id);
      if (g) parts.push(portMarkers(n.id, g));
    }
  }
  // gesture feedback
  for (const gd of ED.guides) {
    parts.push(`<line class="guide" x1="${d4(gd[0])}" y1="${d4(toSvgY(gd[1]))}" x2="${d4(gd[2])}" y2="${d4(toSvgY(gd[3]))}" stroke-width="${sw(1)}"/>`);
  }
  const m = ED.mode;
  if (m && m.type === "band" && m.cur) {
    parts.push(rectSvg(R.of(m.start[0], m.start[1], m.cur[0], m.cur[1]), "band", `stroke-width="${sw(1)}"`));
  }
  if (m && m.type === "connect" && m.cur) {
    parts.push(`<path class="preview-line" d="${pathSvg([m.start, m.cur])}" stroke-width="${sw(1.5)}" stroke-dasharray="${sw(6)} ${sw(4)}"/>`);
  }
  if (ED.place && ED.place.ghostAt) parts.push(ghostSvg(ED.place, ED.place.ghostAt));
  $("#overlay").innerHTML = parts.join("");
}

function ghostSvg(entry, at) {
  const n = makeNode(entry, at[0], at[1], true);
  const sh = new Sheet(docFont(ED.doc));
  const g = computeGeom(ED.doc, n, new Set());
  drawNode(sh, ED.doc, n, g);
  return `<g class="ghost">${sheetToSvgContent(sh, { minStroke: 1 / pxPerInch() })}</g>`;
}

function renderGrid() {
  const show = ED.opts.grid;
  $("#gridLayer").innerHTML = show
    ? `<defs><pattern id="gridPat" width="0.25" height="0.25" patternUnits="userSpaceOnUse" x="0" y="${SHEET_H % 0.25}">` +
      `<circle cx="0" cy="0" r="0.008" fill="#b8c0ca"/></pattern></defs>` +
      `<rect x="${IX0}" y="${toSvgY(IY1)}" width="${IX1 - IX0}" height="${IY1 - IY0}" fill="url(#gridPat)"/>`
    : "";
}

// ---------------------------------------------------------------- view
function applyView() {
  const v = ED.view;
  svgEl().setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  const r = svgEl().getBoundingClientRect();
  const pct = Math.round((Math.min(r.width / v.w, r.height / v.h) / 96) * 100);
  $("#zoomLabel").textContent = `${pct}%`;
}
function zoomFit() {
  const r = svgEl().getBoundingClientRect();
  const m = 0.3, W = SHEET_W + 2 * m, H = SHEET_H + 2 * m;
  const k = Math.max(W / r.width, H / r.height);
  const w = r.width * k, h = r.height * k;
  ED.view = { x: SHEET_W / 2 - w / 2, y: SHEET_H / 2 - h / 2, w, h };
  applyView(); render();
}
function zoomAt(factor, cx, cy) {
  const v = ED.view;
  const nw = clamp(v.w / factor, 1.5, 60), k = nw / v.w;
  ED.view = { x: cx - (cx - v.x) * k, y: cy - (cy - v.y) * k, w: nw, h: v.h * k };
  applyView(); scheduleRender();
}

// ------------------------------------------------------------ creation
function makeNode(entry, x, y, preview = false) {
  const sym = SYMBOLS[entry.sym];
  const n = {
    id: preview ? "ghost" : uid("n"), sym: entry.sym, x: snap(x, GRID), y: snap(y, GRID),
    rot: rotBetween(LIB_FLOW[sym.lib], flowVec(ED.doc)), flip: false,
    tag: "", text: "", props: Object.assign(defaultProps(entry.sym), entry.props || {}), labelPos: "auto",
  };
  if (sym.bus) n.len = sym.defLen;
  const prefix = entry.tag || sym.tag;
  if (prefix && !preview) n.tag = nextTag(ED.doc, prefix);
  return n;
}

/** Inlet / outlet ports of a symbol (canonical), for inserting into lines. */
function throughPorts(n, doc = ED.doc) {
  const sym = SYMBOLS[n.sym];
  const ports = sym.ports(n, doc);
  const f = LIB_FLOW[sym.lib];
  const inP = ports.find((p) => DIRS[p.dir][0] * f[0] + DIRS[p.dir][1] * f[1] < -0.5);
  const outP = ports.find((p) => DIRS[p.dir][0] * f[0] + DIRS[p.dir][1] * f[1] > 0.5);
  return inP && outP ? { inP, outP } : null;
}

function edgeStyleFor(a, b) {
  const sa = SYMBOLS[a.sym], sb = SYMBOLS[b.sym];
  if (sa.instrument || sb.instrument) return "inst-conn";
  if (sa.id === "ol-ground" || sb.id === "ol-ground") return "ground";
  return defaultEdgeStyle(ED.doc);
}

function addEdge(from, fp, to, tp, extra = {}) {
  const e = { id: uid("e"), from: { n: from.id, p: fp }, to: { n: to.id, p: tp },
              style: edgeStyleFor(from, to), label: "", arrow: "none", ...extra };
  ED.doc.edges.push(e);
  return e;
}

/** Split edge e by inserting node n (rotated to the line), returns true on success. */
function insertIntoEdge(n, e, at) {
  const tp = throughPorts(n);
  const pts = ED.paths.get(e.id);
  if (!tp || !pts) return false;
  // segment nearest to `at`
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = segDist(at, pts[i], pts[i + 1]);
    if (!best || d.d < best.d) best = { ...d, i };
  }
  const [a, b] = [pts[best.i], pts[best.i + 1]];
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  const u = [Math.round((b[0] - a[0]) / L), Math.round((b[1] - a[1]) / L)];
  n.rot = rotBetween(LIB_FLOW[SYMBOLS[n.sym].lib], u);
  n.flip = false;
  // put the node's inlet/outlet midpoint on the line
  const g = computeGeom(ED.doc, { ...n, x: 0, y: 0 }, new Set());
  const pi = g.ports.find((p) => p.id === tp.inP.id), po = g.ports.find((p) => p.id === tp.outP.id);
  const mx = (pi.x + po.x) / 2, my = (pi.y + po.y) / 2;
  const onLine = u[0] ? [best.px, a[1]] : [a[0], best.py];
  n.x = round4(snap(onLine[0] - mx, GRID / 2)); n.y = round4(snap(onLine[1] - my, GRID / 2));
  if (u[0]) n.y = round4(a[1] - my); else n.x = round4(a[0] - mx);
  const from = nodeById(e.from.n), to = nodeById(e.to.n);
  ED.doc.edges = ED.doc.edges.filter((x) => x !== e);
  const e1 = addEdge(from, e.from.p, n, tp.inP.id, { style: e.style, label: e.label, arrow: e.arrow === "end" ? "none" : e.arrow });
  const e2 = addEdge(n, tp.outP.id, to, e.to.p, { style: e.style, arrow: e.arrow });
  routeEdges(ED.doc, new Set([e1.id, e2.id]));
  return true;
}

function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1e-9;
  const t = clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2, 0, 1);
  const px = a[0] + dx * t, py = a[1] + dy * t;
  return { d: Math.hypot(p[0] - px, p[1] - py), px, py };
}

/** Edge whose path passes within `tol` of point p (not touching node `exclude`). */
function edgeNear(p, tol, exclude) {
  let best = null;
  for (const e of ED.doc.edges) {
    if (exclude && (e.from.n === exclude || e.to.n === exclude)) continue;
    const pts = ED.paths.get(e.id);
    if (!pts) continue;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = segDist(p, pts[i], pts[i + 1]).d;
      if (d < tol && (!best || d < best.d)) best = { e, d };
    }
  }
  return best && best.e;
}

/** Place a palette symbol at a point (inserting it into a line when dropped on one). */
function placeAt(entry, pt) {
  const n = makeNode(entry, pt[0], pt[1]);
  ED.doc.nodes.push(n);
  const g = computeGeom(ED.doc, n, new Set());
  // centre the symbol body on the pointer
  n.x = round4(snap(n.x - (R.cx(g.body) - n.x), GRID));
  n.y = round4(snap(n.y - (R.cy(g.body) - n.y), GRID));
  const e = throughPorts(n) ? edgeNear(pt, 0.12) : null;
  if (e) insertIntoEdge(n, e, pt);
  else if (ED.opts.avoid) avoidOverlaps([n.id]);
  ED.sel = new Set([n.id]);
  commit(e ? `Inserted ${SYMBOLS[n.sym].name} into the line` : `Placed ${SYMBOLS[n.sym].name}`);
  render(); renderProps();
}

/**
 * Palette click with one node selected: add the new symbol downstream of it,
 * connected. With one edge selected: insert it into the edge.
 */
function addConnected(entry) {
  const doc = ED.doc;
  const ids = [...ED.sel];
  if (ids.length === 1 && edgeById(ids[0])) {
    const e = edgeById(ids[0]);
    const pts = ED.paths.get(e.id);
    const seg = longestSegment(pts);
    const mid = [(seg.a[0] + seg.b[0]) / 2, (seg.a[1] + seg.b[1]) / 2];
    const n = makeNode(entry, mid[0], mid[1]);
    if (!throughPorts(n)) { setStatus("That symbol has no inlet/outlet pair to insert into a line."); return false; }
    doc.nodes.push(n);
    insertIntoEdge(n, e, mid);
    ED.sel = new Set([n.id]);
    commit(`Inserted ${SYMBOLS[n.sym].name}`);
    render(); renderProps();
    return true;
  }
  if (ids.length !== 1 || !isNode(ids[0])) return false;
  const U = nodeById(ids[0]);
  const gu = ED.geoms.get(U.id) || nodeGeom(doc, U);
  const F = flowVec(doc), C = crossVec(doc);
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const used = connectedPorts(doc, U.id);
  const n = makeNode(entry, 0, 0);
  const sym = SYMBOLS[n.sym];
  const nPorts = sym.ports(n, doc);
  const tp = throughPorts(n);
  const inP = tp ? tp.inP : nPorts[0];

  // U's outgoing port: a free port facing downstream (buses: load side), else any free port
  let up = gu.ports.find((p) => p.bus && dot(p.dir, F) > 0.5) ||
           gu.ports.find((p) => !used.has(p.id) && dot(p.dir, F) > 0.5) ||
           gu.ports.find((p) => !used.has(p.id) && Math.abs(dot(p.dir, F)) < 0.5) ||
           gu.ports.find((p) => !used.has(p.id));
  if (!up) { setStatus("No free connection point on the selected symbol."); return false; }

  // orient the new symbol so its inlet faces the selected one
  const want = [-up.dir[0], -up.dir[1]];
  n.rot = rotBetween(DIRS[inP.dir], want);
  const g0 = computeGeom(doc, { ...n, x: 0, y: 0 }, new Set([inP.id]));
  const pin = g0.ports.find((p) => p.id === inP.id);
  const sp = spacingOf(doc);
  const corners = (r) => [[r[0], r[1]], [r[2], r[1]], [r[0], r[3]], [r[2], r[3]]];
  const ext = (r, dir) => { const v = corners(r).map((p) => dot(p, dir)); return [Math.min(...v), Math.max(...v)]; };
  // along the connection: new keep-out starts one gap beyond the selected symbol's keep-out
  const reach = ext(gu.keep, up.dir)[1] - dot([up.x, up.y], up.dir);
  const back = dot([pin.x, pin.y], up.dir) - ext(g0.keep, up.dir)[0];
  const D = Math.max(0.5, reach + sp.gap + back);
  let ox, oy;
  if (up.bus) {
    // new branch on a bus: just past the existing branches (or centred if it is the first)
    const branches = doc.edges.filter((e) => (e.from.n === U.id && e.from.p === up.id) || (e.to.n === U.id && e.to.p === up.id))
      .map((e) => nodeById(e.from.n === U.id ? e.to.n : e.from.n)).filter(Boolean);
    const along = dot([U.x, U.y], up.dir) + D - dot([pin.x, pin.y], up.dir);
    let cross;
    if (branches.length) {
      const edge = Math.max(...branches.map((b) => ext(nodeGeom(doc, b).keep, C)[1]));
      cross = edge + sp.gap - ext(g0.keep, C)[0];
    } else {
      cross = dot([U.x, U.y], C) - dot([pin.x, pin.y], C);
    }
    ox = up.dir[0] * along + C[0] * cross; oy = up.dir[1] * along + C[1] * cross;
  } else {
    ox = up.x + up.dir[0] * D - pin.x; oy = up.y + up.dir[1] * D - pin.y;
  }
  n.x = round4(snap(ox, GRID)); n.y = round4(snap(oy, GRID));
  doc.nodes.push(n);
  const e = addEdge(U, up.id, n, inP.id);
  if (up.bus) fitBuses(doc, new Set([U.id]));
  if (ED.opts.avoid) avoidOverlaps([n.id], up.bus ? C : null);
  routeEdges(doc, incidentEdges(new Set([n.id, U.id])));
  ED.sel = new Set([n.id]);
  commit(`Added ${SYMBOLS[n.sym].name} after ${U.tag || SYMBOLS[U.sym].name}`);
  render(); renderProps();
  return !!e;
}

function incidentEdges(nodeIds) {
  return new Set(ED.doc.edges.filter((e) => nodeIds.has(e.from.n) || nodeIds.has(e.to.n)).map((e) => e.id));
}

// ----------------------------------------------------- overlap handling
function overlapSet(doc) {
  const gs = doc.nodes.map((n) => [n.id, ED.geoms.get(n.id) || nodeGeom(doc, n)]);
  const bad = new Set();
  for (let i = 0; i < gs.length; i++) {
    for (let j = i + 1; j < gs.length; j++) {
      if (R.overlaps(gs[i][1].keep, gs[j][1].keep)) { bad.add(gs[i][0]); bad.add(gs[j][0]); }
    }
  }
  return bad;
}

/**
 * Move the given nodes (as a group) to the nearest grid position where their
 * keep-out boxes clear everything else. `prefer`: direction to try first.
 */
function avoidOverlaps(ids, prefer = null) {
  const doc = ED.doc;
  const moving = doc.nodes.filter((n) => ids.includes(n.id));
  const others = doc.nodes.filter((n) => !ids.includes(n.id)).map((n) => nodeGeom(doc, n).keep);
  const area = [IX0 + 0.1, IY0 + 0.1, IX1 - 0.1, IY1 - 0.1];
  const reserved = [IX1 - TB_W, IY0, IX1, notesLayout(doc).top];
  const boxes = moving.map((n) => nodeGeom(doc, n).keep);
  const clear = (dx, dy) => boxes.every((b) => {
    const s = R.shift(b, dx, dy);
    return s[0] >= area[0] && s[2] <= area[2] && s[1] >= area[1] && s[3] <= area[3] &&
      !R.overlaps(s, reserved) && !others.some((o) => R.overlaps(s, o));
  });
  if (clear(0, 0)) return false;
  const step = 0.125, cands = [];
  for (let i = -24; i <= 24; i++) {
    for (let j = -24; j <= 24; j++) {
      let d = Math.hypot(i, j);
      if (prefer) d -= 0.6 * Math.max(0, i * prefer[0] + j * prefer[1]) / Math.max(1, Math.hypot(i, j)) * Math.min(4, Math.hypot(i, j));
      cands.push([d, i * step, j * step]);
    }
  }
  cands.sort((a, b) => a[0] - b[0]);
  for (const [, dx, dy] of cands) {
    if (clear(dx, dy)) {
      for (const n of moving) { n.x = round4(n.x + dx); n.y = round4(n.y + dy); }
      return true;
    }
  }
  return false;
}

// ------------------------------------------------------------- snapping
/** Snap a single dragged node so its connections run straight / it aligns with neighbours. */
function smartSnap(n, x, y) {
  const doc = ED.doc;
  const tol = 10 / pxPerInch();
  const g = computeGeom(doc, { ...n, x, y }, connectedPorts(doc, n.id));
  let bestX = null, bestY = null;
  const consider = (axis, delta, guide) => {
    if (Math.abs(delta) > tol) return;
    if (axis === "x" && (!bestX || Math.abs(delta) < Math.abs(bestX.delta))) bestX = { delta, guide };
    if (axis === "y" && (!bestY || Math.abs(delta) < Math.abs(bestY.delta))) bestY = { delta, guide };
  };
  // port-to-port straight connections
  for (const e of doc.edges) {
    let mine, other;
    if (e.from.n === n.id) { mine = e.from; other = e.to; } else if (e.to.n === n.id) { mine = e.to; other = e.from; } else continue;
    const on = nodeById(other.n);
    if (!on || on.id === n.id) continue;
    const mp = portOf(g, mine.p), op = portOf(ED.geoms.get(on.id) || nodeGeom(doc, on), other.p);
    if (op.bus || mp.bus) continue;
    if (mp.dir[0] === 0) consider("x", op.x - mp.x, [op.x, Math.min(op.y, mp.y) - 0.3, op.x, Math.max(op.y, mp.y) + 0.3]);
    else consider("y", op.y - mp.y, [Math.min(op.x, mp.x) - 0.3, op.y, Math.max(op.x, mp.x) + 0.3, op.y]);
  }
  // centre alignment with nearby symbols
  const cx = R.cx(g.body), cy = R.cy(g.body);
  for (const o of doc.nodes) {
    if (o.id === n.id) continue;
    const og = ED.geoms.get(o.id) || nodeGeom(doc, o);
    const ox = R.cx(og.body), oy = R.cy(og.body);
    if (Math.abs(oy - cy) < 4) consider("x", ox - cx, [ox, Math.min(oy, cy) - 0.4, ox, Math.max(oy, cy) + 0.4]);
    if (Math.abs(ox - cx) < 6) consider("y", oy - cy, [Math.min(ox, cx) - 0.4, oy, Math.max(ox, cx) + 0.4, oy]);
  }
  ED.guides = [];
  if (bestX) { x += bestX.delta; ED.guides.push(bestX.guide); }
  if (bestY) { y += bestY.delta; ED.guides.push(bestY.guide); }
  return [round4(x), round4(y)];
}

// -------------------------------------------------------- pointer input
function targetInfo(ev) {
  // with pointer capture, ev.target is the canvas itself: hit-test what is under the pointer
  const t = document.elementFromPoint(ev.clientX, ev.clientY) || ev.target;
  if (t.dataset?.port) { const [n, p] = t.dataset.port.split("|"); return { port: { n, p } }; }
  if (t.dataset?.node) return { node: t.dataset.node };
  if (t.dataset?.edge) return { edge: t.dataset.edge };
  return {};
}

/** Port of node `id` nearest to point p (buses: the side facing p). */
function nearestPort(id, p) {
  const g = ED.geoms.get(id);
  if (!g) return null;
  let best = null;
  for (const port of g.ports) {
    let d;
    if (port.bus) d = (p[0] - port.x) * port.dir[0] + (p[1] - port.y) * port.dir[1] > 0 ? 0 : 99;
    else d = Math.hypot(p[0] - port.x, p[1] - port.y);
    if (!best || d < best.d) best = { d, id: port.id };
  }
  return best && best.id;
}

function onPointerDown(ev) {
  const svg = svgEl();
  svg.setPointerCapture(ev.pointerId);
  const pt = eventPt(ev);
  if (ev.button === 1 || ev.button === 2 || ED.spaceDown) {
    ED.mode = { type: "pan", sx: ev.clientX, sy: ev.clientY, view: { ...ED.view } };
    svg.classList.add("panning");
    ev.preventDefault();
    return;
  }
  if (ev.button !== 0) return;
  if (ED.place) {
    placeAt(ED.place, pt);
    if (!ev.shiftKey) cancelPlace();
    return;
  }
  const t = targetInfo(ev);
  if (t.port) {
    const g = ED.geoms.get(t.port.n);
    const p = portOf(g, t.port.p);
    ED.mode = { type: "connect", from: t.port, start: [p.x, p.y], cur: pt };
    renderOverlay();
    return;
  }
  if (t.node) {
    if (ev.shiftKey) { ED.sel.has(t.node) ? ED.sel.delete(t.node) : ED.sel.add(t.node); }
    else if (!ED.sel.has(t.node)) ED.sel = new Set([t.node]);
    const orig = new Map(selNodes().map((n) => [n.id, [n.x, n.y]]));
    ED.mode = { type: "move", start: pt, orig, moved: false, lead: t.node };
    renderOverlay(); renderProps();
    return;
  }
  if (t.edge) {
    if (ev.shiftKey) { ED.sel.has(t.edge) ? ED.sel.delete(t.edge) : ED.sel.add(t.edge); }
    else ED.sel = new Set([t.edge]);
    ED.mode = null;
    renderOverlay(); renderProps();
    return;
  }
  ED.mode = { type: "band", start: pt, cur: null, add: ev.shiftKey };
}

function onPointerMove(ev) {
  const pt = eventPt(ev);
  const m = ED.mode;
  if (ED.place) {
    ED.place.ghostAt = pt;
    const probe = makeNode(ED.place, pt[0], pt[1], true);
    ED.insertEdge = throughPorts(probe) ? edgeNear(pt, 0.12)?.id || null : null;
    renderOverlay();
    return;
  }
  if (!m) {
    const t = targetInfo(ev);
    const hover = t.node || (t.port && t.port.n) || null;
    const hp = t.port ? `${t.port.n}|${t.port.p}` : null;
    if (hover !== ED.hover || hp !== ED.hoverPort) { ED.hover = hover; ED.hoverPort = hp; renderOverlay(); }
    return;
  }
  if (m.type === "pan") {
    const k = ED.view.w / svgEl().getBoundingClientRect().width;
    ED.view = { ...m.view, x: m.view.x - (ev.clientX - m.sx) * k, y: m.view.y - (ev.clientY - m.sy) * k };
    applyView();
    return;
  }
  if (m.type === "band") { m.cur = pt; renderOverlay(); return; }
  if (m.type === "connect") {
    m.cur = pt;
    const t = targetInfo(ev);
    ED.hoverPort = t.port ? `${t.port.n}|${t.port.p}` : null;
    ED.hover = t.node || (t.port && t.port.n) || null;
    renderOverlay();
    return;
  }
  if (m.type === "move") {
    let dx = pt[0] - m.start[0], dy = pt[1] - m.start[1];
    if (!m.moved && Math.hypot(dx, dy) < 3 / pxPerInch()) return;
    m.moved = true;
    dx = snap(dx, GRID); dy = snap(dy, GRID);
    const nodes = selNodes();
    if (nodes.length === 1) {
      const [ox, oy] = m.orig.get(nodes[0].id);
      const [x, y] = smartSnap(nodes[0], ox + dx, oy + dy);
      nodes[0].x = x; nodes[0].y = y;
    } else {
      ED.guides = [];
      for (const n of nodes) { const [ox, oy] = m.orig.get(n.id); n.x = round4(ox + dx); n.y = round4(oy + dy); }
    }
    // dropping a free inline symbol onto a line inserts it
    ED.insertEdge = null;
    if (nodes.length === 1 && !ED.doc.edges.some((e) => e.from.n === nodes[0].id || e.to.n === nodes[0].id) && throughPorts(nodes[0])) {
      const g = computeGeom(ED.doc, nodes[0], new Set());
      ED.insertEdge = edgeNear([R.cx(g.body), R.cy(g.body)], 0.15, nodes[0].id)?.id || null;
    }
    const ids = new Set(nodes.map((n) => n.id));
    routeEdges(ED.doc, incidentEdges(ids));
    scheduleRender();
  }
}

function onPointerUp(ev) {
  const m = ED.mode;
  ED.mode = null;
  svgEl().classList.remove("panning");
  if (!m) return;
  const pt = eventPt(ev);
  if (m.type === "band") {
    if (!m.cur || Math.hypot(pt[0] - m.start[0], pt[1] - m.start[1]) < 3 / pxPerInch()) {
      if (!m.add) ED.sel.clear();
    } else {
      const box = R.of(m.start[0], m.start[1], pt[0], pt[1]);
      if (!m.add) ED.sel.clear();
      for (const n of ED.doc.nodes) { const g = ED.geoms.get(n.id); if (g && R.overlaps(g.body, box)) ED.sel.add(n.id); }
      for (const e of ED.doc.edges) {
        const pts = ED.paths.get(e.id);
        if (pts && pts.every((p) => R.contains(box, p[0], p[1]))) ED.sel.add(e.id);
      }
    }
    renderOverlay(); renderProps();
    return;
  }
  if (m.type === "connect") {
    const t = targetInfo(ev);
    let to = t.port;
    if (!to && t.node && t.node !== m.from.n) to = { n: t.node, p: nearestPort(t.node, pt) };
    ED.hoverPort = null;
    if (to && to.n !== m.from.n && to.p) {
      const a = nodeById(m.from.n), b = nodeById(to.n);
      const dup = ED.doc.edges.some((e) => (e.from.n === a.id && e.from.p === m.from.p && e.to.n === b.id && e.to.p === to.p) ||
                                         (e.to.n === a.id && e.to.p === m.from.p && e.from.n === b.id && e.from.p === to.p));
      if (!dup) {
        const e = addEdge(a, m.from.p, b, to.p);
        fitBuses(ED.doc, new Set([a.id, b.id]));
        routeEdges(ED.doc, incidentEdges(new Set([a.id, b.id])));
        ED.sel = new Set([e.id]);
        commit("Connected");
      }
    }
    render(); renderProps();
    return;
  }
  if (m.type === "move") {
    ED.guides = [];
    if (m.moved) {
      const nodes = selNodes();
      const ids = nodes.map((n) => n.id);
      let msg = "Moved";
      if (ED.insertEdge && nodes.length === 1) {
        const e = edgeById(ED.insertEdge);
        const g = computeGeom(ED.doc, nodes[0], new Set());
        if (e && insertIntoEdge(nodes[0], e, [R.cx(g.body), R.cy(g.body)])) msg = "Inserted into the line";
      } else if (ED.opts.avoid && avoidOverlaps(ids)) msg = "Moved (nudged clear of neighbours)";
      ED.insertEdge = null;
      const near = new Set(ids);
      for (const e of ED.doc.edges) {
        if (near.has(e.from.n)) near.add(e.to.n);
        if (near.has(e.to.n)) near.add(e.from.n);
      }
      fitBuses(ED.doc, near);
      routeEdges(ED.doc, incidentEdges(near));
      commit(msg);
    }
    render(); renderProps();
  }
}

function onWheel(ev) {
  ev.preventDefault();
  const svg = svgEl();
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  if (ev.ctrlKey || ev.metaKey) {
    zoomAt(Math.exp(-ev.deltaY * 0.0025), p.x, p.y);
  } else {
    const k = ED.view.w / svg.getBoundingClientRect().width;
    ED.view.x += ev.deltaX * k; ED.view.y += ev.deltaY * k;
    applyView();
  }
}

function cancelPlace() {
  ED.place = null; ED.insertEdge = null;
  svgEl().classList.remove("placing");
  $$(".pal-item.active").forEach((x) => x.classList.remove("active"));
  setStatus("Ready");
  renderOverlay();
}

// ------------------------------------------------------------- commands
function deleteSelection() {
  const doc = ED.doc;
  const nodes = new Set(selNodes().map((n) => n.id));
  const edges = new Set(selEdges().map((e) => e.id));
  if (!nodes.size && !edges.size) return;
  // heal lines through deleted inline devices (one connection in, one out)
  const heal = [];
  for (const id of nodes) {
    const n = nodeById(id);
    const tp = throughPorts(n);
    if (!tp) continue;
    const inE = doc.edges.filter((e) => (e.to.n === id && e.to.p === tp.inP.id) || (e.from.n === id && e.from.p === tp.inP.id));
    const outE = doc.edges.filter((e) => (e.from.n === id && e.from.p === tp.outP.id) || (e.to.n === id && e.to.p === tp.outP.id));
    const all = doc.edges.filter((e) => e.from.n === id || e.to.n === id);
    if (inE.length === 1 && outE.length === 1 && all.length === 2) {
      const a = inE[0].from.n === id ? inE[0].to : inE[0].from;
      const b = outE[0].from.n === id ? outE[0].to : outE[0].from;
      if (!nodes.has(a.n) && !nodes.has(b.n)) heal.push({ a, b, style: inE[0].style, label: inE[0].label || outE[0].label, arrow: outE[0].arrow });
    }
  }
  doc.edges = doc.edges.filter((e) => !edges.has(e.id) && !nodes.has(e.from.n) && !nodes.has(e.to.n));
  doc.nodes = doc.nodes.filter((n) => !nodes.has(n.id));
  const ids = new Set();
  for (const h of heal) {
    const e = { id: uid("e"), from: h.a, to: h.b, style: h.style, label: h.label, arrow: h.arrow };
    doc.edges.push(e); ids.add(e.id);
  }
  if (ids.size) routeEdges(doc, ids);
  ED.sel.clear();
  commit(`Deleted ${nodes.size + edges.size} item(s)` + (heal.length ? "; line rejoined" : ""));
  render(); renderProps();
}

function copySelection() {
  const nodes = selNodes();
  if (!nodes.length) return false;
  const ids = new Set(nodes.map((n) => n.id));
  ED.clipboard = {
    nodes: clone(nodes),
    edges: clone(ED.doc.edges.filter((e) => ids.has(e.from.n) && ids.has(e.to.n))),
  };
  setStatus(`Copied ${nodes.length} symbol(s)`);
  return true;
}

function paste(offset = [0.5, -0.5]) {
  const cb = ED.clipboard;
  if (!cb) return;
  const map = new Map();
  const nodes = cb.nodes.map((n) => {
    const id = uid("n");
    map.set(n.id, id);
    const sym = SYMBOLS[n.sym];
    const tag = n.tag && (sym.tag || /-\d+$/.test(n.tag)) ? nextTag(ED.doc, n.tag.replace(/-\d+$/, "")) : n.tag;
    return { ...clone(n), id, x: round4(n.x + offset[0]), y: round4(n.y + offset[1]), tag };
  });
  for (const n of nodes) ED.doc.nodes.push(n);
  const edges = cb.edges.map((e) => ({ ...clone(e), id: uid("e"), from: { n: map.get(e.from.n), p: e.from.p }, to: { n: map.get(e.to.n), p: e.to.p } }));
  for (const e of edges) { delete e.pts; ED.doc.edges.push(e); }
  if (ED.opts.avoid) avoidOverlaps(nodes.map((n) => n.id));
  routeEdges(ED.doc, new Set(edges.map((e) => e.id)));
  ED.sel = new Set(nodes.map((n) => n.id));
  commit(`Pasted ${nodes.length} symbol(s)`);
  render(); renderProps();
}

function rotateSelection(delta) {
  const nodes = selNodes();
  if (!nodes.length) return;
  for (const n of nodes) n.rot = (((n.rot + delta) % 360) + 360) % 360;
  routeEdges(ED.doc, incidentEdges(new Set(nodes.map((n) => n.id))));
  commit("Rotated"); render(); renderProps();
}

function flipSelection() {
  const nodes = selNodes();
  if (!nodes.length) return;
  for (const n of nodes) n.flip = !n.flip;
  routeEdges(ED.doc, incidentEdges(new Set(nodes.map((n) => n.id))));
  commit("Mirrored"); render(); renderProps();
}

function nudge(dx, dy) {
  const nodes = selNodes();
  if (!nodes.length) return;
  for (const n of nodes) { n.x = round4(n.x + dx); n.y = round4(n.y + dy); }
  routeEdges(ED.doc, incidentEdges(new Set(nodes.map((n) => n.id))));
  commit("Nudged"); render();
}

function runAutoArrange() {
  const t0 = performance.now();
  const rep = autoArrange(ED.doc);
  commit("Auto-arranged");
  render(); renderProps();
  const ms = Math.round(performance.now() - t0);
  setStatus(`Auto-arranged in ${ms} ms` + (rep.warnings.length ? ` — ${rep.warnings.join(" ")}` : ""));
}

function runReroute() {
  for (const e of ED.doc.edges) delete e.pts;
  const r = routeEdges(ED.doc);
  commit("Re-routed");
  render();
  setStatus(r.failed ? `${r.failed} connection(s) could not be routed cleanly — try Auto-arrange or move symbols apart.` : "All connections re-routed");
}

/** Align / distribute selected nodes by their bodies. */
function alignSelection(how) {
  const nodes = selNodes();
  if (nodes.length < 2) return;
  const gs = nodes.map((n) => [n, ED.geoms.get(n.id) || nodeGeom(ED.doc, n)]);
  const xs = gs.map(([, g]) => g.body), anchor = xs[0];
  if (how === "hdist" || how === "vdist") {
    const k = how === "hdist" ? 0 : 1;
    gs.sort((a, b) => (k ? R.cy(a[1].body) - R.cy(b[1].body) : R.cx(a[1].body) - R.cx(b[1].body)));
    const c0 = k ? R.cy(gs[0][1].body) : R.cx(gs[0][1].body), c1 = k ? R.cy(gs[gs.length - 1][1].body) : R.cx(gs[gs.length - 1][1].body);
    gs.forEach(([n, g], i) => {
      const target = c0 + (c1 - c0) * i / (gs.length - 1);
      const cur = k ? R.cy(g.body) : R.cx(g.body);
      if (k) n.y = round4(snap(n.y + target - cur, GRID / 2)); else n.x = round4(snap(n.x + target - cur, GRID / 2));
    });
  } else {
    for (const [n, g] of gs) {
      if (how === "left") n.x = round4(n.x + anchor[0] - g.body[0]);
      if (how === "hcenter") n.x = round4(n.x + R.cx(anchor) - R.cx(g.body));
      if (how === "right") n.x = round4(n.x + anchor[2] - g.body[2]);
      if (how === "top") n.y = round4(n.y + anchor[3] - g.body[3]);
      if (how === "vcenter") n.y = round4(n.y + R.cy(anchor) - R.cy(g.body));
      if (how === "bottom") n.y = round4(n.y + anchor[1] - g.body[1]);
    }
  }
  routeEdges(ED.doc, incidentEdges(new Set(nodes.map((n) => n.id))));
  commit("Aligned"); render();
}

function onKeyDown(ev) {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  const k = ev.key, mod = ev.ctrlKey || ev.metaKey;
  if (k === " ") { ED.spaceDown = true; ev.preventDefault(); return; }
  if (mod && k.toLowerCase() === "z") { ev.preventDefault(); ev.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && k.toLowerCase() === "y") { ev.preventDefault(); doRedo(); return; }
  if (mod && k.toLowerCase() === "c") { if (copySelection()) ev.preventDefault(); return; }
  if (mod && k.toLowerCase() === "v") { ev.preventDefault(); paste(); return; }
  if (mod && k.toLowerCase() === "d") { ev.preventDefault(); if (copySelection()) paste(); return; }
  if (mod && k.toLowerCase() === "a") { ev.preventDefault(); ED.sel = new Set(ED.doc.nodes.map((n) => n.id)); renderOverlay(); renderProps(); return; }
  if (mod) return;
  if (k === "Escape") { if (ED.place) cancelPlace(); ED.sel.clear(); ED.mode = null; renderOverlay(); renderProps(); return; }
  if (k === "Delete" || k === "Backspace") { ev.preventDefault(); deleteSelection(); return; }
  if (k === "r" || k === "R") { rotateSelection(ev.shiftKey ? -90 : 90); return; }
  if (k === "f" || k === "F") { flipSelection(); return; }
  if (k === "a" || k === "A") { runAutoArrange(); return; }
  if (k === "0") { zoomFit(); return; }
  if (k === "+" || k === "=") { zoomAt(1.25, ED.view.x + ED.view.w / 2, ED.view.y + ED.view.h / 2); return; }
  if (k === "-") { zoomAt(0.8, ED.view.x + ED.view.w / 2, ED.view.y + ED.view.h / 2); return; }
  const step = ev.shiftKey ? GRID * 4 : GRID;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  if (arrows[k] && ED.sel.size) { ev.preventDefault(); nudge(...arrows[k]); }
}
function onKeyUp(ev) { if (ev.key === " ") ED.spaceDown = false; }

function bindCanvas() {
  const svg = svgEl();
  svg.addEventListener("pointerdown", onPointerDown);
  svg.addEventListener("pointermove", onPointerMove);
  svg.addEventListener("pointerup", onPointerUp);
  svg.addEventListener("pointerleave", () => { if (ED.place) { ED.place.ghostAt = null; renderOverlay(); } });
  svg.addEventListener("wheel", onWheel, { passive: false });
  svg.addEventListener("contextmenu", (e) => e.preventDefault());
  svg.addEventListener("dragover", (e) => e.preventDefault());
  svg.addEventListener("drop", (e) => {
    e.preventDefault();
    const i = e.dataTransfer.getData("text/x-palette");
    const entry = paletteEntries()[+i];
    if (entry) placeAt(entry, eventPt(e));
  });
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  window.addEventListener("resize", () => { applyView(); render(); });
}

// ---------------------------------------------------------------- palette
const paletteEntries = () => PALETTE[libOf(ED.doc)];
const _previewCache = new Map();

function paletteSvg(entry) {
  const key = entry.sym + JSON.stringify(entry.props) + ED.doc.font;
  if (_previewCache.has(key)) return _previewCache.get(key);
  const sym = SYMBOLS[entry.sym];
  const n = { id: "pv", sym: entry.sym, x: 0, y: 0, rot: 0, flip: false, tag: "", text: "",
              props: Object.assign(defaultProps(entry.sym), entry.props || {}), labelPos: "none",
              ...(sym.bus ? { len: 1.0 } : {}) };
  const doc = { ...ED.doc, symScale: 1 };
  const sh = new Sheet(docFont(doc));
  sym.draw(new SymCtx(sh, 0, 0, 0, false, 1), n, doc);
  const g = computeGeom(doc, n, new Set());
  const b = R.inflate(g.body, 0.06);
  const w = Math.max(R.w(b), 0.5), h = Math.max(R.h(b), 0.3);
  const cx = R.cx(b), cy = SHEET_H - R.cy(b);
  const svg = `<svg viewBox="${cx - w / 2} ${cy - h / 2} ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="${sh.font.css.replace(/"/g, "'")}">` +
              `${sheetToSvgContent(sh, { minStroke: 0.012 })}</svg>`;
  _previewCache.set(key, svg);
  return svg;
}

function renderPalette() {
  const list = $("#paletteList");
  const q = $("#paletteSearch").value.trim().toLowerCase();
  const entries = paletteEntries();
  const cats = [];
  entries.forEach((en, i) => {
    if (q && !(`${en.name} ${en.cat} ${SYMBOLS[en.sym].name}`.toLowerCase().includes(q))) return;
    let c = cats.find((x) => x.cat === en.cat);
    if (!c) cats.push(c = { cat: en.cat, items: [] });
    c.items.push([en, i]);
  });
  list.replaceChildren(...cats.flatMap(({ cat, items }) => [
    el("div", { class: "pal-cat" }, cat),
    el("div", { class: "pal-grid" }, items.map(([en, i]) => {
      const item = el("div", { class: "pal-item", draggable: "true", title: en.name });
      item.innerHTML = paletteSvg(en);
      item.append(el("span", {}, en.name));
      item.addEventListener("click", (ev) => onPaletteClick(en, item, ev));
      item.addEventListener("dragstart", (ev) => { ev.dataTransfer.setData("text/x-palette", String(i)); });
      return item;
    })),
  ]));
}

function onPaletteClick(entry, item, ev) {
  if (!ev.shiftKey && ED.sel.size === 1 && addConnected(entry)) return;
  if (ED.place && ED.place.sym === entry.sym && ED.place.name === entry.name) { cancelPlace(); return; }
  $$(".pal-item.active").forEach((x) => x.classList.remove("active"));
  item.classList.add("active");
  ED.place = { ...entry };
  svgEl().classList.add("placing");
  setStatus(`Click on the sheet to place ${entry.name} (drop it on a line to insert it). Shift-click places several; Esc cancels.`);
}

}
function button(text, onClick, cls = "") { return el("button", { class: cls, onclick: onClick }, text); }

/** Reroute the connections of these nodes after a property change that moves ports. */
function rerouteAround(ids) {
  fitBuses(ED.doc, new Set(ids));
  routeEdges(ED.doc, incidentEdges(new Set(ids)));
}

function renderProps() {
  const box = $("#props");
  const nodes = selNodes(), edges = selEdges();
  if (nodes.length === 1 && !edges.length) return box.replaceChildren(...nodeProps(nodes[0]));
  if (edges.length === 1 && !nodes.length) return box.replaceChildren(...edgeProps(edges[0]));
  if (nodes.length + edges.length > 1) return box.replaceChildren(...multiProps(nodes, edges));
  box.replaceChildren(...docProps());
}

function nodeProps(n) {
  const sym = SYMBOLS[n.sym];
  const out = [el("h3", {}, sym.name), el("div", { class: "sub" }, n.tag || "untagged")];
  const geomChange = () => { rerouteAround([n.id]); };
  const tag = textInput(n.tag, (v) => { n.tag = v; geomChange(); }, { placeholder: sym.tag ? `${sym.tag}-1` : "" });
  const tagRow = el("div", { class: "row" }, tag);
  if (sym.tag) tagRow.append(el("button", { style: "flex:none", title: "Next free number", onclick: () => {
    n.tag = nextTag(ED.doc, sym.tag); commit(); render(); renderProps();
  } }, "Auto"));
  out.push(field("Tag", tagRow));
  for (const p of sym.props) {
    const cur = n.props[p.k] ?? "";
    const input = p.type === "select"
      ? selectInput(cur, p.options.map((o) => [o, o || "—"]), (v) => { n.props[p.k] = v; geomChange(); })
      : textInput(cur, (v) => { n.props[p.k] = v; geomChange(); });
    out.push(field(p.label, input));
  }
  out.push(field("Additional text (one line each)", textArea(n.text, (v) => { n.text = v; geomChange(); }, 2)));
  out.push(field("Label position", selectInput(n.labelPos, [["auto", "Automatic"], ["right", "Right"], ["left", "Left"],
    ["above", "Above"], ["below", "Below"], ["none", "Hidden"], ...(sym.bus ? [["end", "At end"]] : [])],
    (v) => { n.labelPos = v; geomChange(); })));
  if (sym.bus) {
    const auto = el("input", { type: "checkbox", checked: n.autoLen !== false });
    auto.addEventListener("change", () => { n.autoLen = auto.checked; rerouteAround([n.id]); commit(); render(); renderProps(); });
    out.push(el("label", { class: "check" }, auto, "Length follows its connections"));
    if (n.autoLen === false) {
      out.push(field("Length (in)", textInput(n.len ?? sym.defLen, (v) => { const x = parseFloat(v); if (x > 0.2) { n.len = x; geomChange(); } })));
    }

  out.push(el("div", { class: "section" }, "Arrange"));
  out.push(el("div", { class: "btnrow" },
    button("⟲ Rotate", () => rotateSelection(90)), button("⟳", () => rotateSelection(-90)),
    button("Mirror", () => flipSelection()), button("Delete", () => deleteSelection(), "danger")));
  out.push(el("p", { class: "note" }, "Drag a port (circle) to another symbol to connect. Click a palette symbol now to add it connected after this one."));
  return out;
}

function edgeProps(e) {
  const lib = libOf(ED.doc);
  const styles = Object.entries(EDGE_STYLES).sort((a, b) => (a[1].lib === lib ? 0 : 1) - (b[1].lib === lib ? 0 : 1));
  const from = nodeById(e.from.n), to = nodeById(e.to.n);
  const nm = (n) => n.tag || SYMBOLS[n.sym].name;

  out.push(field("Line type", selectInput(e.style, styles.map(([k, v]) => [k, v.name]), (v) => { e.style = v; })));
  out.push(field(lib === "pid" ? "Line label (size, service, number)" : "Conductor / raceway label",
    textArea(e.label, (v) => { e.label = v; }, 2, { placeholder: lib === "pid" ? '3/4" CW' : "(3) #6 CU + #10 G, 1\" PVC" })));
  out.push(field("Flow arrow", selectInput(e.arrow, [["none", "None"], ["mid", "Mid-line"], ["end", "At end"]], (v) => { e.arrow = v; })));
  out.push(el("div", { class: "btnrow" },

      [e.from, e.to] = [e.to, e.from];
      if (e.pts) e.pts = [...e.pts].reverse();

    }),
    button("Re-route", () => { routeEdges(ED.doc, new Set([e.id])); commit("Re-routed"); render(); }),
    button("Delete", () => deleteSelection(), "danger")));
  out.push(el("p", { class: "note" }, "Click a palette symbol now to insert it into this line."));
  return out;
}

// ----------------------------------------------------------- layout check
function checkLayout(doc) {
  const issues = [];
  const geoms = allGeoms(doc);
  const byId = new Map(doc.nodes.map((n) => [n.id, n]));
  const nodeById = (id) => byId.get(id);
  const name = (n) => (n ? n.tag || SYMBOLS[n.sym].name : "?");
  const ns = doc.nodes;
  for (let i = 0; i < ns.length; i++) {
    for (let j = i + 1; j < ns.length; j++) {
      const a = geoms.get(ns[i].id), b = geoms.get(ns[j].id);
      if (R.overlaps(a.outer, b.outer)) issues.push({ lvl: "error", msg: `${name(ns[i])} and ${name(ns[j])} overlap.`, ids: [ns[i].id, ns[j].id] });
      else if (R.overlaps(a.keep, b.keep)) issues.push({ lvl: "warn", msg: `${name(ns[i])} and ${name(ns[j])} are closer than the clearance.`, ids: [ns[i].id, ns[j].id] });
    }
  }
  const area = [IX0, IY0, IX1, IY1];
  const reserved = [IX1 - TB_W, IY0, IX1, notesLayout(doc).top];
  for (const n of ns) {
    const g = geoms.get(n.id);
    if (!R.contains(area, g.outer[0], g.outer[1]) || !R.contains(area, g.outer[2], g.outer[3])) {
      issues.push({ lvl: "error", msg: `${name(n)} is outside the drawing border.`, ids: [n.id] });
    } else if (R.overlaps(g.outer, reserved)) {
      issues.push({ lvl: "error", msg: `${name(n)} overlaps the title block / notes.`, ids: [n.id] });
    }
    const tp = throughPorts(n, doc);
    const used = connectedPorts(doc, n.id);
    if (tp && (!used.has(tp.inP.id) || !used.has(tp.outP.id)) && !SYMBOLS[n.sym].junction) {
      issues.push({ lvl: "info", msg: `${name(n)} has an unconnected ${!used.has(tp.inP.id) ? "inlet" : "outlet"}.`, ids: [n.id] });
    }
  }
  const paths = edgePaths(doc, geoms);
  const avoid = labelObstacles(doc, geoms);
  for (const e of doc.edges) {
    if (e.routeFailed) issues.push({ lvl: "warn", msg: `Connection ${name(nodeById(e.from.n))} → ${name(nodeById(e.to.n))} could not be routed cleanly.`, ids: [e.id] });
    const lab = edgeLabelLayout(doc, e, paths.get(e.id), avoid);
    if (lab) {
      avoid.push(lab.box);
      for (const n of ns) {
        const g = geoms.get(n.id);
        if (R.overlaps(lab.box, g.outer)) { issues.push({ lvl: "warn", msg: `The label on ${name(nodeById(e.from.n))} → ${name(nodeById(e.to.n))} runs into ${name(n)}.`, ids: [e.id, n.id] }); break; }
      }
    }
  }
  const tags = new Map();
  for (const n of ns) if (n.tag) { const k = n.tag.toUpperCase(); tags.set(k, [...(tags.get(k) || []), n.id]); }
  for (const [t, ids] of tags) if (ids.length > 1) issues.push({ lvl: "warn", msg: `Tag ${t} is used ${ids.length} times.`, ids });
  return issues;
}

function showCheck() {
  const issues = checkLayout(ED.doc);
  const list = $("#checkList");
  if (!issues.length) list.replaceChildren(el("div", { class: "ok" }, "No problems found."));
  else {
    const order = { error: 0, warn: 1, info: 2 };
    issues.sort((a, b) => order[a.lvl] - order[b.lvl]);
    list.replaceChildren(...issues.map((it) => el("div", {
      class: "issue",
      onclick: () => { ED.sel = new Set(it.ids); $("#checkDialog").hidden = true; renderOverlay(); renderProps(); },
    }, el("span", { class: `lvl ${it.lvl}` }, it.lvl === "warn" ? "WARNING" : it.lvl.toUpperCase()), el("span", {}, it.msg))));
  }
  $("#checkDialog").hidden = false;
}

// ------------------------------------------------------------- file / export
function fileName(ext) { return `${(ED.doc.name || "drawing").replace(/[^A-Za-z0-9_-]+/g, "_")}.${ext}`; }
function downloadBlob(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function exportDxf() {
  const { sheet } = renderDoc(ED.doc);
  downloadBlob(new Blob([sheetToDxf(sheet)], { type: "application/dxf" }), fileName("dxf"));
  setStatus(`Downloaded ${fileName("dxf")}`);
}

function printSheet() {
  const { sheet } = renderDoc(ED.doc);
  $("#printSheet").innerHTML = sheetToSvg(sheet, { width: "17in", height: "11in" });
  const prev = document.title;
  document.title = fileName("pdf").replace(/\.pdf$/, "");
  window.print();
  document.title = prev;
}

function bindUi() {
  $("#paletteSearch").addEventListener("input", renderPalette);
  $("#docSelect").addEventListener("change", (e) => switchDoc(+e.target.value));
  const menu = $(".menu");
  $("#btnNew").addEventListener("click", (e) => { e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", () => menu.classList.remove("open"));
  $$("[data-new]").forEach((b) => b.addEventListener("click", () => addDoc(newDoc(b.dataset.new))));
  $("#exampleList").replaceChildren(...Object.entries(examples()).map(([k, ex]) =>
    el("button", { onclick: () => loadExample(k) }, ex.name)));
  $("#btnDup").addEventListener("click", () => {
    const d = normalizeDoc(JSON.parse(cleanDoc(ED.doc)));
    d.id = uid("d"); d.name += " (copy)";
    addDoc(d);
  });
  $("#btnDelDoc").addEventListener("click", () => {
    if (!confirm(`Delete the drawing "${ED.doc.name}"? This cannot be undone.`)) return;
    ED.store.docs.splice(ED.store.cur, 1);
    if (!ED.store.docs.length) ED.store.docs.push(newDoc("oneline"));
    switchDoc(Math.min(ED.store.cur, ED.store.docs.length - 1));
  });
  $("#btnUndo").addEventListener("click", doUndo);
  $("#btnRedo").addEventListener("click", doRedo);
  $("#btnArrange").addEventListener("click", runAutoArrange);
  $("#btnRoute").addEventListener("click", runReroute);
  $("#btnCheck").addEventListener("click", showCheck);
  $("#checkClose").addEventListener("click", () => { $("#checkDialog").hidden = true; });
  $("#checkDialog").addEventListener("click", (e) => { if (e.target.id === "checkDialog") e.target.hidden = true; });
  $("#btnImport").addEventListener("click", () => $("#fileInput").click());
  $("#fileInput").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : [data];
      for (const d of list) {
        const doc = normalizeDoc(d);
        doc.id = uid("d");
        if (doc.nodes.some((n) => !n.x && !n.y)) autoArrange(doc); else routeEdges(doc);
        ED.store.docs.push(doc);
      }
      switchDoc(ED.store.docs.length - 1);
      setStatus(`Imported ${list.length} drawing(s)`);
    } catch (err) { alert("Could not read that file: " + err.message); }
  });
  $("#btnSaveJson").addEventListener("click", () =>
    downloadBlob(new Blob([JSON.stringify(JSON.parse(cleanDoc(ED.doc)), null, 1)], { type: "application/json" }), fileName("json")));
  $("#btnDxf").addEventListener("click", exportDxf);
  $("#btnPrint").addEventListener("click", printSheet);
  $("#zoomIn").addEventListener("click", () => zoomAt(1.25, ED.view.x + ED.view.w / 2, ED.view.y + ED.view.h / 2));
  $("#zoomOut").addEventListener("click", () => zoomAt(0.8, ED.view.x + ED.view.w / 2, ED.view.y + ED.view.h / 2));
  $("#zoomFit").addEventListener("click", zoomFit);
  for (const [id, k] of [["#optKeep", "keep"], ["#optGrid", "grid"], ["#optAvoid", "avoid"]]) {
    $(id).checked = ED.opts[k];
    $(id).addEventListener("change", (e) => { ED.opts[k] = e.target.checked; renderGrid(); renderOverlay(); });
  }
}

// ------------------------------------------------------------------ start
(async function init() {
  try { await loadEmbeddedFonts(); } catch (e) { console.error("font load failed", e); }
  loadStore();
  if (!ED.store.docs.length) {
    for (const ex of Object.values(examples())) {
      const doc = normalizeDoc(clone(ex));
      autoArrange(doc);
      ED.store.docs.push(doc);
    }
    ED.store.cur = 0;
  }
  bindUi();
  bindCanvas();
  renderGrid();
  switchDoc(ED.store.cur);
  window.DD = { ED, autoArrange, routeEdges, renderDoc, sheetToDxf, sheetToSvg, normalizeDoc, checkLayout, nodeGeom, allGeoms };
})();

</script>
</body>
</html>
