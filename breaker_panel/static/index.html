<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Directory Drafter</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Panel Directory Drafter <span>ANSI B · 11×17 portrait</span></div>
  <div class="panels">
    <label for="panelSelect">Panel</label>
    <select id="panelSelect"></select>
    <button id="btnNew" title="New blank panel">New</button>
    <button id="btnDup" title="Duplicate this panel">Duplicate</button>
    <button id="btnDel" class="danger" title="Delete this panel">Delete</button>
  </div>
  <div class="exports">
    <button id="btnImport" title="Load a saved .json configuration">Import JSON</button>
    <button id="btnExportJson" title="Save configuration as .json">Save JSON</button>
    <span class="sep"></span>
    <button id="btnPdf">PDF</button>
    <button id="btnDwg" title="Requires ODA File Converter on the server">DWG</button>
    <button id="btnDxf" class="primary">Download DXF</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<main>
  <section class="editor" id="editor">
    <details open class="card">
      <summary>Panel information</summary>
      <div class="grid">
        <label>Panel name<input data-k="name"></label>
        <label>Location<input data-k="location" placeholder="e.g. Garage, north wall"></label>
        <label>Manufacturer<input data-k="manufacturer"></label>
        <label>Model / catalog no.<input data-k="model"></label>
        <label>Service
          <input data-k="voltage" list="voltages">
          <datalist id="voltages">
            <option value="120/240V 1Φ 3W"><option value="120/208V 3Φ 4W"><option value="120/208V 1Φ 3W"><option value="277/480V 3Φ 4W">
          </datalist>
        </label>
        <label>Phases
          <select data-k="phases" data-num><option value="1">Single phase (L1/L2)</option><option value="3">Three phase (A/B/C)</option></select>
        </label>
        <label>Main
          <select data-k="main.kind"><option value="breaker">Main breaker</option><option value="lugs">Main lugs only</option></select>
        </label>
        <label>Main rating (A)<input data-k="main.amps" data-num type="number" min="0" step="5"></label>
        <label>Bus rating (A)<input data-k="bus_amps" data-num type="number" min="0" step="5"></label>
        <label>Fed from<input data-k="fed_from" placeholder="e.g. Utility meter / Panel A ckt 6,8"></label>
        <label>Spaces
          <input data-k="spaces" data-num type="number" min="2" max="84" step="2" data-structural>
        </label>
        <label>Numbering
          <select data-k="numbering" data-structural>
            <option value="odd_even">Odd left / even right</option>
            <option value="sequential">Down left, then down right</option>
          </select>
        </label>
      </div>
    </details>

    <details open class="card">
      <summary>Breakers <span class="hint">Set each space as it physically sits in the box. Multi-space breakers claim the spaces below them.</span></summary>
      <div class="usage" id="usage"></div>
      <div class="slots" id="slots"></div>
    </details>

    <details class="card">
      <summary>Notes</summary>
      <textarea id="notes" rows="5" placeholder="One note per line"></textarea>
    </details>

    <details class="card">
      <summary>Title block</summary>
      <div class="grid">
        <label>Project / property<input data-k="titleblock.project"></label>
        <label>Drawing title<input data-k="titleblock.title" placeholder="(auto: PANEL NAME — PANEL DIRECTORY)"></label>
        <label>Drawn by<input data-k="titleblock.drawn_by"></label>
        <label>Date<input data-k="titleblock.date" type="date"></label>
        <label>Dwg no.<input data-k="titleblock.dwg_no"></label>
        <label>Rev<input data-k="titleblock.rev"></label>
        <label>Sheet<input data-k="titleblock.sheet" placeholder="1 OF 1"></label>
        <label>Descriptions
          <select data-k="titleblock.uppercase"><option value="1">ALL CAPS</option><option value="0">As typed</option></select>
        </label>
      </div>
    </details>
  </section>

  <section class="preview">
    <div class="preview-bar">
      <span id="status">Ready</span>
      <span class="zoom">
        <button id="zoomOut" title="Zoom out">−</button>
        <button id="zoomFit" title="Fit">Fit</button>
        <button id="zoomIn" title="Zoom in">+</button>
      </span>
    </div>
    <div id="messages"></div>
    <div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
  </section>
</main>

<datalist id="ampList">
  <option value="15"><option value="20"><option value="25"><option value="30"><option value="35"><option value="40"><option value="45"><option value="50"><option value="60"><option value="70"><option value="80"><option value="90"><option value="100"><option value="125"><option value="150"><option value="200">
</datalist>
<script src="/static/app.js"></script>
</body>
</html>
